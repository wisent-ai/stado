- id: stado
  name: Stado
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/stado
  description: Fleet control plane for queues, jobs, placement, leases, hosts, declared services, and the Wisent product catalog with every product's installation and signing.
  submit:
    criticality: critical
  roadmap:
  - title: Add AWS managed autoscaling
    status: planned
    outcome: Implement and qualify an Amazon EC2 Auto Scaling managed-compute adapter.
    source: https://stado.wisent.com/docs/integrations
  - title: Add Azure managed autoscaling
    status: planned
    outcome: Implement and qualify an Azure VM Scale Sets managed-compute adapter.
    source: https://stado.wisent.com/docs/integrations
  - title: Earn from the idle GPU on a compute marketplace
    status: in_progress
    outcome: List the idle GPU automatically on Vast.ai and withdraw the offer when fleet work returns; the capability ships and awaits its credential.
    source: https://stado.wisent.com/docs/vast
  - title: Lend idle workers to another Stado fleet
    status: in_progress
    outcome: Run a standalone worker against a peer fleet's queue while this fleet has no work, withdraw it by draining when work returns, and account the peer's completed jobs at the offered price.
    source: https://stado.wisent.com/docs/peer-fleets
  - title: Sell tokens from the fleet's own inference endpoint
    status: planned
    outcome: Publish the OpenAI-compatible deployment behind a public origin with declared prices, throughput and rate limits, so model output is sold per token while yieldable mode keeps the board available to fleet work.
    source: https://stado.wisent.com/docs/earning
  - title: Become an inference provider on OpenRouter
    status: planned
    outcome: List the fleet's OpenAI-compatible deployment as an OpenRouter inference provider with per-token prices, so its customers buy our model output without a storefront of our own.
    source: https://stado.wisent.com/docs/earning
  - title: Operate a customer's own fleet
    status: planned
    outcome: Run enrollment, placement, delivery, declared repair and evidence for machines and cloud accounts the customer owns, with the provider's cost and the management fee separately visible.
    source: https://stado.wisent.com/docs/earning
  - title: Sell macOS builds, signing and updates
    status: planned
    outcome: Offer the publisher runner, Developer ID signing, notarization and Sparkle publication as a paid surface per release or per repository.
    source: https://stado.wisent.com/docs/earning
  - title: Sell interactive GPU sessions
    status: planned
    outcome: Charge for a streamed display session on a fleet GPU, which a container marketplace cannot serve.
    source: https://stado.wisent.com/docs/earning
  - title: Sell browser work with a verifiable receipt
    status: planned
    outcome: Charge per authorized browser run whose signed receipt an independent client verifies.
    source: https://stado.wisent.com/docs/earning
  - title: Host releases and updates for other products
    status: planned
    outcome: Offer the immutable object plane, channels, promotion, rollback and public hostnames as a subscription for a product whose updates Stado carries.
    source: https://stado.wisent.com/docs/earning
  - title: Sell disposable isolated environments
    status: planned
    outcome: Charge per lease for a scratch target that is destroyed when the run ends.
    source: https://stado.wisent.com/docs/earning
  - title: Sell cloud cost reduction as a service
    status: planned
    outcome: Charge for attributed cost, forecast, anomaly and savings reporting with autonomy budgets that block new cloud spend, against a customer's own accounts.
    source: https://stado.wisent.com/docs/earning
