  - surface: desktop
    kind: desktop-release
    repository: wisent-ai/oko-desktop
    manifest: .wisent-desktop-release.json
  approved_by: operator
  approved_at: 2026-09-02T19:53:07Z
  approval_note: Approved as an installable Wisent product with both a CLI and a desktop surface.
  service:
    installable: true
    unit: com.wisent.oko
    program: $HOME/.stado/bin/oko
    args:
    - serve
    env:
      PATH: $HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    summary: The one Oko process per host (oko serve), which owns the PTY broker; autonomy, the Slack responder, catalogue synchronisation and task handover are Oko routines Stado schedules.
  dependencies:
  - product: brama
    surface: service
    for_surface: service
    alternative: oko model set declares an OpenAI-compatible service every model call then asks; without any model service, what each message is, is recorded with oko tasks kind and a task is closed with oko tasks close or Close on Oko Desktop
    alternative_source: oko/rust/src/tasks/judge/provider.rs
  - product: stado
    surface: cli
    for_surface: cli
    alternative: the mail channel is Oko's own, sent through the provider oko contact mail set declared, and oko-ios through the database's push function; every other paged channel of oko asks ask (skrzynka, slack, telegram, …) is one Stado pages through and is refused by name without it
    alternative_source: oko/rust/src/asks/mail/mod.rs
  - product: wisent-app
    surface: service
    for_surface: cli
    bound_because: 'only a task Oko routes through the Brama proxy to a harness that speaks Brama own contract (the proxiedRuntimes of pty/broker/routing.json, jeden and omp) names it: Oko hands that session the agent identity oko as WISENT_APP_AGENT_ID beside the lease it runs on; sessions on every other harness, and Oko itself, run without it'
  - product: skarbiec
    surface: cli
    for_surface: cli
    alternative: 'OKO_DATABASE_URL and OKO_DATABASE_ANON_KEY reach the database with no Skarbiec read, so tasks, defects and the registers run without Skarbiec; only the features that hold a service credential read it from Skarbiec: calendar accounts (from the broker or the vault SKARBIEC_VAULT_FILE names, through the skarbiec CLI), GitHub repository execution, Ultrareach sends and the PTY relay'
    alternative_source: oko/rust/src/database/resolved.rs
  - product: tama
    surface: cli
    for_surface: cli
    alternative: the session listing reads tama hooks abandoned only to name the hook a refused call was still waiting on; without Tama it lists every session and names the failed reading once beside the rows as tamaFailure. Only the delivery of Tama's rule proposals asks tama rules digest, and it is refused naming why tama could not run; every other command runs without Tama
    alternative_source: oko/rust/src/pty/client/agents/tama/mod.rs
  - product: jeden
    surface: cli
    for_surface: cli
    bound_because: an autonomy tick pursues a goal by running Jeden Pursuit (OKO_JEDEN_BIN, else ~/.stado/bin/jeden) and accepts only the receipt and verdict Jeden writes, so without Jeden that tick cannot start a pursuit; Jeden is otherwise one of the agent harnesses Oko lists, and tasks, defects, asks, the session listing and every other harness run without it
  - product: needher
    surface: web
    for_surface: cli
    alternative: 'Oko reaches nothing of Need Her: NEEDHER_GENERATION_WORKER_URL appears only in an operator message recorded in Oko''s intent-evaluation data set'
    alternative_source: oko/Evaluation/auto-goals/intent-eval.jsonl
