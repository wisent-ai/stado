    for_surface: cli
    alternative: the GAC app hook asks Skarbiec only for config values written as skarbiec://ITEM/FIELD; a config that holds the values themselves is read as written, with no Skarbiec call
    alternative_source: probierz/probierz-rs/src/apphooks/gac/render.rs
