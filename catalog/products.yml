- id: jeden
  name: Jeden
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/jeden
  description: Private, local-first coding-agent harness with controlled tools and
    durable sessions.
  roadmap:
  - title: Freeze the production contracts
    status: planned
    outcome: Version the capability, operation, session, Brama, Weles, SDK, release,
      marketplace and worker contracts before parallel implementation.
    source: jeden/roadmap/roadmap.yaml:69-111
  - title: Ship one canonical session service
    status: planned
    outcome: Serve TUI, CLI, RPC, ACP, SDK and headless clients through one protocol
      and one typed session ledger.
    source: jeden/roadmap/roadmap.yaml:93-107
  - title: Complete production certification
    status: planned
    outcome: Pass all 23 behavioral acceptance scopes against one signed release digest.
    source: jeden/roadmap/roadmap.yaml:115-551
  integrations:
  - product: brama
    description: Jeden sends every model request through Brama.
    source: jeden/README.md:80-95
  - product: weles
    description: Jeden delegates identity and account operations to Weles.
    source: jeden/roadmap/roadmap.yaml:87-91
  - product: stado
    description: Stado selects the execution host and carries Jeden's attached stream.
    source: https://stado.wisent.com/docs
  - product: skarbiec
    description: Jeden acquires its own scoped credentials from Skarbiec.
    source: https://skarbiec.wisent.com/docs
  - product: tama
    description: Tama supplies the coding-agent policy enforced around Jeden sessions.
    source: jeden/README.md:80-95
  - product: probierz
    description: Probierz records quality evidence for Jeden release gates.
    source: jeden/README.md:80-95
  - product: most
    description: Jeden uses Most for approved messaging connectors.
    source: jeden/README.md:80-95
  - product: oko
    description: Oko presents the team and session view over Jeden work.
    source: jeden/README.md:80-95
