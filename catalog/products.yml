authority:
  owner: stado
  rule: One record per product - something sold or used as a product of its own, as the
    operator decided. Repositories, surfaces, services, websites, libraries and
    infrastructure are attributes of a product; a package is not a product. Every
    record names its family, wisent or standalone, and that too is the operator's call.
products:
- id: ster
  name: Ster
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/ster
  description: Native representation reading, direction learning, evaluation and activation steering.
  roadmap: []
  integrations:
  - product: preferences
    description: Ster trains steering vectors from the contrastive pair sets Preferences exports as format ster-pairs.
    source: preferences/src/lib/validate.ts
  - product: skryba
    description: Ster trains a LoRA adapter from the writer's own prose Skryba exports — `ExampleSet` deserializes the file `ster tune sft` takes, and `PairSet` deserializes the pairs `ster tune dpo` takes.
    source: ster/src/tune.rs
  evidence:
  - wisent-landing-new/src/data/productPortals.ts
  - wisent-ai/ster/README.md
  - wisent-ai/ster-desktop/README.md
  surfaces:
  - kind: cli
    repository: wisent-ai/ster
  - kind: desktop
    repository: wisent-ai/ster-desktop
  installations:
  - surface: cli
    kind: stado-release
    repository: wisent-ai/ster
    manifest: .wisent-release.json
  - surface: desktop
    kind: desktop-release
    repository: wisent-ai/ster-desktop
    manifest: .wisent-desktop-release.json
  approved_by: operator
  approved_at: 2026-09-02T19:53:02Z
  approval_note: Approved as an installable Wisent product with both a CLI and a desktop surface.
  dependencies:
  - product: brama
    surface: service
    for_surface: cli
    alternative: pairs synthesize writes pairs with the local model by default (--generator local), pairs add authors them by hand, and decisions import reads labelled decisions from a JSONL file; only pairs synthesize --generator brama and decisions synthesize ask a hosted writer through Brama, and steering itself is always local
    alternative_source: ster/src/cli/decisions/mod.rs
  - product: stado
    surface: cli
    for_surface: desktop
    alternative: Ster Desktop runs the ster executable it finds first on PATH, then in ~/.local/bin, /opt/homebrew/bin or /usr/local/bin; ~/.stado/bin, where Stado installs Ster, is one more place it looks and nothing of Stado is run, and a ster found in none of them is refused as missing
    alternative_source: ster-desktop/Sources/SterDesktop/Client/RequestProcess.swift
- id: jeden
  name: Jeden
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/jeden
  description: Private, local-first coding-agent harness with controlled tools and durable sessions.
  roadmap:
  - title: Freeze the production contracts
    status: planned
    outcome: Version the capability, operation, session, Brama, Weles, SDK, release, marketplace and worker contracts before parallel implementation.
    source: jeden/roadmap/roadmap.yaml
  - title: Ship one canonical session service
    status: planned
    outcome: Serve TUI, CLI, RPC, ACP, SDK and headless clients through one protocol and one typed session ledger.
    source: jeden/roadmap/roadmap.yaml
  - title: Complete production certification
    status: planned
    outcome: Pass every behavioral acceptance scope against one signed release digest.
    source: jeden/roadmap/roadmap.yaml
  integrations:
  - product: brama
    description: Jeden sends its model requests through Brama unless JEDEN_MODEL_ENDPOINT names an OpenAI-compatible provider it calls directly.
    source: jeden/README.md
  - product: weles
    description: Jeden delegates identity and account operations to Weles.
    source: jeden/roadmap/roadmap.yaml
  - product: stado
    description: Stado selects the execution host and carries Jeden's attached stream.
    source: https://stado.wisent.com/docs
  - product: tama
    description: Tama supplies the coding-agent policy enforced around Jeden sessions.
    source: jeden/README.md
  - product: probierz
    description: Probierz records quality evidence for Jeden release gates.
    source: jeden/README.md
  - product: most
    description: Jeden uses Most for approved messaging connectors.
    source: jeden/README.md
  - product: oko
    description: Oko presents the team and session view over Jeden work.
    source: jeden/README.md
  evidence:
  - wisent-landing-new/src/data/productPortals.ts
  - wisent-ai/jeden/README.md
  surfaces:
  - kind: cli
    repository: wisent-ai/jeden
  - kind: desktop
    repository: wisent-ai/jeden-desktop
  - kind: mobile
    repository: wisent-ai/jeden-ios
  installations:
  - surface: cli
    kind: stado-release
    repository: wisent-ai/jeden
    manifest: .wisent-release.json
  - surface: desktop
    kind: desktop-release
    repository: wisent-ai/jeden-desktop
    manifest: .wisent-desktop-release.json
  approved_by: operator
  approved_at: 2026-09-02T19:53:03Z
  approval_note: Approved as an installable Wisent product with both a CLI and a desktop surface.
  dependencies:
  - product: brama
    surface: service
    for_surface: cli
    alternative: JEDEN_MODEL_ENDPOINT (with JEDEN_MODEL_KEY when the provider takes one) names an OpenAI-compatible provider every model call then goes to, unsigned and without leases
    alternative_source: jeden/rust/agent/credential/mod.rs
  - product: stado
    surface: cli
    for_surface: cli
    alternative: a BRAMA_URL the caller exports, or JEDEN_MODEL_ENDPOINT, answers the model route without asking Stado's service directory
    alternative_source: jeden/rust/agent/credential/mod.rs
  - product: tama
    surface: cli
    for_surface: cli
    alternative: with no Tama registry under the home, or JEDEN_TAMA_REGISTRY or hooks.tamaRegistry set to an empty path, Jeden runs every turn without Tama hooks
    alternative_source: jeden/rust/hooks/tama/mod.rs
  - product: oko
    surface: cli
    for_surface: cli
    alternative: an answered ask is delivered to the waiting Jeden sessions without Oko; the Oko twin delivery fails with Oko reason and the answer still stands
    alternative_source: jeden/rust/completion/asks/answer.rs
  - product: transcript-lake
    surface: cli
    for_surface: cli
    alternative: pursue reads Transcript Lake only when it may run commands (--allow-command or --yolo); every other pursuit and turn runs without it
    alternative_source: jeden/rust/autonomy.rs
  - product: wisent-app
    surface: service
    for_surface: cli
    alternative: JEDEN_MODEL_ENDPOINT (with JEDEN_MODEL_KEY when the provider takes one) sends every model call to an OpenAI-compatible provider unsigned, so no wisent-app agent identity signs it
    alternative_source: jeden/rust/agent/credential/mod.rs
  - product: weles
    surface: service
    for_surface: cli
    bound_because: jeden billing sets up and reads payment methods of a Weles account; it is the CLI face of Weles billing, and every other Jeden command runs without Weles
- id: brama
  name: Brama
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/brama
  description: Authenticated provider-neutral gateway for LLM inference and routing.
  roadmap: []
  integrations:
  - product: skarbiec
    description: Brama redeems provider credentials and capability routes from Skarbiec.
    source: https://brama.wisent.com/docs/integrations
  - product: weles
    description: Brama delegates browser-based account reauthentication to Weles.
    source: https://brama.wisent.com/docs/integrations
  evidence:
  - wisent-landing-new/src/data/productPortals.ts
  - wisent-ai/brama/README.md
  surfaces:
  - kind: service
    repository: wisent-ai/brama
  - kind: cli
    repository: wisent-ai/brama
  - kind: desktop
    repository: wisent-ai/brama-desktop
  installations:
  - surface: cli
    kind: stado-release
    repository: wisent-ai/brama
    manifest: .wisent-release.json
    after_install:
    - - stado
      - schedule
      - create
      - --id
      - '{install_id:hand-over}'
      - --converge
      - --pinned-host
      - '{host}'
      - --cron
      - '* * * * *'
      - PATH="$HOME/.stado/bin:$PATH" brama subscription handover claude-code --harness omp
  - surface: service
    kind: stado-release
    repository: wisent-ai/brama
    manifest: .wisent-release.json
    after_install:
    - - stado
      - schedule
      - create
      - --id
      - '{install_id:maintain}'
      - --converge
      - --pinned-host
      - '{host}'
      - --cron
      - '* * * * *'
      - '"$HOME"/.stado/services/brama/current/*/bin/brama maintain --gateway-consumer brama-desktop --bearer-role brama-desktop-model-router'
  - surface: desktop
    kind: desktop-release
    repository: wisent-ai/brama-desktop
    manifest: .wisent-desktop-release.json
  approved_by: operator
  approved_at: 2026-09-02T19:53:03Z
  approval_note: Approved as an installable Wisent product with both a CLI and a desktop surface.
  service:
    installable: true
    program: $HOME/.stado/services/brama/current/$STADO_PLATFORM/bin/start-with-skarbiec
    args: []
    env:
      PORT: $STADO_LISTEN_PORT
      BRAMA_WISENT_AUTH_URL: https://alvaewvbyxpgwdpugnxy.supabase.co
      BRAMA_WISENT_AUTH_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdmFld3ZieXhwZ3dkcHVnbnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTc5NDcsImV4cCI6MjA5Njk3Mzk0N30.xkkJ36ZTwtqyVZLFju0vc9S25grTuKbj9ILKlsXdUPA
    unit: com.wisent.brama
    summary: The authenticated provider-neutral gateway every Wisent model call goes through.
    answering:
      method: POST
      path: /v1/chat/completions
      body: {}
    state:
    - path: .stado/var/brama/donated-subscriptions.json
    - path: .brama
      tree: true
  dependencies:
  - product: skarbiec
    surface: service
    for_surface: service
    alternative: BRAMA_LOCAL_CREDENTIALS_FILE in ~/.config/brama/service.env names an owner-only provider-to-credential file; the service then starts in standalone mode without Skarbiec
    alternative_source: brama/src/release/bin/start-with-skarbiec
  - product: brama
    surface: cli
    for_surface: service
  - product: skrzynka
    surface: cli
    for_surface: service
    alternative: only subscription account discovery reads purchase receipts, through the skrzynka CLI; without SKRZYNKA_ORGANIZATION that step reports its refusal among the enrollment errors and the subscription reconciliation is skipped, while model routing and every gateway route run without Skrzynka
    alternative_source: brama/src/subscription_dispatch/discovery/enroll.rs
  - product: stado
    surface: cli
    for_surface: service
    alternative: brama serve --local-credentials-stdin runs Brama on its standalone in-memory provider credential store, managed through /v1/admin/credentials, as Brama Desktop does with keys from the macOS Keychain; the release launcher scripts, workload registration, version gate, Stado journey service and resolver-state readiness belong to a gateway Stado launches
    alternative_source: brama/src/cli/serving.rs
  - product: weles
    surface: service
    for_surface: service
    alternative: 'Brama never calls Weles: weles is the alias a Weles caller asks Brama for, which a gateway serving Wisent''s backend requires beside best, and a standalone gateway (brama serve --local-credentials-stdin) requires neither and serves without any Weles alias'
    alternative_source: brama/src/core/server/lifecycle/mod.rs
  - product: wisent-app
    surface: service
    for_surface: service
    alternative: 'Brama never calls the Wisent app: WISENT_APP_AGENT_ID and WISENT_APP_AGENT_AUTH_SECRET are named only in the documentation of the real image-selection test, as the signed caller identity that test sends to the gateway under test'
    alternative_source: brama/vercel-ingress/docs/testing.html
- id: weles
  name: Weles
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/weles
  description: Authorized browser-workflow execution across managed hosts.
  roadmap: []
  rivals:
  - id: browser-use
    name: Browser Use
    url: https://browser-use.com
    evidence: https://github.com/browser-use/browser-use
  - id: skyvern
    name: Skyvern
    url: https://www.skyvern.com
    evidence: https://github.com/Skyvern-AI/skyvern
  - id: stagehand
    name: Stagehand
    url: https://www.stagehand.dev
    evidence: https://github.com/browserbase/stagehand
  benchmark:
    app: weles
    suites:
    - web-agent-v1
  integrations:
  - product: brama
    description: Weles uses Brama when an authorized browser workflow needs model reasoning.
    source: weles/README.md
  - product: skarbiec
    description: Weles receives organization-scoped credentials through Skarbiec boundaries.
    source: https://weles.wisent.com/docs
  - product: stado
    description: Stado places Weles execution on an authorized managed host.
    source: https://weles.wisent.com/docs
  evidence:
  - wisent-landing-new/src/data/productPortals.ts
  - wisent-ai/weles/README.md
  surfaces:
  - kind: service
    repository: wisent-ai/weles
  - kind: desktop
    repository: wisent-ai/weles-desktop
  - kind: web
    repository: wisent-ai/weles-web
  - kind: library
    repository: wisent-ai/weles-client
  - kind: cli
    repository: wisent-ai/weles
  installations:
  - surface: service
    kind: stado-release
    repository: wisent-ai/weles
    manifest: .wisent-release.json
    release_product: weles-worker
  - surface: desktop
    kind: desktop-release
    repository: wisent-ai/weles-desktop
    manifest: .wisent-desktop-release.json
  - surface: cli
    kind: npm
    repository: wisent-ai/weles
    binaries:
    - weles
    - weles-mcp
  service:
    installable: true
    unit: com.wisent.weles
    program: $HOME/.stado/services/weles-admission/current/$STADO_PLATFORM/weles-api-launcher
    args: []
    directory_service: weles-admission
    env:
      WELES_API_HOST: $STADO_ALL_INTERFACES
      WELES_API_PORT: $STADO_LISTEN_PORT
    summary: One Weles process per host serving the API and admission, the resident task dispatcher that executes authorized browser workflows, and the keyword-planner routes.
    answering:
      method: GET
      path: /healthz
    acquisition_scopes: $HOME/.stado/services/weles-admission/current/$STADO_PLATFORM/skarbiec-acquisition-scopes.conf
    state:
    - path: .weles/keeper
      tree: true
    - path: .stado/weles-detached-runs
      tree: true
    - path: weles/var/worker.env
    - path: weles/var/worker-content.env
    - path: .config/weles/worker.env
    - path: .stado/weles-model.env
  approved_by: operator
  approved_at: 2026-09-02T19:53:03Z
  approval_note: Approved as an installable Wisent product with both a CLI and a desktop surface.
  dependencies:
  - product: brama
    surface: service
    for_surface: service
    alternative: WELES_MODEL_ENDPOINT and WELES_MODEL name an OpenAI-compatible provider for Weles' model calls
    alternative_source: weles/src/agent/jeden.ts
  - product: skarbiec
    surface: service
    for_surface: service
    alternative: WELES_CREDENTIALS_FILE names an owner-only credentials file Weles reads and writes instead of Skarbiec
    alternative_source: weles/src/secrets/scoped-service/local-file.ts
  - product: oko
    surface: cli
    for_surface: service
    alternative: a host with no oko records the Oko channel as not tried with that reason, and the operator request is paged through Stado alert channels instead
    alternative_source: weles/src/operator/oko-ask.mjs
  - product: wisent-app
    surface: service
    for_surface: service
    alternative: WELES_MODEL_ENDPOINT names an OpenAI-compatible provider; Jeden then runs with JEDEN_MODEL_ENDPOINT and signs nothing with a wisent-app agent identity
    alternative_source: weles/src/agent/jeden.ts
  - product: skrzynka
    surface: cli
    for_surface: service
    bound_because: 'only the PARP login trajectory reaches Skrzynka: it reads the password-reset mail PARP sends to the account mailbox Skrzynka keeps, and every other Weles workflow runs without it'
  - product: stado
    surface: cli
    for_surface: service
    alternative: 'WELES_STANDALONE set to one runs Weles on a machine without Stado: the host is the only Weles host and its placement is not checked, and a host with no Stado binary and no WELES_STANDALONE is refused naming it. Without the Stado model router the agent model is WELES_MODEL at WELES_MODEL_ENDPOINT, any OpenAI-compatible provider. Trajectories that act through wisent-integrations refuse naming STADO_INTEGRATION_API_URL or WELES_STADO_INTEGRATION_TOKEN when unset, and the hosted public task API keeps task artifacts under stado://weles/ through the Stado object API'
    alternative_source: weles/src/session/placement/service-placement.ts
  - product: spis
    surface: cli
    for_surface: service
    alternative: 'Weles never calls Spis: SPIS_BROWSER_EVIDENCE_POLICY is a browser-evidence policy Weles applies only to a run whose WELES_BROWSER_EVIDENCE_POLICY names its version, as a Spis caller sets it; every other run is driven without it'
    alternative_source: weles/src/agent/browser-evidence-policy/withheld-ledger.ts
  - product: jeden
    surface: cli
    for_surface: service
    bound_because: 'Weles asks every model question by running the jeden program (callJeden): the agent loop and its observation step, vision escalation and recorded vision, capture diagnosis, the trajectory writer and the trajectories that ask a model; Jeden then reaches Brama or the provider WELES_MODEL_ENDPOINT names, and no model path without Jeden exists'
- id: skarbiec
  name: Skarbiec
  status: active
  visibility: public
  family: wisent
  owner_repository: wisent-ai/skarbiec
  description: Credential and authentication management for people, agents and services.
  roadmap: []
  integrations:
  - product: weles
    description: Skarbiec uses Weles admission workflows for credential lifecycle operations.
    source: ARCHITECTURE.md
  evidence:
  - wisent-landing-new/src/data/productPortals.ts
  - wisent-ai/skarbiec/README.md
  surfaces:
  - kind: service
    repository: wisent-ai/skarbiec
  - kind: cli
    repository: wisent-ai/skarbiec
  - kind: desktop
    repository: wisent-ai/skarbiec-desktop
  installations:
  - surface: cli
    kind: stado-release
    repository: wisent-ai/skarbiec
    manifest: .wisent-release.json
    signing_keychain: $HOME/Library/Keychains/login.keychain-db
  - surface: service
    kind: stado-release
    repository: wisent-ai/skarbiec
    host_config:
      secrets.skarbiec.url: $STADO_SERVICE_URL
    manifest: .wisent-release.json
    signing_keychain: $HOME/Library/Keychains/login.keychain-db
  - surface: desktop
    kind: desktop-release
    repository: wisent-ai/skarbiec-desktop
    manifest: .wisent-desktop-release.json
    signing_keychain: $HOME/Library/Keychains/login.keychain-db
  approved_by: operator
  approved_at: 2026-09-02T19:53:04Z
  approval_note: Approved as an installable Wisent product with both a CLI and a desktop surface.
  service:
    installable: true
    unit: com.wisent.skarbiec
    program: $HOME/.stado/bin/skarbiec
    args:
    - serve
    - --port
    - $STADO_LISTEN_PORT
    env:
      SKARBIEC_VAULT_FILE: $HOME/.stado/skarbiec.vault.json
      SKARBIEC_CAP_SOCKET: $HOME/.stado/skarbiec.vault.sock
      SKARBIEC_AUDIT_FILE: $HOME/.stado/skarbiec.audit.jsonl
    summary: The credential and authentication vault; one process serves the HTTP API, the capability socket every workload redeems through, and replication of every bond the vault pulls.
    answering:
      method: GET
      path: /readyz
      repair:
      - crypto
      - audit-lock
    state:
    - path: .stado/skarbiec.vault.json
      required: true
    - path: .stado/skarbiec.vault.json.acquisitions.json
    - path: .stado/skarbiec.audit.jsonl
  dependencies:
  - product: stado
    surface: cli
    for_surface: cli
    alternative: SKARBIEC_VAULT_FILE names the vault Skarbiec opens directly, and it then reads no Stado config, forward file or owner route; with no Stado config on the machine the vault under the user data directory is opened. Only reaching a Skarbiec on another machine reads the skarbiec.local forward Stado's service directory writes, stado-wait is a library compiled into the binary, and the autofill extension takes its updates from the release feed on stado.wisent.com
    alternative_source: skarbiec/src/core/mod.rs
  - product: stado
    surface: cli
    for_surface: desktop
    alternative: SKARBIEC_URL names the Skarbiec service Skarbiec Desktop talks to, and then the forward Stado's service directory writes is not read; with neither, the app shows the refusal naming both
    alternative_source: skarbiec-desktop/Sources/SkarbiecDesktop/Backend/BackendClientError.swift
