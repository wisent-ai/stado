# OPTIONAL GCP-PROVIDER TOOL ONLY. The active Azure workflow never invokes
# this file, gcloud, gsutil, Cloud Build or the GCS release channel.
# Builds linux/amd64 stado binaries and publishes them as a release:
#   gs://wisent-compute/releases/stado/<version>/linux-amd64/{stado,wc,stado-*,SHA256SUMS}
# Submit with:  gcloud builds submit --config cloudbuild.yaml .
# Requires the Cargo.toml version to match the intended release version.
steps:
  - name: docker:24
    args: [build, -t, stado-rs-release, .]
  - name: docker:24
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        cid=$$(docker create stado-rs-release)
        mkdir -p /workspace/out
        docker cp "$$cid":/out/. /workspace/out/
        docker rm "$$cid" >/dev/null
        version_line=$$(grep '^version' Cargo.toml)
        version=$${version_line#*\"}
        version=$${version%%\"*}
        image="us-central1-docker.pkg.dev/$PROJECT_ID/stado/stado-coordinator:$$version"
        docker tag stado-rs-release "$$image"
        docker push "$$image"
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        version=$$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
        dest="gs://wisent-compute/releases/stado/$$version/linux-amd64"
        echo "publishing to $$dest"
        gsutil -m cp -r /workspace/out/* "$$dest/"
        # machine-readable pointer for self-update checks
        printf '{"version": "%s", "channel": "stable"}\n' "$$version" > /workspace/latest.json
        gsutil cp /workspace/latest.json gs://wisent-compute/releases/stado/latest.json
timeout: 3600s
options:
  machineType: E2_HIGHCPU_32
