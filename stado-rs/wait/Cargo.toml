[package]
name = "stado-wait"
version = "0.1.0"
edition = "2021"
description = "The one way a Wisent program waits: each wait on the network, an object API, a host channel, a lock, a child process or a database says on stderr what, where and since when, and how it ended"
license-file = "../../LICENSE"

# Stado re-exports this crate as `stado::wait`; a product that waits depends
# on it without linking the control plane.
[features]
# Both on by default, so every dependent waits as it did; a product that
# waits only on blocking work names `default-features = false` and takes
# neither client.
default = ["http", "async"]
# The HTTP and AWS SDK waits (`send`, `request`, `request_blocking`, `sdk`).
http = ["dep:reqwest"]
# The cancellable waits and the `tokio` process waits.
async = ["dep:tokio"]

[dependencies]
chrono = "0.4"
# `killpg`: a cancelled child's whole process group is ended before its pipes are drained.
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking"], optional = true }
# A measured operation's file is named by the digest of the operation.
sha2 = "0.10"
# `sync` and `macros` carry the cancellation event (`Notify`, `select!`);
# `io-util` the child pipe reads (`AsyncReadExt::read_to_end`).
tokio = { version = "1", features = ["process", "sync", "macros", "io-util"], optional = true }
