[package]
name = "stado"
version = "0.23.67"
edition = "2021"
description = "Policy-controlled queue and compute control plane for AI workloads"
license-file = "../LICENSE"
# Real product tests are declared explicitly from tests/<area>/.
autotests = false

# `database` is the crate products depend on to reach their fleet database
# through SeaORM, without linking the whole control plane.
[workspace]
members = [".", "product", "database"]
exclude = ["target"]

# The workspace's code says, in a `match`, what it reports when a value is
# absent ("not reported", "never", "(no region)"): the absence is a named
# answer at the place it is read, not a default an `unwrap_or` slips in, and
# the repository's write gates refuse `unwrap_or` for that reason. In the same
# way a `match` on a `Result` says why an error is passed over, and the write
# gates refuse `.ok()`, which drops it unsaid. Clippy's suggestions to fold
# those matches back into `unwrap_or` or `.ok()` are turned off so the lint
# gate and the write gates ask for the same code.
[workspace.lints.clippy]
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
manual_ok_err = "allow"

[lints]
workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
memchr = "2.8.3"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
russh = "=0.63.3"
plist = { version = "=1.8.0", default-features = false }
bytes = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The fleet's versioning rule, shared with every product that versions by
# surface; the rule alone, without the Python surface reader. The release
# gate's conformance check reads the fixtures at this same revision.
autoversion = { git = "https://github.com/lbartoszcze/AutoVersion", rev = "f7dde3c1461a292d72d8f956fc815f01a4ee4dca", default-features = false }
regex = "1"
# Release tag order by SemVer precedence (https://semver.org), pre-release identifiers included.
semver = "1"
# The module-reachability gate parses each source file and the crate manifest
# rather than scanning their text.
syn = { version = "2", features = ["full"] }
toml = "0.8"
base64 = "0.22"
# The S3 body checksums by the crates that define them: the CRC catalogue and MD5.
crc = "3"
md5 = "0.8"
# The S3 request documents (Delete, CompleteMultipartUpload) and XML escaping.
quick-xml = { version = "0.41", features = ["serialize"] }
url = "2"
futures = "0.3"
gcp_auth = "0.12"
ring = "*"
# "dir" provides dir-fd-relative enumeration for the local space-reclaim
# sandbox in providers/local/space_reclaim. "hostname" supplies the kernel's
# host identity for service reports. "feature" supplies sysconf, for the page
# size the Linux process reader multiplies resident pages by.
nix = { version = "0.30", features = ["signal", "process", "fs", "dir", "net", "user", "hostname", "feature"] }
aws-config = "1"
# Each SDK's default features less `rustls`, which is the SDK's legacy hyper
# client on the old rustls line, whose rustls-webpki has no release carrying
# the distrust of compromised intermediates; so every AWS call goes through
# `default-https-client`, the current hyper and rustls.
aws-sdk-ec2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-pricing = { version = "*", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
cron = "0.15"
chrono-tz = "0.10"
tar = "0.4"
flate2 = "1"
async-trait = "0.1"
tempfile = "3"
# The fleet's failure vocabulary. Extracted from src/failure.rs, so depending
# on it here replaces a local copy rather than adding a second opinion.
#
# Pinned to a commit, not to a branch. A shared failure vocabulary that moves
# under this crate with no commit here saying so is how the trim rule changed
# twice in one hour; the lock is the second guard, this rev is the first.
#
# `dc809f4` adds `refused`, for a policy that said no. Nothing in the previous
# seven codes described a refusal this fleet states itself: `not_found` sends
# an operator looking for a missing path, `auth` names a credential that was
# never presented, and `config` calls our deployment broken when it is working
# as declared. The allowlist below this crate's `host exec` needed exactly
# that word, and inventing it locally would have been the second vocabulary
# this dependency exists to prevent.
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", rev = "dc809f44cce81ac1b9b325f55fd9b2f3127930e9" }
# The Wisent product catalog and product lifecycle behind `stado product`,
# formerly the separate `wisent-products` program. Its catalog is
# `../catalog/products.yml` at the root of this repository.
stado-product = { path = "product" }
mdns-sd = "0.21"
stado-wait = { version = "0.1.0", path = "wait" }
# The Noise handshake and transport of Stado's own host network
# (`src/network`): IK over X25519, ChaCha20-Poly1305 and BLAKE2s, the
# construction WireGuard uses. The primitives come from this vetted library;
# the protocol on top is Stado's.
snow = "0.10"

# The local store's change watch (queue/local_file/change) is the kernel's own
# directory notification: kqueue on macOS, inotify on Linux. Each platform
# turns on only the nix module it has.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.30", features = ["event"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["inotify"] }

# The space-reclaim journeys measure the isolated volume's total and free
# space; locks are taken through std's File in tests as in the product.
[dev-dependencies]
fs2 = "0.4"

[[bin]]
name = "stado"
path = "src/bin/stado.rs"

