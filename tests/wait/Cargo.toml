[package]
name = "stado-wait-journeys"
version = "0.1.0"
edition = "2021"
description = "Real tests of stado::wait: the built stado binary waiting on a really held resource says so on stderr before it blocks"
license-file = "../../LICENSE"
publish = false
autotests = false
autobins = false

# Its own workspace root, so this package builds without a member entry in
# stado-rs/Cargo.toml.
[workspace]

# The stado binary itself, built from its own entry point against the stado
# library, so `CARGO_BIN_EXE_stado` names the real product program.
[[bin]]
name = "stado"
path = "../../stado-rs/src/bin/stado.rs"

[[test]]
name = "wait-held-lock"
path = "held_lock.rs"

[dependencies]
stado = { path = "../../stado-rs" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
fs2 = "0.4"
hex = "0.4"
sha2 = "0.10"
