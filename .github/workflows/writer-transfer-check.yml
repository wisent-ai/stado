name: Writer transfer check

on:
  pull_request:
    paths:
      - "stado-rs/src/cli/storage.rs"
      - ".github/workflows/writer-transfer-check.yml"

permissions:
  contents: read

concurrency:
  group: writer-transfer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-sized-read-back:
    runs-on: [self-hosted, stado-control-plane]
    # This gate and the release train both require the repository's only
    # `stado-control-plane` runner. They now queue for it through one shared
    # group that never cancels its holder, so this check waits behind a
    # publication instead of contending with it. The workflow-level group above
    # still supersedes this PR's own earlier runs; what it must never do is
    # displace a release train, because a release that dies part-way can strand
    # an immutable coordinate that no later attempt is able to complete.
    concurrency:
      group: stado-control-plane-runner
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      STADO_API_URL: http://127.0.0.1:18776
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build exact-head writer client
        run: cargo build --manifest-path stado-rs/Cargo.toml --locked --release --bin stado
      - name: Verify full immutable release object read-back
        run: |
          set -euo pipefail
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          version=""
          sums=""
          delivered=""
          # A tag can exist before its immutable coordinate is complete: the
          # release train may be cancelled before publication, or a failed
          # writer may have stored only the small objects. This job proves the
          # exact-head reader against complete published bytes, so walk the
          # channel in version order and say which incomplete coordinates were
          # skipped instead of treating the newest Git ref as a stored release.
          while IFS= read -r published_tag; do
            candidate_version="${published_tag#stado-v}"
            candidate_sums="$RUNNER_TEMP/stado-$candidate_version-SHA256SUMS"
            candidate_delivered="$RUNNER_TEMP/stado-$candidate_version-read-back"
            if "$stado_bin" storage get \
                 "stado://releases/stado/$candidate_version/linux-amd64/SHA256SUMS" \
                 "$candidate_sums" &&
               "$stado_bin" storage get \
                 "stado://releases/stado/$candidate_version/linux-amd64/stado" \
                 "$candidate_delivered"; then
              version="$candidate_version"
              sums="$candidate_sums"
              delivered="$candidate_delivered"
              break
            fi
            printf 'Skipping incomplete Stado coordinate %s\n' "$candidate_version"
          done < <(git tag --list 'stado-v*' --sort=-version:refname)
          test -n "$version"

          expected="$(sed -n 's/  stado$//p' "$sums")"
          test -n "$expected"
          actual="$(openssl dgst -sha256 "$delivered")"
          actual="${actual##* }"
          bytes="$(/usr/bin/stat -f %z "$delivered")"
          test "$bytes" -ge 50000000
          test "$actual" = "$expected"
          printf 'Verified %s bytes for immutable published Stado %s using writer %s\n' \
            "$bytes" "$version" "$GITHUB_SHA"
