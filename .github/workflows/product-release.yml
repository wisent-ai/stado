name: product release
run-name: product-release ${{ github.event.client_payload.repository }}@${{ github.event.client_payload.ref }}

on:
  repository_dispatch:
    types: [product-release]

concurrency:
  group: product-release-${{ github.event.client_payload.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      STADO_CONTROL_TARGET: ${{ vars.STADO_CONTROL_TARGET }}
      STADO_OBJECT_HOST: ${{ vars.STADO_OBJECT_HOST }}
    steps:
      - name: Require declared release targets
        run: |
          : "${STADO_CONTROL_TARGET:?Set the STADO_CONTROL_TARGET repository variable}"
          : "${STADO_OBJECT_HOST:?Set the STADO_OBJECT_HOST repository variable}"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate immutable release request
        env:
          PRODUCT_REPOSITORY: ${{ github.event.client_payload.repository }}
          PRODUCT_REF: ${{ github.event.client_payload.ref }}
          PRODUCT_VERSION: ${{ github.event.client_payload.version }}
          PRODUCT_CHANNEL: ${{ github.event.client_payload.channel }}
        run: |
          set -euo pipefail
          case "$PRODUCT_REPOSITORY" in
            wisent-ai/*) ;;
            *) echo "::error::repository must belong to wisent-ai"; false ;;
          esac
          [[ "$PRODUCT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          case "$PRODUCT_CHANNEL" in
            candidate|stable) ;;
            *) echo "::error::channel must be candidate or stable"; false ;;
          esac
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          path: product
          persist-credentials: false
      - name: Build release coordinator
        run: cargo build --locked --release --manifest-path stado-rs/Cargo.toml --bin stado
      - name: Submit exact product revision
        env:
          PRODUCT_VERSION: ${{ github.event.client_payload.version }}
          PRODUCT_CHANNEL: ${{ github.event.client_payload.channel }}
        run: |
          set -euo pipefail
          unset STADO_API_TOKEN
          # The release writer is this host's declared resolver adapter for the
          # object API. Its address is the one the resolver reports for that
          # adapter; the workflow carries no port of its own.
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          resolver_report="$RUNNER_TEMP/product-release-resolver.json"
          if ! "$stado_bin" resolver status --target "${STADO_CONTROL_TARGET:?}" --json \
              > "$resolver_report"; then
            echo "::notice::The resolver is globally degraded; checking the exact release adapter"
          fi
          # `resolver status` covers the directory authority and every adapter.
          # Product publication consumes one adapter, and the authenticated
          # write/read canary below proves its complete path. Do not block that
          # path on an unrelated global blocker.
          if ! writer_bind="$(jq -er '
            first(
              .adapters[] |
              select(
                .service == "stado-object-api" and
                .consumer == "stado-local-agent" and
                .listening == true
              ) |
              .bind
            )
          ' "$resolver_report")"; then
            cat "$resolver_report"
            echo "::error::the declared product-release adapter is not listening"
            exit 1
          fi
          STADO_WRITER_API_URL="http://$writer_bind"
          export STADO_API_URL="$STADO_WRITER_API_URL"
          export WC_STORAGE_BACKEND=stado
          export WC_STADO_STORAGE_URL="$STADO_WRITER_API_URL"
          export WC_STADO_STORAGE_NAMESPACE=probierz
          # The object API deliberately fails closed when its host-local Skarbiec
          # grant expires. Repair both declared verifier grants before probing the
          # channel, so a Skarbiec release does not depend on an already-healthy
          # Skarbiec authorization path.
          retry_reconcile() {
            for attempt in $(seq 1 6); do
              if "$@"; then
                return 0
              fi
              sleep "$((attempt * 5))"
            done
            return 1
          }
          release_product="$(jq -er '.product' "$GITHUB_WORKSPACE/product/.wisent-release.json")"
          retry_reconcile "$stado_bin" host reconcile-release-verifier \
            "${STADO_OBJECT_HOST:?}" --json
          canary="$RUNNER_TEMP/product-release-write-preflight.json"
          printf '{"schema":"stado.product-release-write-preflight.v1","source_commit":"%s"}\n' \
            "$GITHUB_SHA" > "$canary"
          canary_sha="$(openssl dgst -sha256 "$canary" | sed 's/^.*= //')"
          canary_uri="stado://sources/$release_product/__release_preflight__/$canary_sha.json"
          wait_for_channel() {
            for attempt in $(seq 1 24); do
              stored="$RUNNER_TEMP/product-release-write-preflight.stored.json"
              rm -f "$stored"
              if "$stado_bin" storage objects releases \
                   "$release_product/__release_preflight__" --json >/dev/null 2>&1 &&
                 { "$stado_bin" storage put "$canary_uri" "$canary" --if-absent \
                     >/dev/null 2>&1 || true; } &&
                 "$stado_bin" storage get "$canary_uri" "$stored" \
                   >/dev/null 2>&1 &&
                 cmp --silent "$canary" "$stored"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          if ! wait_for_channel; then
            # Older object API processes load verifier grants only at startup.
            # The declared service operation preserves the unit and Stado waits
            # for the real authenticated channel below before publication. The
            # unit is the host Stado process the catalog declares.
            "$stado_bin" product catalog --output "$RUNNER_TEMP/service-catalog.json"
            host_unit="$(
              jq -er '.services[] | select(.name == "stado") | .unit' \
                "$RUNNER_TEMP/service-catalog.json"
            )"
            "$stado_bin" service restart \
              "$host_unit" \
              --host "${STADO_OBJECT_HOST:?}" --json || true
            # The restart can close its own host transport before returning a
            # receipt. Only the authenticated write/read postcondition below
            # decides whether it succeeded. The declared local resolver
            # remains available when the host-control connection is replaced.
            wait_for_channel
          fi
          "$stado_bin" release submit \
            --source "$GITHUB_WORKSPACE/product" \
            --version "$PRODUCT_VERSION" \
            --channel "$PRODUCT_CHANNEL"
