name: deploy

on:
  push:
    branches: [main]
    paths:
      - "stado-rs/**"
      - "deploy/**"
      - "config/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: wisent-compute-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: wisent-480400
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1080673333190/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: wisent-compute-sa@wisent-480400.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Show identity
        run: gcloud auth list && gcloud config list

      # registry.json is no longer pushed from the repo: the file is
      # operator-owned (gitignored, replaced by registry.example.json
      # for documentation). Push your live registry to
      # gs://wisent-compute/registry.json out-of-band — running agents
      # re-fetch on every poll cycle.

      - name: Publish and deploy Rust coordinator
        run: bash deploy/deploy_stado_rust.sh

      - name: Verify deployed revision is ready
        # `gcloud run deploy` waits for the Rust revision to become Ready.
        # Record the active revisions for the deployment log.
        run: |
          gcloud run revisions list \
            --service=stado-coordinator \
            --region="${GCP_REGION}" \
            --project="${GCP_PROJECT}" \
            --limit=3 \
            --format="table(metadata.name,status.conditions[0].status,metadata.creationTimestamp)"
