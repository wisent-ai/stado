name: deploy

on:
  push:
    branches: [main]
    paths:
      - "stado-rs/**"
      - "deploy/**"
      - "config/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: wisent-compute-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_API_URL: https://stado.wisent.com
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-skarbiec-token
    steps:
      - uses: actions/checkout@v4

      - name: Make tags and history visible to the version check
        # actions/checkout fetches one commit and no tags, so `git tag --list` is
        # empty on a runner however many tags the remote holds. The version check
        # asks whether a better baseline than the committed one has become reachable,
        # and a tag it cannot see is a tag it cannot notice: the check would pass
        # while asleep, which is worse than not having it. Unshallowing matters
        # separately, because recovering a tag's surface needs that tag's tree; the
        # fallback is there because --unshallow refuses on a complete repository.
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      - name: Build provider-neutral Rust release
        run: |
          docker build --tag stado-rust-release stado-rs
          container="$(docker create stado-rust-release)"
          mkdir -p "$RUNNER_TEMP/stado-release"
          docker cp "$container:/out/." "$RUNNER_TEMP/stado-release/"
          docker rm "$container" >/dev/null
          version_line="$(sed -n '/^version = /p' stado-rs/Cargo.toml)"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          if [ -z "$version" ]; then
            echo "::error::Cargo release version is unresolved."
            false
          fi
          echo "STADO_VERSION=$version" >> "$GITHUB_ENV"

      - name: Refuse a release whose version disagrees with its contract
        # The public contract of this product is the command list `stado help`
        # advertises. The rule that turns a surface change into a version lives in one
        # place for the whole fleet and is not copied here:
        # https://github.com/lbartoszcze/AutoVersion. This step supplies only what
        # this repository knows — the surface of the artifact built above, and the
        # version that artifact declares.
        #
        # It sits in front of the first `storage put` on purpose. Release objects are
        # create-only, so a version published wrongly cannot be corrected afterwards;
        # a check behind the publish would only describe the damage. Everything
        # downstream, including the native release in deploy-control-plane, is gated
        # through this job's `needs`.
        run: |
          set -euo pipefail

          # Into a virtual environment under RUNNER_TEMP, because this control-plane
          # runner carries no global pip, and invoked by ABSOLUTE path below rather
          # than through PATH -- so there is no name for a stranger to answer to.
          python3 -m venv "$RUNNER_TEMP/autoversion"
          "$RUNNER_TEMP/autoversion/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          rule="$RUNNER_TEMP/autoversion/bin/autoversion"

          # Nothing so far has asked whether what was installed can still answer, and
          # a liveness probe would not settle it: a rule that replied a constant
          # `internal` satisfies every branch below, because with the declared version
          # equal to the baseline's, `internal` IS the passing branch. This gate stands
          # in front of create-only release objects, so a fabricated verdict here is
          # not correctable afterwards. Demand two answers no constant can give, built
          # from the COMMITTED baseline rather than from a synthetic pair, so the same
          # step also proves the frozen file is readable and is the one reaching the
          # decision. It consults only that file and writes only to RUNNER_TEMP, so it
          # cannot touch the release channel.
          jq '{surface: (.surface - [(.surface | sort | first)])}' released-surface.json \
            > "$RUNNER_TEMP/arm-removed.json"
          jq '{surface: .surface}' released-surface.json > "$RUNNER_TEMP/arm-identical.json"
          if [ "$(jq -r '.surface | length' "$RUNNER_TEMP/arm-removed.json")" = \
               "$(jq -r '.surface | length' released-surface.json)" ]; then
            echo "::error::the removal arm removed nothing, so it would prove nothing"
            false
          fi
          baseline_version="$(jq -r .version released-surface.json)"
          for arm in removed:breaking identical:internal; do
            name="${arm%%:*}"
            want="${arm##*:}"
            # Into a file, with the status tested on its own line: inside a command
            # substitution containing a pipeline the rule's status is discarded and
            # `set -e` does not reach, so a dead rule would read as an empty answer.
            if ! "$rule" decide --current "$baseline_version" \
                 --published-surface released-surface.json \
                 --candidate-surface "$RUNNER_TEMP/arm-$name.json" --json \
                 > "$RUNNER_TEMP/verdict-$name.json"; then
              echo "::error::the rule just installed failed outright on the $name arm," \
                   "so whether this gate can refuse is unknown"
              false
            fi
            got="$(jq -r .change "$RUNNER_TEMP/verdict-$name.json")"
            echo "self-test: $name -> $got (wanted $want)"
            if [ "$got" != "$want" ]; then
              echo "::error::the rule at $rule called the $name arm '$got' and not '$want'," \
                   "so no verdict of its about this release can be trusted"
              false
            fi
          done

          # Ask the exact bytes about to be published what they offer. Reading
          # src/cli/mod.rs instead would count the variants marked `hide = true`,
          # which dispatch but are not offered, and inflate the contract. The image
          # is used rather than the copied-out binary so this works whatever the
          # runner's own platform is.
          docker run --rm --entrypoint /out/stado stado-rust-release help \
            > "$RUNNER_TEMP/stado-help.txt"
          python3 scripts/surface.py --help-text "$RUNNER_TEMP/stado-help.txt" \
            > "$RUNNER_TEMP/candidate-surface.json"

          stado_bin="$HOME/.stado/bin/stado"
          STADO_API_TOKEN="$("$stado_bin" secrets get stado-release-publisher --field token)"
          export STADO_API_TOKEN
          AUTOVERSION="$RUNNER_TEMP/autoversion/bin/autoversion" \
            STADO_BIN="$stado_bin" \
            scripts/version_check.sh "$RUNNER_TEMP/candidate-surface.json"

      - name: Create immutable Linux release through Stado
        run: |
          stado_bin="$HOME/.stado/bin/stado"
          test -x "$stado_bin"
          test -n "$WC_SKARBIEC_URL"
          STADO_API_TOKEN="$("$stado_bin" secrets get stado-release-publisher --field token)"
          export STADO_API_TOKEN
          for source in "$RUNNER_TEMP"/stado-release/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$STADO_VERSION/linux-amd64/$name"
            if "$stado_bin" storage put "$uri" "$source" --if-absent; then
              continue
            fi
            existing="$RUNNER_TEMP/existing-$name"
            "$stado_bin" storage get "$uri" "$existing"
            if ! cmp --silent "$source" "$existing"; then
              echo "::error::Immutable release collision at $uri"
              false
            fi
          done

  deploy-control-plane:
    needs: release
    runs-on: [self-hosted, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_ENABLE_AZURE_DEPLOY: ${{ vars.STADO_ENABLE_AZURE_DEPLOY }}
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      COORD_TARGET: ${{ vars.STADO_COORDINATOR_TARGET }}
      STADO_API_URL: https://stado.wisent.com
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-skarbiec-token
      STADO_CONTROL_PLATFORM: ${{ vars.STADO_CONTROL_PLATFORM }}
      STADO_API_HOST: stado.wisent.com
      STADO_DASHBOARD_UPSTREAM: ${{ vars.STADO_DASHBOARD_UPSTREAM }}
    steps:
      - name: Check out exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/stado-source.XXXXXX")"
          git clone --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$source_dir"
          git -C "$source_dir" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "STADO_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Build native Rust control plane
        run: |
          cd "$STADO_SOURCE_DIR/stado-rs"
          cargo build --release --locked --bins

      - name: Validate selected deployment profile
        run: |
          if [ -z "$STADO_CONFIG" ] || [ ! -r "$STADO_CONFIG" ]; then
            echo "::error::STADO_CONFIG must name the persistent profile installed by SecretStateRepair."
            false
          fi
          if [ "$STADO_ENABLE_AZURE_DEPLOY" = true ]; then
            backend="$(jq -er '.storage.backend' "$STADO_CONFIG")"
            test "$backend" = azure
            ! jq -e '.providers_disabled // [] | index("azure") != null' "$STADO_CONFIG" >/dev/null
            jq -e '.providers // [] | index("azure") != null' "$STADO_CONFIG" >/dev/null
          fi

      - name: Create immutable native release through Stado
        run: |
          release_dir="$RUNNER_TEMP/stado-native-release"
          mkdir -p "$release_dir"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "$STADO_SOURCE_DIR/stado-rs/target/release/$name" "$release_dir/$name"
          done
          (
            cd "$release_dir"
            for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )
          version_line="$(sed -n '/^version = /p' "$STADO_SOURCE_DIR/stado-rs/Cargo.toml")"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          platform="${STADO_CONTROL_PLATFORM:?set the native release platform}"
          stado_bin="$HOME/.stado/bin/stado"
          STADO_API_TOKEN="$("$stado_bin" secrets get stado-release-publisher --field token)"
          export STADO_API_TOKEN
          for source in "$release_dir"/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$version/$platform/$name"
            if "$stado_bin" storage put "$uri" "$source" --if-absent; then
              continue
            fi
            existing="$RUNNER_TEMP/existing-native-$name"
            "$stado_bin" storage get "$uri" "$existing"
            if ! cmp --silent "$source" "$existing"; then
              echo "::error::Immutable release collision at $uri"
              false
            fi
          done
          STADO_RELEASE_DIR="$release_dir" bash "$STADO_SOURCE_DIR/deploy/deploy_stado_rust.sh"

      - name: Reload TLS reverse proxy
        if: ${{ vars.STADO_ENABLE_AZURE_DEPLOY == 'true' }}
        run: |
          if [ -z "$STADO_DASHBOARD_UPSTREAM" ]; then
            STADO_DASHBOARD_UPSTREAM="$(
              "$HOME/.stado/bin/stado" config show |
                jq -er '.dashboard_bind + ":" + (.dashboard_port | tostring)'
            )"
            export STADO_DASHBOARD_UPSTREAM
          fi
          if ! command -v caddy >/dev/null; then
            echo "::error::Caddy is not installed on the control-plane runner."
            false
          fi
          caddy reload \
            --config "$STADO_SOURCE_DIR/deploy/azure/Caddyfile.example" \
            --adapter caddyfile
