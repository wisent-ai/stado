name: Stado release and delivery

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Immutable release channel
        required: true
        type: choice
        options: [candidate, stable]
        default: candidate

permissions:
  contents: write

concurrency:
  group: stado-release-delivery
  cancel-in-progress: false

jobs:
  release-delivery:
    runs-on: [self-hosted, stado-control-plane]
    env:
      STADO_API_URL: https://stado.wisent.com
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      STADO_ENABLE_AZURE_DEPLOY: ${{ vars.STADO_ENABLE_AZURE_DEPLOY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the selected revision to be committed on main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "release revision $GITHUB_SHA is not the tip of origin/main" >&2
            false
          }

      - name: Resolve committed release identity
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version_line="$(sed -n '/^version = /p' stado-rs/Cargo.toml)"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          case "$version" in
            ''|*[!0-9A-Za-z._-]*) echo "invalid Cargo package version: $version" >&2; false ;;
          esac
          channel="${REQUESTED_CHANNEL:-}"
          if [ -z "$channel" ]; then
            case "$version" in *-*) channel=candidate ;; *) channel=stable ;; esac
          fi
          case "$channel" in candidate|stable) ;; *) echo "invalid channel: $channel" >&2; false ;; esac
          echo "STADO_VERSION=$version" >> "$GITHUB_ENV"
          echo "STADO_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "STADO_TAG=v$version" >> "$GITHUB_ENV"

      - name: Build the Darwin release bytes once
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = Darwin-arm64
          cargo build --manifest-path stado-rs/Cargo.toml --release --locked --bins
          payload="$RUNNER_TEMP/stado-release/darwin-arm64/payload"
          mkdir -p "$payload"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "stado-rs/target/release/$name" "$payload/$name"
          done
          cp "$payload/stado" "$payload/wc"
          cp LICENSE "$payload/LICENSE"
          archive="$RUNNER_TEMP/stado-release/darwin-arm64/stado-v$STADO_VERSION-darwin-arm64.tar.gz"
          python3 scripts/release_archive.py --root "$payload" --output "$archive" \
            stado wc stado-coverage stado-fix stado-watchdog stado-mcp LICENSE
          STADO_RELEASE_DIR="${archive%/*}" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$STADO_VERSION" \
          STADO_RELEASE_PLATFORM=darwin-arm64 \
          STADO_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
            scripts/release_manifest.sh

      - name: Build the Linux release bytes once
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag stado-rust-release stado-rs
          container="$(docker create --platform linux/amd64 stado-rust-release)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          payload="$RUNNER_TEMP/stado-release/linux-amd64/payload"
          mkdir -p "$payload"
          docker cp "$container:/out/." "$payload/"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            test -f "$payload/$name"
          done
          cp "$payload/stado" "$payload/wc"
          cp LICENSE "$payload/LICENSE"
          archive="$RUNNER_TEMP/stado-release/linux-amd64/stado-v$STADO_VERSION-linux-amd64.tar.gz"
          python3 scripts/release_archive.py --root "$payload" --output "$archive" \
            stado wc stado-coverage stado-fix stado-watchdog stado-mcp LICENSE
          STADO_RELEASE_DIR="${archive%/*}" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$STADO_VERSION" \
          STADO_RELEASE_PLATFORM=linux-amd64 \
          STADO_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
            scripts/release_manifest.sh

      - name: Require the committed manifest version to match the surface change
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/autoversion"
          "$RUNNER_TEMP/autoversion/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          python3 scripts/surface.py \
            --binary "$RUNNER_TEMP/stado-release/darwin-arm64/payload/stado" \
            > "$RUNNER_TEMP/candidate-surface.json"
          AUTOVERSION="$RUNNER_TEMP/autoversion/bin/autoversion" \
          STADO_BIN="$RUNNER_TEMP/stado-release/darwin-arm64/payload/stado" \
            scripts/version_check.sh "$RUNNER_TEMP/candidate-surface.json"

      - name: Create or safely resume the standard version tag
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$STADO_TAG" >/dev/null; then
            tagged="$(git rev-list -n 1 "$STADO_TAG")"
            test "$tagged" = "$GITHUB_SHA" || {
              echo "$STADO_TAG already identifies $tagged, not $GITHUB_SHA" >&2
              false
            }
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$STADO_TAG" "$GITHUB_SHA" -m "Stado $STADO_VERSION"
            git push origin "refs/tags/$STADO_TAG"
          fi

      - name: Publish or safely resume the canonical Stado release objects
        run: |
          set -euo pipefail
          publisher="$RUNNER_TEMP/stado-release/darwin-arm64/payload/stado"
          unset STADO_API_URL STADO_API_TOKEN
          publish_object() {
            platform="$1"
            source="$2"
            name="${source##*/}"
            uri="stado://releases/stado/$STADO_VERSION/$platform/$name"
            if "$publisher" storage put "$uri" "$source" --if-absent; then
              return
            fi
            existing="$RUNNER_TEMP/existing-$platform-$name"
            "$publisher" storage get "$uri" "$existing"
            cmp --silent "$source" "$existing" || {
              echo "immutable release collision at $uri" >&2
              false
            }
          }
          for platform in darwin-arm64 linux-amd64; do
            publish_object "$platform" \
              "$RUNNER_TEMP/stado-release/$platform/stado-v$STADO_VERSION-$platform.tar.gz"
            publish_object "$platform" \
              "$RUNNER_TEMP/stado-release/$platform/release-manifest-$platform.json"
          done

      - name: Bootstrap the control plane from the published build bytes
        run: |
          set -euo pipefail
          STADO_RELEASE_DIR="$RUNNER_TEMP/stado-release/darwin-arm64/payload" \
            bash deploy/deploy_stado_rust.sh

      - name: Promote desired state through the fenced registry writer
        if: env.STADO_RELEASE_CHANNEL == 'stable'
        run: |
          "$HOME/.stado/bin/stado" host promote-version \
            --binary stado --version "$STADO_VERSION" --json

      - name: Reconcile the fleet through Stado
        if: env.STADO_RELEASE_CHANNEL == 'stable'
        run: "$HOME/.stado/bin/stado host reconcile --apply --json"
