name: deploy

on:
  push:
    tags:
      - "stado-v*"

concurrency:
  # Per TAG, not one group for every release. Two attempts at the SAME version
  # should supersede each other -- a re-run of `stado-v1.2.3` replaces its own
  # predecessor, which is what `cancel-in-progress` is for here. Two DIFFERENT
  # versions have nothing to supersede: each publishes to its own immutable
  # coordinate, and `stado/0.13.7/...` shares not one object with
  # `stado/0.13.8/...`.
  #
  # The old shared group made a newer tag cancel an older tag's train, and the
  # comment that justified it was wrong on its own terms: it said a cancelled
  # attempt "can be resumed safely by its successor", but the successor is a
  # DIFFERENT VERSION publishing elsewhere, so it resumes nothing. Create-only
  # puts mean a cancelled train leaves an empty or partial coordinate that no
  # later attempt can ever complete, because the objects are immutable.
  #
  # It cost eight version numbers on 2026-08-30. Tags arrived every 2-4 minutes
  # while a train needs ~30 (about 6 to build, then an 80 MB archive per
  # platform at roughly half a megabyte a second), so no train ever reached its
  # publish step and 0.13.2/darwin-arm64 was left permanently at 1 object of 9.
  #
  # This is #172's argument one level up: independent immutable coordinates are
  # independent work, and the pipeline must stop letting one destroy another.
  # It also needs nobody else's agreement. A run's concurrency group is read
  # from the workflow file in its own tree, so the moment a tag carries this,
  # that train is in a group of one and no other tag can cancel it.
  group: wisent-compute-release-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    # Do not occupy the sole publisher runner while the exact source revision is
    # still queued for qualification. The Version check workflow owns the verdict;
    # this workflow consumes that one verdict instead of implementing a second gate.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful exact-head Version check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/version-check.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=100"
            )"
            verdict="$(
              jq -c --arg sha "$SOURCE_SHA" '
                [.workflow_runs[]
                  | select(
                      .head_sha == $sha and
                      .head_branch == "main" and
                      .event == "push"
                    )]
                | sort_by(.run_number)
                | last
                | if . == null then
                    {status: "missing", conclusion: "", url: ""}
                  else
                    {
                      status: .status,
                      conclusion: (.conclusion // ""),
                      url: .html_url
                    }
                  end
              ' <<<"$runs"
            )"
            status="$(jq -r '.status' <<<"$verdict")"
            conclusion="$(jq -r '.conclusion' <<<"$verdict")"
            url="$(jq -r '.url' <<<"$verdict")"
            case "$status:$conclusion" in
              completed:success)
                echo "Exact source qualification passed: $url"
                exit 0
                ;;
              completed:*)
                echo "::error::Exact source qualification concluded ${conclusion:-without a verdict}: $url"
                exit 1
                ;;
              missing:|queued:|in_progress:|waiting:|pending:|requested:)
                echo "Waiting for Version check on $SOURCE_SHA (attempt $attempt/180): $status"
                sleep 20
                ;;
              *)
                echo "::error::Unrecognized Version check state '$status:$conclusion': $url"
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for exact source qualification on $SOURCE_SHA"
          exit 1

  # The version and channel this tag names, resolved once, off the contended
  # runner, before either platform builds anything.
  #
  # It used to live inside the Linux job, which is why `deploy-control-plane`
  # had to declare `needs: release` merely to read `channel` -- and that one
  # line was the whole coupling. It cost the macOS platform two versions:
  # 0.10.0's Linux job was cancelled and 0.12.0's failed in a read-back of
  # already-published Linux bytes, and in both cases the darwin job executed
  # zero steps and its coordinate was left at 0 of 9 objects. Nothing was
  # wrong with darwin's inputs either time.
  #
  # Resolving identity here makes the two platforms siblings: each publishes
  # to its own immutable coordinate, each is judged on its own, and neither
  # can strand the other. Both still assert their own completeness before
  # reporting success, so a platform ends whole or empty, never partial.
  identity:
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.release_identity.outputs.channel }}
      version: ${{ steps.release_identity.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve exact release identity
        id: release_identity
        run: |
          die() {
            printf 'FATAL: %s\n' "$*" > /dev/stderr
            false
          }
          version_line="$(sed -n '/^version = /p' stado-rs/Cargo.toml)"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          test -n "$version" || die "Cargo release version is unresolved"
          test "$GITHUB_REF_NAME" = "stado-v$version" ||
            die "tag $GITHUB_REF_NAME must equal stado-v$version"
          case "$version" in
            *-*) channel=candidate ;;
            *) channel=stable ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # One serialized capacity transaction runs before either platform reaches
  # the sole control-plane runner. The installed product restores enough
  # declared capacity to admit the corrected candidate build; that candidate
  # then completes canonical reclamation and must reach the full declared
  # target before any release coordinate is claimed. Keeping this as a
  # dependency prevents two release siblings from competing for the same disk.
  release-capacity:
    needs: identity
    runs-on: [self-hosted, stado-control-plane]
    env:
      STADO_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # The 0.16.7 job already cleaned this exact Cargo target immediately
      # before the identical locked build and still exhausted the volume. Its
      # later `host reclaim` could never run because the binary it needed was
      # the build that failed. Reclaim the runner's declared non-checkout roots
      # with the installed product first; the bounded janitor substage may
      # spend its own shared scan budget, but host reclaim then continues
      # through its separately declared scratch, delivery, cache and clone
      # stages.
      - name: Reclaim declared runner capacity
        run: |
          "$HOME/.stado/bin/stado" host reclaim lukasz-macbook --apply \
            --reason "stado $STADO_VERSION release build requires declared host capacity" \
            --json
      # Cargo output is checkout-relative, not the `.stado/build-work` tree
      # owned by host reclaim. Clear that exact second source of scratch. The
      # installed binary need only restore the declared low-watermark admission
      # needed to compile its replacement: the corrected candidate must be
      # allowed to run before the full target verdict is required.
      - name: Reclaim declared release Rust scratch
        run: cargo clean --manifest-path stado-rs/Cargo.toml
      - name: Require candidate build admission
        run: |
          set -euo pipefail
          set +e
          gates=$("$HOME/.stado/bin/stado" host gates lukasz-macbook --json)
          set -e
          GATES_JSON="$gates" python3 -c '
          import json, os
          report = json.loads(os.environ["GATES_JSON"])
          disk = report.get("disk") or {}
          free = disk.get("free_gb")
          low = disk.get("low_watermark_gb")
          if free is None or low is None:
              raise SystemExit("host gates did not report free_gb and low_watermark_gb")
          if free < low:
              raise SystemExit(f"runner capacity remains below build admission: {free:.2f} < {low} GiB")
          print(f"candidate build admitted: {free:.2f} >= {low} GiB")
          '
      - name: Build the capacity binary from this revision
        run: cargo build --manifest-path stado-rs/Cargo.toml --locked --release --bin stado
      - name: Reclaim declared capacity with candidate
        run: |
          "$GITHUB_WORKSPACE/stado-rs/target/release/stado" host reclaim \
            lukasz-macbook --apply \
            --reason "stado $STADO_VERSION candidate completes declared host reclamation" \
            --json
      - name: Require declared build capacity
        run: |
          set -euo pipefail
          set +e
          gates=$("$GITHUB_WORKSPACE/stado-rs/target/release/stado" host gates \
            lukasz-macbook --json)
          set -e
          GATES_JSON="$gates" python3 -c '
          import json, os
          report = json.loads(os.environ["GATES_JSON"])
          disk = report.get("disk") or {}
          free = disk.get("free_gb")
          target = disk.get("target_free_gb")
          if free is None or target is None:
              raise SystemExit("host gates did not report free_gb and target_free_gb")
          if free < target:
              raise SystemExit(f"runner capacity remains below target: {free:.2f} < {target} GiB")
          print(f"runner capacity proved: {free:.2f} >= {target} GiB")
          '

      # Every call below first claims one create-only record at version scope,
      # then its platform record. The shared version write is the arbitration
      # point: two publishers starting together from different commits cannot
      # each win a different platform after both observed no siblings. The loop
      # still creates both platform records before either publisher starts.
      - name: Claim version and every platform
        run: |
          set -euo pipefail
          stado="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          for platform in linux-amd64 darwin-arm64; do
            "$stado" release claim-coordinate stado "$STADO_VERSION" "$platform" \
              --source-commit "$GITHUB_SHA"
          done
      # The two publisher jobs already clean their Rust output under
      # `always()`. The prerequisite job must have the same retention rule:
      # otherwise its private target tree survives both success and failure
      # and eventually prevents the next release from reaching its reclaim
      # step.
      - name: Reclaim capacity Rust cache
        if: always()
        run: cargo clean --manifest-path stado-rs/Cargo.toml
      - name: Require capacity after candidate scratch reset
        if: always()
        run: |
          set -euo pipefail
          set +e
          gates=$("$HOME/.stado/bin/stado" host gates lukasz-macbook --json)
          set -e
          GATES_JSON="$gates" python3 -c '
          import json, os
          report = json.loads(os.environ["GATES_JSON"])
          disk = report.get("disk") or {}
          free = disk.get("free_gb")
          target = disk.get("target_free_gb")
          if free is None or target is None or free < target:
              raise SystemExit(f"runner capacity below target after scratch reset: {free} < {target}")
          print(f"runner capacity retained: {free:.2f} >= {target} GiB")
          '

  # Stable Linux publication needs the native registry authority reader updated
  # first. Otherwise its resolver can reject data the release itself supports,
  # while the failed Linux job prevents that reader from ever being delivered.
  # Candidate publication remains independent of the stable native delivery.
  publish-linux:
    needs: [identity, release-capacity, deploy-control-plane]
    if: >-
      ${{ !cancelled() && needs.identity.result == 'success' &&
          needs.release-capacity.result == 'success' &&
          (needs.identity.outputs.channel != 'stable' ||
           needs.deploy-control-plane.result == 'success') }}
    runs-on: [self-hosted, stado-control-plane]
    # NO shared concurrency group here, deliberately. The capacity job is a
    # completed prerequisite, not a group that can evict this pending build.
    #
    # I added `group: stado-control-plane-runner` with cancel-in-progress
    # false in #172, meaning to make PR gates queue for the single runner
    # instead of competing for it. It did the opposite. GitHub allows exactly
    # ONE pending job per concurrency group: when a second job becomes
    # pending in the group, the one already waiting is CANCELLED. So on the
    # 0.13.0 train this job sat pending behind the darwin job from 00:18:56Z,
    # a `writer-transfer-check` for another branch entered the group at
    # 00:35:12Z, and this job was cancelled one second later at 00:35:13Z
    # having executed zero steps. The group converted "wait your turn" into
    # "be evicted by the next PR push", which is strictly worse than no group
    # at all.
    #
    # A self-hosted runner already queues jobs natively, and GitHub does not
    # cancel a job for waiting on a busy runner. Contention here costs time,
    # never a platform. Do not re-add a concurrency group to make runner
    # sharing orderly: it cannot express "queue" for more than one waiter.
    permissions:
      contents: read
    env:
      STADO_VERSION: ${{ needs.identity.outputs.version }}
      STADO_RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      # The writer uses one declared resolver adapter for both mutation and
      # authenticated read-back. Fleet delivery verifies the public read-only
      # Funnel separately after publication.
      STADO_WRITER_API_URL: http://127.0.0.1:18776
      STADO_PUBLIC_RELEASE_API_URL: https://charless-mac-mini.tail6443b3.ts.net
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
    steps:
      # v4 runs on Node 20, which GitHub has deprecated and already forces onto Node
      # 24; v5 is the first major that targets Node 24 itself. It needs a runner of at
      # least 2.327.1 and this control plane runs 2.336.0. Held at the oldest major
      # that resolves the deprecation rather than the newest one published, because
      # this job publishes create-only release objects and a checkout that changes
      # behaviour under it cannot be corrected after the fact.
      - uses: actions/checkout@v5

      - name: Prepare release implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stado-release-tools"
          cat > "$RUNNER_TEMP/stado-release-tools/release_manifest.sh" <<'STADO_EMBEDDED_EOF'
          # Emit the canonical immutable archive manifest shared by Stado products.
          set -eu
          
          die() {
              printf 'FATAL: %s\n' "$*" > /dev/stderr
              false
          }
          
          RELEASE_DIR="${STADO_RELEASE_DIR:?set STADO_RELEASE_DIR}"
          ARCHIVE="${STADO_RELEASE_ARCHIVE:?set STADO_RELEASE_ARCHIVE}"
          VERSION="${STADO_RELEASE_VERSION:?set STADO_RELEASE_VERSION}"
          PLATFORM="${STADO_RELEASE_PLATFORM:?set STADO_RELEASE_PLATFORM}"
          SOURCE_COMMIT="${STADO_RELEASE_SOURCE_COMMIT:?set STADO_RELEASE_SOURCE_COMMIT}"
          
          for command_name in jq openssl; do
              command -v "$command_name" >/dev/null || die "required command is unavailable: $command_name"
          done
          [ -s "$ARCHIVE" ] || die "release archive is missing or empty: $ARCHIVE"
          case "$VERSION" in
              *[![:alnum:]._-]* | "") die "invalid immutable release version" ;;
          esac
          case "$PLATFORM" in
              *[![:alnum:]._-]* | "") die "invalid immutable release platform" ;;
          esac
          case "$SOURCE_COMMIT" in
              *[!0-9a-fA-F]* | "") die "source commit must be hexadecimal" ;;
          esac
          
          sha256="$(openssl dgst -sha256 "$ARCHIVE" | sed 's/^.*= //')"
          manifest="$RELEASE_DIR/release-manifest-$PLATFORM.json"
          jq -cS -n \
              --arg product stado \
              --arg version "$VERSION" \
              --arg platform "$PLATFORM" \
              --arg source_commit "$SOURCE_COMMIT" \
              --arg sha256 "$sha256" \
              '{
                  "platform": $platform,
                  "product": $product,
                  "sha256": $sha256,
                  "source_commit": $source_commit,
                  "version": $version
              }' > "$manifest"
          printf '%s\n' "$manifest"
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/adopt_published_release.sh" <<'STADO_EMBEDDED_EOF'
          set -euo pipefail
          
          # Make a second attempt at one release coordinate possible.
          #
          # Release objects are create-only. The archive this train publishes is produced
          # by `stado storage archive`, and tar+gzip output is not byte-reproducible
          # across runs — mtimes, member order and the gzip header all move — while the
          # executables inside it carry `env!("CARGO_MANIFEST_DIR")`, which is a fresh
          # `$RUNNER_TEMP/stado-source.XXXX` on every checkout. So a rebuilt attempt at an
          # already-published version produces DIFFERENT bytes for the same names, and the
          # writer answers exactly that:
          #
          #   Error: immutable object already differs on the writer:
          #   stado://releases/stado/0.13.47/darwin-arm64/stado-v0.13.47-darwin-arm64.tar.gz
          #
          # 0.13.47 died there. Attempt 1 published all thirteen objects of its darwin
          # coordinate; attempt 2 rebuilt the archive, refused it twelve times, failed the
          # job, and `deploy-fleet` was skipped — a release whose bytes were complete and
          # public never reached a single host, and no later attempt at that tag could
          # have ended differently.
          #
          # The way out is to stop rebuilding what is already published. If the archive is
          # there, it IS the release: this adopts it and derives the whole release
          # directory from it, so every subsequent `storage put --if-absent` either
          # matches the published object exactly or creates the one that is missing. That
          # also completes a half-published coordinate instead of leaving it stranded,
          # which is the state `stado/0.11.0/darwin-arm64` has been in since April.
          #
          # Called with STADO_API_URL pointing at the authenticated writer, the same
          # origin the publish loop uses.
          
          if [ "$#" -ne 5 ]; then
            echo "usage: adopt_published_release.sh STADO_BIN RELEASE_DIR PRODUCT VERSION PLATFORM" >&2
            exit 2
          fi
          
          stado_bin="$1"
          release_dir="$2"
          product="$3"
          version="$4"
          platform="$5"
          
          case "$product" in
            *[![:alnum:]_-]*|"") echo "invalid release product: $product" >&2; exit 2 ;;
          esac
          case "$version" in
            *[![:alnum:]._-]*|"") echo "invalid release version: $version" >&2; exit 2 ;;
          esac
          case "$platform" in
            *[![:alnum:]_-]*|"") echo "invalid release platform: $platform" >&2; exit 2 ;;
          esac
          
          test -x "$stado_bin"
          test -d "$release_dir"
          
          prefix="stado://releases/$product/$version/$platform"
          archive_name="$product-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          
          published_state() {
            "$stado_bin" storage stat "$prefix/$1" --json | jq -er '.state'
          }
          
          # `storage stat` answers present or absent with exit status zero and reserves
          # non-zero for a store that did not answer. Guessing "absent" from a store that
          # is merely unreachable would rebuild over a live coordinate, so an unusable
          # answer stops this instead.
          archive_state="$(published_state "$archive_name")"
          case "$archive_state" in
            absent)
              echo "no published $prefix/$archive_name: this attempt publishes its own build"
              exit 0
              ;;
            present) ;;
            *)
              echo "::error::the writer could not say whether $prefix/$archive_name exists" \
                "(state $archive_state); this attempt will not rebuild over a coordinate it cannot read" >&2
              exit 1
              ;;
          esac
          
          echo "adopting the published $prefix/$archive_name; this attempt publishes no rebuilt bytes"
          "$stado_bin" storage get "$prefix/$archive_name" "$release_dir/$archive_name"
          # The archive carries every executable plus SHA256SUMS, so extracting it over
          # the release directory replaces this attempt's build with the bytes the
          # coordinate already holds — which is what the publish loop, the public
          # validation and the delivery all have to agree about.
          /usr/bin/tar -xzf "$release_dir/$archive_name" -C "$release_dir"
          
          # The manifest is regenerated deterministically from the adopted archive by the
          # caller's own manifest step (product, version, platform, source_commit and the
          # archive digest, and nothing else), so a published one must still match. Taking
          # the published copy when it exists means the comparison is against the bytes a
          # consumer gets rather than against a second derivation of them.
          manifest_state="$(published_state "$manifest_name")"
          case "$manifest_state" in
            present) "$stado_bin" storage get "$prefix/$manifest_name" "$release_dir/$manifest_name" ;;
            absent)
              echo "$prefix/$manifest_name is absent; the adopted archive's manifest will be published"
              ;;
            *)
              echo "::error::the writer could not say whether $prefix/$manifest_name exists" \
                "(state $manifest_state)" >&2
              exit 1
              ;;
          esac
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" <<'STADO_EMBEDDED_EOF'
          set -euo pipefail
          
          if [ "$#" -ne 6 ]; then
            echo "usage: verify_public_stado_release.sh STADO_BIN RELEASE_DIR PRODUCT VERSION PLATFORM SCRATCH_DIR" >&2
            exit 2
          fi
          
          stado_bin="$1"
          release_dir="$2"
          product="$3"
          version="$4"
          platform="$5"
          scratch_dir="$6"
          
          case "$product" in
            *[![:alnum:]_-]*|"") echo "invalid release product: $product" >&2; exit 2 ;;
          esac
          case "$version" in
            *[![:alnum:]._-]*|"") echo "invalid release version: $version" >&2; exit 2 ;;
          esac
          case "$platform" in
            *[![:alnum:]_-]*|"") echo "invalid release platform: $platform" >&2; exit 2 ;;
          esac
          
          test -x "$stado_bin"
          test -d "$release_dir"
          test -d "$scratch_dir"
          
          prefix="stado://releases/$product/$version/$platform"
          version_claim_uri="stado://releases/$product/$version/source-revision.json"
          platform_claim_uri="$prefix/source-revision.json"
          archive_name="$product-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          test -f "$release_dir/$archive_name"
          test -f "$release_dir/$manifest_name"
          
          # One coordinate, two producers. This workflow publishes the executables,
          # SHA256SUMS, the platform archive and the platform manifest. The product's own
          # signed-release path publishes `release.json`, `release.sig`, `release.tar.gz`
          # and `qualification.json` into the SAME prefix — see
          # `cli::release_submit::publish`, which records
          # `stado://releases/<product>/<version>/<platform>/qualification.json` as the
          # run's qualification URI. 0.13.45's linux leg is exactly that state: nine
          # objects from here, four from there, and a check that expected the coordinate
          # to hold only what this runner had on disk refused a complete release.
          #
          # The platform `source-revision.json` remains a coordinate member for older
          # clients. The platformless version claim sits one level above this listing and
          # is fetched and compared below; it is the create-only arbitration point shared
          # by every publisher and platform.
          # `[A-Z_]*` and not `[A-Z]*`: a two-word constant like
          # `RELEASE_REVISION_NAME`'s successors would otherwise be silently skipped and
          # read as a member nobody declares.
          control_source="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)/stado-rs/src/release_control.rs"
          test -f "$control_source"
          control_names="$(
            sed -n 's/^pub const RELEASE_[A-Z_]*_NAME: &str = "\([^"]*\)";$/\1/p' "$control_source" |
              sort -u
          )"
          declared_control="$(printf '%s\n' "$control_names" | sed '/^$/d' | /usr/bin/wc -l | tr -d '[:space:]')"
          if [ "$declared_control" -lt 5 ]; then
            echo "$control_source declares $declared_control release-owned object name(s);" \
              "this check needs them to know which members the pipeline and the coordinate" \
              "claim write" >&2
            exit 1
          fi
          
          # Every immutable put already reads the exact bytes back through the authenticated
          # writer. Public validation therefore has a different job: prove that the public
          # route exposes that complete coordinate. The archive contains every executable
          # plus SHA256SUMS, so one exact archive read proves their bytes through the public
          # route. The listing proves that every standalone object is also visible with its
          # writer-verified size. Re-downloading each executable repeated hundreds of MiB
          # and exceeded the release runner's wall-clock budget without proving more.
          #
          # A chunked put stages its parts at `<key>.__stado_upload/<id>/<index>` under
          # this same prefix, and the composition that finishes the object deletes them.
          # An interrupted upload therefore leaves parts a later attempt cleans up:
          # 0.13.44's first darwin attempt left four when the runner lost its connection
          # mid-archive. Parts are upload state, never coordinate members, so they are
          # dropped here — while any OTHER unexpected member still fails the coordinate.
          listing="$(
            $stado_bin storage objects releases "$product/$version/$platform/" --json |
              jq -c '{objects: [.objects[] | select((.key // .uri) | contains(".__stado_upload/") | not)]}'
          )"
          
          version_claim="$scratch_dir/public-$version-source-revision.json"
          platform_claim="$scratch_dir/public-$version-$platform-source-revision.json"
          rm -f "$version_claim" "$platform_claim"
          "$stado_bin" storage get "$version_claim_uri" "$version_claim"
          "$stado_bin" storage get "$platform_claim_uri" "$platform_claim"
          source_revision="$(
            jq -er --arg product "$product" --arg version "$version" '
              select(
                keys == ["product", "schema_version", "source_revision", "version"] and
                .schema_version == 1 and
                .product == $product and
                .version == $version and
                (.source_revision | test("^[0-9a-f]{40}$"))
              ) | .source_revision
            ' "$version_claim"
          )"
          jq -e \
            --arg product "$product" \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_revision "$source_revision" '
              keys == ["platform", "product", "schema_version", "source_revision", "version"] and
              .schema_version == 1 and
              .product == $product and
              .version == $version and
              .platform == $platform and
              .source_revision == $source_revision
            ' "$platform_claim" >/dev/null
          jq -e \
            --arg product "$product" \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_revision "$source_revision" '
              .product == $product and
              .version == $version and
              .platform == $platform and
              .source_commit == $source_revision
            ' "$release_dir/$manifest_name" >/dev/null
          for source in "$release_dir"/*; do
            name="${source##*/}"
            uri="$prefix/$name"
            size="$(/usr/bin/wc -c < "$source" | tr -d '[:space:]')"
            if ! jq -e --arg uri "$uri" --argjson size "$size" \
              '([.objects[] | select(.uri == $uri and .size == $size)] | length) == 1' \
              <<<"$listing" >/dev/null; then
              echo "public release coordinate omitted $uri at its writer-verified size $size" >&2
              exit 1
            fi
          done
          
          # Every member is now accounted for by one of the two producers, so anything
          # left over is an object nobody declares — a stray write into an immutable
          # coordinate, which is what this check is for.
          declared="$(
            {
              printf '%s\n' "$control_names"
              for source in "$release_dir"/*; do printf '%s\n' "${source##*/}"; done
            } | jq -R -s 'split("\n") | map(select(length > 0))'
          )"
          undeclared="$(
            jq -r --argjson declared "$declared" '
              ([.objects[] | (.key // .uri) | sub(".*/"; "")] - $declared) | unique | join(" ")
            ' <<<"$listing"
          )"
          if [ -n "$undeclared" ]; then
            echo "public release coordinate carries member(s) neither producer declares: $undeclared" >&2
            exit 1
          fi
          
          for name in "$archive_name" "$manifest_name"; do
            source="$release_dir/$name"
            uri="$prefix/$name"
            delivered="$scratch_dir/public-$platform-$name"
            visible=false
            for attempt in $(seq 1 12); do
              rm -f "$delivered"
              if "$stado_bin" storage get "$uri" "$delivered" &&
                 cmp --silent "$source" "$delivered"; then
                visible=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$visible" != true ]; then
              echo "public release delivery did not serve immutable $uri" >&2
              exit 1
            fi
          done
          STADO_EMBEDDED_EOF
      - name: Ensure daemonless cross-build toolchain
        run: |
          PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          export PATH
          printf '%s\n' /opt/homebrew/bin "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v zig >/dev/null || /opt/homebrew/bin/brew install zig
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked
      - name: Build provider-neutral Rust release
        # The control-plane runner is an arm64 Mac. Build the exact Linux x86_64
        # target with cargo-zigbuild: unlike Docker Desktop it has no daemon whose
        # manually-started state can decide whether a release exists.
        run: |
          target="x86_64-unknown-linux-gnu"
          cargo zigbuild --manifest-path stado-rs/Cargo.toml --locked \
            --release --bins --target "$target"
          release_dir="$RUNNER_TEMP/stado-release"
          mkdir -p "$release_dir"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "stado-rs/target/$target/release/$name" "$release_dir/$name"
          done
          cp "$release_dir/stado" "$release_dir/wc"
          (
            cd "$release_dir"
            for name in stado wc stado-coverage stado-fix stado-watchdog stado-mcp; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )

      - name: Build native release publisher CLI
        run: cargo build --manifest-path stado-rs/Cargo.toml --locked --release --bin stado

      - name: Verify and repair the declared object service
        run: |
          set -euo pipefail
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          case "$STADO_WRITER_API_URL" in
            http://127.0.0.1:18776) ;;
            *) echo "::error::release writer must use the declared loopback resolver"; false ;;
          esac
          export STADO_API_URL="$STADO_WRITER_API_URL"
          # This job is a resolver workload, not an authority operator. Prove
          # the live resolver grants this exact consumer the object-storage
          # route; `resolver status` additionally refreshes the global registry
          # authority and can reject a healthy, fresh workload data plane when
          # an unrelated authority transport is unavailable.
          "$stado_bin" resolver resolve stado-object-api \
            --consumer stado-local-agent --json \
            > "$RUNNER_TEMP/release-resolver.json"
          jq -e '
            .service == "stado://service/stado-object-api" and
            (.generation | type == "number") and
            (.capabilities | index("object-storage") != null)
          ' "$RUNNER_TEMP/release-resolver.json" >/dev/null
          retry_command() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          # The object API is a system LaunchDaemon. It does not inherit HOME
          # or the runner's Stado config, so reconcile its checked-in unit
          # contract before touching verifier grants.
          # Recovery is idempotent: after a lost transport acknowledgement its
          # own healthy-and-identical postcondition makes the retry read-only.
          retry_command "$stado_bin" host recover-object-api \
            charless-mac-mini --json \
            > "$RUNNER_TEMP/object-api-recovery.json"
          "$stado_bin" service env \
            com.wisent.always-on.stado-object-api \
            --host charless-mac-mini --json \
            > "$RUNNER_TEMP/object-api-environment.json"
          jq -e '
            length == 1 and
            .[0].environment.HOME == "/Users/charles" and
            .[0].environment.STADO_CONFIG == "/Users/charles/.config/stado/config.json" and
            .[0].environment.SKARBIEC_VAULT_FILE == "/Users/charles/.stado/skarbiec.vault.json" and
            # service env deliberately redacts token-file variables. Recovery
            # already proved their exact checked-in values before persisting the plist.
            .[0].environment.WC_OBJECT_SKARBIEC_TOKEN_FILE == "[REDACTED]" and
            .[0].environment.WC_RELEASE_SKARBIEC_TOKEN_FILE == "[REDACTED]" and
            .[0].environment.WC_STORAGE_BACKEND == "local" and
            .[0].environment.WC_LOCAL_STORAGE_PATH == "/Users/charles/.stado/local-storage" and
            .[0].environment.WC_BACKUP_STORAGE_BACKEND == "local" and
            .[0].environment.WC_BACKUP_LOCAL_STORAGE_PATH == "/Users/charles/.stado/local-backup"
          ' "$RUNNER_TEMP/object-api-environment.json" >/dev/null
          preflight() {
            # This release owns only the Stado product prefix. Its authenticated
            # listing proves the exact stado-release-publisher/token dependency;
            # unrelated private namespaces and publishers are not prerequisites.
            "$stado_bin" storage objects releases \
              stado/__release_preflight__ --json \
              > "$RUNNER_TEMP/release-preflight.json" \
              2> "$RUNNER_TEMP/release-preflight.err"
          }
          wait_for_preflight() {
            consecutive=0
            for attempt in $(seq 1 24); do
              if preflight; then
                consecutive=$((consecutive + 1))
                if [[ "$consecutive" -ge 3 ]]; then
                  return 0
                fi
              else
                consecutive=0
              fi
              sleep 5
            done
            cat "$RUNNER_TEMP/release-preflight.err" >&2
            echo "::error::Stado release preflight did not remain healthy for three consecutive checks" >&2
            return 1
          }
          reconcile_release_lifecycles() {
            retry_command "$stado_bin" host reconcile-release-verifier \
              charless-mac-mini --json \
              > "$RUNNER_TEMP/release-lifecycles.json"
            jq -e '
              .exact == true and
              (.items | type == "array") and
              (.items | index("stado-release-publisher")) != null and
              (.source_lifecycles | type == "array") and
              (.source_lifecycles | length) == (.items | length) and
              all(
                .source_lifecycles[];
                (.item | type == "string" and length > 0) and
                (.controller | type == "string" and length > 0) and
                (.mode == "owner" or .mode == "managed" or .mode == "external") and
                .readable == true
              )
            ' "$RUNNER_TEMP/release-lifecycles.json" >/dev/null
          }
          # Reconcile only the controller-declared Stado publisher item and
          # add only its read capability to the preserved release verifier.
          # The release route resolves this exact item again for every request.
          reconcile_release_lifecycles

          verify_read_proof() {
            wait_for_preflight
            jq -e '.objects | type == "array"' \
              "$RUNNER_TEMP/release-preflight.json" >/dev/null
          }

          # A read grant cannot prove that this runner presents the publisher
          # token expected by the target. Retain one content-addressed canary;
          # storage put performs create-if-absent plus exact authenticated
          # read-back through this same writer resolver.
          canary="$RUNNER_TEMP/release-write-preflight.json"
          printf '{"schema":"stado.release-write-preflight.v1","source_commit":"%s"}\n' \
            "$GITHUB_SHA" > "$canary"
          canary_sha="$(openssl dgst -sha256 "$canary" | sed 's/^.*= //')"
          canary_uri="stado://releases/stado/__release_preflight__/$canary_sha.json"

          verify_read_proof
          if ! "$stado_bin" storage put "$canary_uri" "$canary" --if-absent; then
            # An old object runtime can retain a closed release boundary after
            # the exact Stado publisher dependency is reconciled. Before its
            # sole in-place restart, prove the managed unit and dependency
            # route this job is about to disturb.
            "$stado_bin" service show \
              com.wisent.always-on.stado-object-api \
              --host charless-mac-mini --json \
              > "$RUNNER_TEMP/object-service-before-restart.json"
            jq -e '
              length == 1 and
              .[0].unit == "com.wisent.always-on.stado-object-api" and
              .[0].host == "charless-mac-mini" and
              .[0].status == "runs" and
              (.[0].detail | contains("dashboard --bind 127.0.0.1 --port 8765"))
            ' "$RUNNER_TEMP/object-service-before-restart.json" >/dev/null
            "$stado_bin" service directory connect stado-object-api \
              --target lukasz-macbook --no-verify --json \
              > "$RUNNER_TEMP/object-dependency-before-restart.json"
            jq -e '
              .service == "stado-object-api" and
              .placed_on == "charless-mac-mini" and
              .from == "lukasz-macbook"
            ' "$RUNNER_TEMP/object-dependency-before-restart.json" >/dev/null

            restart_status=0
            "$stado_bin" service restart \
              com.wisent.always-on.stado-object-api \
              --host charless-mac-mini --json \
              > "$RUNNER_TEMP/object-service-restart.json" ||
              restart_status=$?
            if [ "$restart_status" -ne 0 ]; then
              echo "::notice::restart transport closed; the full postcondition decides"
            fi

            # No credential is removed and reconciliation is not repeated.
            # The post-restart verdict is the complete three-read plus writer
            # proof, not the restart command's possibly interrupted response.
            verify_read_proof
            "$stado_bin" storage put "$canary_uri" "$canary" --if-absent
          fi
      - name: Create Linux release manifest
        run: |
          machine_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              stado-rs/src/machine.rs
          )"
          schema_unit="$(printf x | /usr/bin/wc -c | tr -d '[:space:]')"
          config_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              stado-rs/src/config_file.rs
          )"
          storage_schema="$(
            sed -n '/pub const STORAGE_LAYOUT_VERSION:/{s/.*= //;s/;//;p;q;}' \
              stado-rs/src/queue/mod.rs
          )"
          test "$config_schema" != "true as u16" || config_schema="$schema_unit"
          test "$storage_schema" != "true as u16" || storage_schema="$schema_unit"
          test -n "$config_schema"
          test -n "$storage_schema"
          test -n "$machine_schema"
          release_dir="$RUNNER_TEMP/stado-release"
          archive="$RUNNER_TEMP/stado-linux-amd64.tar.gz"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          "$stado_bin" storage archive "$release_dir" "$archive"
          STADO_RELEASE_DIR="$RUNNER_TEMP/stado-release" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$STADO_VERSION" \
          STADO_RELEASE_CHANNEL="$STADO_RELEASE_CHANNEL" \
          STADO_RELEASE_PLATFORM="linux-amd64" \
          STADO_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
          STADO_RELEASE_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          STADO_RELEASE_BUILT_AT="$(git show -s --format=%cI "$GITHUB_SHA")" \
          STADO_MACHINE_SCHEMA_VERSION="$machine_schema" \
          STADO_CONFIG_SCHEMA_VERSION="$config_schema" \
          STADO_STORAGE_SCHEMA_VERSION="$storage_schema" \
          STADO_LICENSE_FILE="$GITHUB_WORKSPACE/LICENSE" \
          STADO_RELEASE_STABLE_INTEGRATIONS="local-compute,local-filesystem-storage,skarbiec,stado-object-storage" \
          STADO_RELEASE_PREVIEW_INTEGRATIONS="gcs-storage,s3-storage,azure-blob-storage,gcp-compute,aws-ec2,azure-vm,cloudflare,box,vast" \
            bash "$RUNNER_TEMP/stado-release-tools/release_manifest.sh"
          mv "$archive" "$release_dir/stado-v$STADO_VERSION-linux-amd64.tar.gz"

      - name: Create immutable Linux release through Stado
        run: |
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          export STADO_API_URL="$STADO_WRITER_API_URL"
          test -x "$stado_bin"
          # Claim the source identity before a single artifact. The command
          # first arbitrates one create-only version record shared by all
          # publishers and platform sets, then mirrors it at this platform
          # coordinate. A different commit is refused before either prefix
          # receives artifact bytes.
          "$stado_bin" release claim-coordinate stado "$STADO_VERSION" linux-amd64 \
            --source-commit "$GITHUB_SHA"
          # A second attempt at a version whose archive is already published
          # adopts those bytes instead of refusing its own rebuild against
          # them. Release objects are create-only and a rebuilt archive is
          # never byte-identical, so without this the same tag can never be
          # retried.
          bash "$RUNNER_TEMP/stado-release-tools/adopt_published_release.sh" \
            "$stado_bin" "$RUNNER_TEMP/stado-release" stado "$STADO_VERSION" linux-amd64
          for source in "$RUNNER_TEMP"/stado-release/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$STADO_VERSION/linux-amd64/$name"
            published=false
            # The writer may briefly reload authorization. `storage put` is
            # idempotent for an identical immutable object and verifies exact
            # bytes through the authenticated writer before returning.
            max_attempts=12
            for attempt in $(seq 1 "$max_attempts"); do
              if "$stado_bin" storage put "$uri" "$source" --if-absent; then
                published=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$published" != true ]; then
              # Every attempt failed, so whatever this object staged is
              # residue: `put` writes a large body as
              # `<key>.__stado_upload/<id>/<index>` parts and only
              # composition promotes them, so a publish that never composed
              # leaves parts and no object. On 2026-09-04 the 0.15.25
              # darwin-arm64 archive was left as 19 such parts, 57 MiB the
              # release-store janitor cannot even see as a version and no
              # reader can resolve. Discard them here, where the target URI
              # is still known, and then fail.
              "$stado_bin" storage abort-upload "$uri" --json || true
              echo "::error::Could not create and verify $uri after $max_attempts attempts"
              false
            fi
          done

      - name: Discard staged Linux upload parts
        if: always()
        run: |
          # Idempotent and safe after success: composition deletes the parts
          # it promoted, so a published coordinate has none and this reports
          # zero. It runs on cancellation and on any later failure too,
          # because the parts outlive the process that staged them.
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          export STADO_API_URL="$STADO_WRITER_API_URL"
          if [ ! -x "$stado_bin" ] || [ ! -d "$RUNNER_TEMP/stado-release" ]; then
            echo "no publisher or no release directory: nothing was staged"
            exit 0
          fi
          for source in "$RUNNER_TEMP"/stado-release/*; do
            name="${source##*/}"
            "$stado_bin" storage abort-upload \
              "stado://releases/stado/$STADO_VERSION/linux-amd64/$name" --json || true
          done

      - name: Validate public Linux release delivery
        run: |
          export STADO_API_URL="$STADO_PUBLIC_RELEASE_API_URL"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          bash "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" \
            "$stado_bin" "$RUNNER_TEMP/stado-release" stado \
            "$STADO_VERSION" linux-amd64 "$RUNNER_TEMP"
      - name: Reclaim Rust release cache
        if: always()
        run: |
          manifest="$GITHUB_WORKSPACE/stado-rs/Cargo.toml"
          if [ -f "$manifest" ]; then
            cargo clean --manifest-path "$manifest"
          fi


  # Publish and verify the native coordinate, then converge every required
  # native host from the same source manifest. Updating only a separate
  # coordinator variable can leave the registry authority on incompatible
  # bytes; waiting for Linux delivery to update it creates a dependency cycle.
  # A later Linux failure cannot prevent these already-qualified native updates.
  deploy-control-plane:
    needs: [identity, release-capacity]
    if: needs.identity.outputs.channel == 'stable'
    runs-on: [self-hosted, stado-control-plane]
    # No shared concurrency group, for the reason written out on publish-linux:
    # one pending job per group means the next PR push evicts whichever
    # platform is waiting.
    permissions:
      contents: read
    env:
      STADO_WRITER_API_URL: http://127.0.0.1:18776
      STADO_PUBLIC_RELEASE_API_URL: https://charless-mac-mini.tail6443b3.ts.net
      STADO_ENABLE_AZURE_DEPLOY: ${{ vars.STADO_ENABLE_AZURE_DEPLOY }}
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
      STADO_CONTROL_PLATFORM: ${{ vars.STADO_CONTROL_PLATFORM }}
      STADO_API_HOST: stado.wisent.com
      STADO_DASHBOARD_UPSTREAM: ${{ vars.STADO_DASHBOARD_UPSTREAM }}
    steps:
      - name: Check out exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/stado-source.XXXXXX")"
          git clone --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$source_dir"
          git -C "$source_dir" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "STADO_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Prepare release implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stado-release-tools"
          cat > "$RUNNER_TEMP/stado-release-tools/release_manifest.sh" <<'STADO_EMBEDDED_EOF'
          # Emit the canonical immutable archive manifest shared by Stado products.
          set -eu
          
          die() {
              printf 'FATAL: %s\n' "$*" > /dev/stderr
              false
          }
          
          RELEASE_DIR="${STADO_RELEASE_DIR:?set STADO_RELEASE_DIR}"
          ARCHIVE="${STADO_RELEASE_ARCHIVE:?set STADO_RELEASE_ARCHIVE}"
          VERSION="${STADO_RELEASE_VERSION:?set STADO_RELEASE_VERSION}"
          PLATFORM="${STADO_RELEASE_PLATFORM:?set STADO_RELEASE_PLATFORM}"
          SOURCE_COMMIT="${STADO_RELEASE_SOURCE_COMMIT:?set STADO_RELEASE_SOURCE_COMMIT}"
          
          for command_name in jq openssl; do
              command -v "$command_name" >/dev/null || die "required command is unavailable: $command_name"
          done
          [ -s "$ARCHIVE" ] || die "release archive is missing or empty: $ARCHIVE"
          case "$VERSION" in
              *[![:alnum:]._-]* | "") die "invalid immutable release version" ;;
          esac
          case "$PLATFORM" in
              *[![:alnum:]._-]* | "") die "invalid immutable release platform" ;;
          esac
          case "$SOURCE_COMMIT" in
              *[!0-9a-fA-F]* | "") die "source commit must be hexadecimal" ;;
          esac
          
          sha256="$(openssl dgst -sha256 "$ARCHIVE" | sed 's/^.*= //')"
          manifest="$RELEASE_DIR/release-manifest-$PLATFORM.json"
          jq -cS -n \
              --arg product stado \
              --arg version "$VERSION" \
              --arg platform "$PLATFORM" \
              --arg source_commit "$SOURCE_COMMIT" \
              --arg sha256 "$sha256" \
              '{
                  "platform": $platform,
                  "product": $product,
                  "sha256": $sha256,
                  "source_commit": $source_commit,
                  "version": $version
              }' > "$manifest"
          printf '%s\n' "$manifest"
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/adopt_published_release.sh" <<'STADO_EMBEDDED_EOF'
          set -euo pipefail
          
          # Make a second attempt at one release coordinate possible.
          #
          # Release objects are create-only. The archive this train publishes is produced
          # by `stado storage archive`, and tar+gzip output is not byte-reproducible
          # across runs — mtimes, member order and the gzip header all move — while the
          # executables inside it carry `env!("CARGO_MANIFEST_DIR")`, which is a fresh
          # `$RUNNER_TEMP/stado-source.XXXX` on every checkout. So a rebuilt attempt at an
          # already-published version produces DIFFERENT bytes for the same names, and the
          # writer answers exactly that:
          #
          #   Error: immutable object already differs on the writer:
          #   stado://releases/stado/0.13.47/darwin-arm64/stado-v0.13.47-darwin-arm64.tar.gz
          #
          # 0.13.47 died there. Attempt 1 published all thirteen objects of its darwin
          # coordinate; attempt 2 rebuilt the archive, refused it twelve times, failed the
          # job, and `deploy-fleet` was skipped — a release whose bytes were complete and
          # public never reached a single host, and no later attempt at that tag could
          # have ended differently.
          #
          # The way out is to stop rebuilding what is already published. If the archive is
          # there, it IS the release: this adopts it and derives the whole release
          # directory from it, so every subsequent `storage put --if-absent` either
          # matches the published object exactly or creates the one that is missing. That
          # also completes a half-published coordinate instead of leaving it stranded,
          # which is the state `stado/0.11.0/darwin-arm64` has been in since April.
          #
          # Called with STADO_API_URL pointing at the authenticated writer, the same
          # origin the publish loop uses.
          
          if [ "$#" -ne 5 ]; then
            echo "usage: adopt_published_release.sh STADO_BIN RELEASE_DIR PRODUCT VERSION PLATFORM" >&2
            exit 2
          fi
          
          stado_bin="$1"
          release_dir="$2"
          product="$3"
          version="$4"
          platform="$5"
          
          case "$product" in
            *[![:alnum:]_-]*|"") echo "invalid release product: $product" >&2; exit 2 ;;
          esac
          case "$version" in
            *[![:alnum:]._-]*|"") echo "invalid release version: $version" >&2; exit 2 ;;
          esac
          case "$platform" in
            *[![:alnum:]_-]*|"") echo "invalid release platform: $platform" >&2; exit 2 ;;
          esac
          
          test -x "$stado_bin"
          test -d "$release_dir"
          
          prefix="stado://releases/$product/$version/$platform"
          archive_name="$product-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          
          published_state() {
            "$stado_bin" storage stat "$prefix/$1" --json | jq -er '.state'
          }
          
          # `storage stat` answers present or absent with exit status zero and reserves
          # non-zero for a store that did not answer. Guessing "absent" from a store that
          # is merely unreachable would rebuild over a live coordinate, so an unusable
          # answer stops this instead.
          archive_state="$(published_state "$archive_name")"
          case "$archive_state" in
            absent)
              echo "no published $prefix/$archive_name: this attempt publishes its own build"
              exit 0
              ;;
            present) ;;
            *)
              echo "::error::the writer could not say whether $prefix/$archive_name exists" \
                "(state $archive_state); this attempt will not rebuild over a coordinate it cannot read" >&2
              exit 1
              ;;
          esac
          
          echo "adopting the published $prefix/$archive_name; this attempt publishes no rebuilt bytes"
          "$stado_bin" storage get "$prefix/$archive_name" "$release_dir/$archive_name"
          # The archive carries every executable plus SHA256SUMS, so extracting it over
          # the release directory replaces this attempt's build with the bytes the
          # coordinate already holds — which is what the publish loop, the public
          # validation and the delivery all have to agree about.
          /usr/bin/tar -xzf "$release_dir/$archive_name" -C "$release_dir"
          
          # The manifest is regenerated deterministically from the adopted archive by the
          # caller's own manifest step (product, version, platform, source_commit and the
          # archive digest, and nothing else), so a published one must still match. Taking
          # the published copy when it exists means the comparison is against the bytes a
          # consumer gets rather than against a second derivation of them.
          manifest_state="$(published_state "$manifest_name")"
          case "$manifest_state" in
            present) "$stado_bin" storage get "$prefix/$manifest_name" "$release_dir/$manifest_name" ;;
            absent)
              echo "$prefix/$manifest_name is absent; the adopted archive's manifest will be published"
              ;;
            *)
              echo "::error::the writer could not say whether $prefix/$manifest_name exists" \
                "(state $manifest_state)" >&2
              exit 1
              ;;
          esac
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" <<'STADO_EMBEDDED_EOF'
          set -euo pipefail
          
          if [ "$#" -ne 6 ]; then
            echo "usage: verify_public_stado_release.sh STADO_BIN RELEASE_DIR PRODUCT VERSION PLATFORM SCRATCH_DIR" >&2
            exit 2
          fi
          
          stado_bin="$1"
          release_dir="$2"
          product="$3"
          version="$4"
          platform="$5"
          scratch_dir="$6"
          
          case "$product" in
            *[![:alnum:]_-]*|"") echo "invalid release product: $product" >&2; exit 2 ;;
          esac
          case "$version" in
            *[![:alnum:]._-]*|"") echo "invalid release version: $version" >&2; exit 2 ;;
          esac
          case "$platform" in
            *[![:alnum:]_-]*|"") echo "invalid release platform: $platform" >&2; exit 2 ;;
          esac
          
          test -x "$stado_bin"
          test -d "$release_dir"
          test -d "$scratch_dir"
          
          prefix="stado://releases/$product/$version/$platform"
          version_claim_uri="stado://releases/$product/$version/source-revision.json"
          platform_claim_uri="$prefix/source-revision.json"
          archive_name="$product-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          test -f "$release_dir/$archive_name"
          test -f "$release_dir/$manifest_name"
          
          # One coordinate, two producers. This workflow publishes the executables,
          # SHA256SUMS, the platform archive and the platform manifest. The product's own
          # signed-release path publishes `release.json`, `release.sig`, `release.tar.gz`
          # and `qualification.json` into the SAME prefix — see
          # `cli::release_submit::publish`, which records
          # `stado://releases/<product>/<version>/<platform>/qualification.json` as the
          # run's qualification URI. 0.13.45's linux leg is exactly that state: nine
          # objects from here, four from there, and a check that expected the coordinate
          # to hold only what this runner had on disk refused a complete release.
          #
          # The platform `source-revision.json` remains a coordinate member for older
          # clients. The platformless version claim sits one level above this listing and
          # is fetched and compared below; it is the create-only arbitration point shared
          # by every publisher and platform.
          # `[A-Z_]*` and not `[A-Z]*`: a two-word constant like
          # `RELEASE_REVISION_NAME`'s successors would otherwise be silently skipped and
          # read as a member nobody declares.
          control_source="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)/stado-rs/src/release_control.rs"
          test -f "$control_source"
          control_names="$(
            sed -n 's/^pub const RELEASE_[A-Z_]*_NAME: &str = "\([^"]*\)";$/\1/p' "$control_source" |
              sort -u
          )"
          declared_control="$(printf '%s\n' "$control_names" | sed '/^$/d' | /usr/bin/wc -l | tr -d '[:space:]')"
          if [ "$declared_control" -lt 5 ]; then
            echo "$control_source declares $declared_control release-owned object name(s);" \
              "this check needs them to know which members the pipeline and the coordinate" \
              "claim write" >&2
            exit 1
          fi
          
          # Every immutable put already reads the exact bytes back through the authenticated
          # writer. Public validation therefore has a different job: prove that the public
          # route exposes that complete coordinate. The archive contains every executable
          # plus SHA256SUMS, so one exact archive read proves their bytes through the public
          # route. The listing proves that every standalone object is also visible with its
          # writer-verified size. Re-downloading each executable repeated hundreds of MiB
          # and exceeded the release runner's wall-clock budget without proving more.
          #
          # A chunked put stages its parts at `<key>.__stado_upload/<id>/<index>` under
          # this same prefix, and the composition that finishes the object deletes them.
          # An interrupted upload therefore leaves parts a later attempt cleans up:
          # 0.13.44's first darwin attempt left four when the runner lost its connection
          # mid-archive. Parts are upload state, never coordinate members, so they are
          # dropped here — while any OTHER unexpected member still fails the coordinate.
          listing="$(
            $stado_bin storage objects releases "$product/$version/$platform/" --json |
              jq -c '{objects: [.objects[] | select((.key // .uri) | contains(".__stado_upload/") | not)]}'
          )"
          
          version_claim="$scratch_dir/public-$version-source-revision.json"
          platform_claim="$scratch_dir/public-$version-$platform-source-revision.json"
          rm -f "$version_claim" "$platform_claim"
          "$stado_bin" storage get "$version_claim_uri" "$version_claim"
          "$stado_bin" storage get "$platform_claim_uri" "$platform_claim"
          source_revision="$(
            jq -er --arg product "$product" --arg version "$version" '
              select(
                keys == ["product", "schema_version", "source_revision", "version"] and
                .schema_version == 1 and
                .product == $product and
                .version == $version and
                (.source_revision | test("^[0-9a-f]{40}$"))
              ) | .source_revision
            ' "$version_claim"
          )"
          jq -e \
            --arg product "$product" \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_revision "$source_revision" '
              keys == ["platform", "product", "schema_version", "source_revision", "version"] and
              .schema_version == 1 and
              .product == $product and
              .version == $version and
              .platform == $platform and
              .source_revision == $source_revision
            ' "$platform_claim" >/dev/null
          jq -e \
            --arg product "$product" \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_revision "$source_revision" '
              .product == $product and
              .version == $version and
              .platform == $platform and
              .source_commit == $source_revision
            ' "$release_dir/$manifest_name" >/dev/null
          for source in "$release_dir"/*; do
            name="${source##*/}"
            uri="$prefix/$name"
            size="$(/usr/bin/wc -c < "$source" | tr -d '[:space:]')"
            if ! jq -e --arg uri "$uri" --argjson size "$size" \
              '([.objects[] | select(.uri == $uri and .size == $size)] | length) == 1' \
              <<<"$listing" >/dev/null; then
              echo "public release coordinate omitted $uri at its writer-verified size $size" >&2
              exit 1
            fi
          done
          
          # Every member is now accounted for by one of the two producers, so anything
          # left over is an object nobody declares — a stray write into an immutable
          # coordinate, which is what this check is for.
          declared="$(
            {
              printf '%s\n' "$control_names"
              for source in "$release_dir"/*; do printf '%s\n' "${source##*/}"; done
            } | jq -R -s 'split("\n") | map(select(length > 0))'
          )"
          undeclared="$(
            jq -r --argjson declared "$declared" '
              ([.objects[] | (.key // .uri) | sub(".*/"; "")] - $declared) | unique | join(" ")
            ' <<<"$listing"
          )"
          if [ -n "$undeclared" ]; then
            echo "public release coordinate carries member(s) neither producer declares: $undeclared" >&2
            exit 1
          fi
          
          for name in "$archive_name" "$manifest_name"; do
            source="$release_dir/$name"
            uri="$prefix/$name"
            delivered="$scratch_dir/public-$platform-$name"
            visible=false
            for attempt in $(seq 1 12); do
              rm -f "$delivered"
              if "$stado_bin" storage get "$uri" "$delivered" &&
                 cmp --silent "$source" "$delivered"; then
                visible=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$visible" != true ]; then
              echo "public release delivery did not serve immutable $uri" >&2
              exit 1
            fi
          done
          STADO_EMBEDDED_EOF

      - name: Build native Rust control plane
        run: |
          cd "$STADO_SOURCE_DIR/stado-rs"
          cargo build --release --locked --bins

      - name: Validate selected deployment profile
        run: |
          if [ -z "$STADO_CONFIG" ] || [ ! -r "$STADO_CONFIG" ]; then
            echo "::error::STADO_CONFIG must name the persistent profile installed by SecretStateRepair."
            false
          fi
          if [ "$STADO_ENABLE_AZURE_DEPLOY" = true ]; then
            backend="$(jq -er '.storage.backend' "$STADO_CONFIG")"
            test "$backend" = azure
            ! jq -e '.providers_disabled // [] | index("azure") != null' "$STADO_CONFIG" >/dev/null
            jq -e '.providers // [] | index("azure") != null' "$STADO_CONFIG" >/dev/null
          fi

      # The public route, asked BEFORE anything is published, because every
      # later step depends on it and the repair for it used to sit at the end
      # of the job. On 2026-09-04 this job failed at "Create immutable native
      # release through Stado" while the loopback listener behind the route
      # was down, so "Reconcile public release ingress" - which IS the repair,
      # `stado host recover-object-api` - was skipped on exactly the run that
      # needed it, and the route stayed 502 for hours. Asking here fails the
      # job in seconds with the route's own answer instead of after a full
      # build and publish.
      - name: Require the public release route before publishing
        run: |
          route="$STADO_PUBLIC_RELEASE_API_URL/api/release/object"
          # A malformed `uri` is answered by the route's own handler, so the
          # expected status is a refusal, not a success: what is being tested
          # is that the loopback listener answers at all. 502 is what a dead
          # listener behind the Funnel produces, and 000 is curl failing to
          # reach the host.
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "$route?uri=stado://releases/precondition")"
          echo "public release route answered HTTP $status"
          case "$status" in
            502|503|504|000)
              echo "::error::The public release route answers HTTP $status: the object API behind it is not serving. Repair it with 'stado host recover-object-api charless-mac-mini' before publishing."
              false
              ;;
          esac


      - name: Create immutable native release through Stado
        run: |
          release_dir="$RUNNER_TEMP/stado-native-release"
          mkdir -p "$release_dir"
          # The binary set this platform publishes, declared once. SHA256SUMS
          # is generated from it and the post-publish read-back below asserts
          # against the same words, so the check cannot fall out of step with
          # the declaration. `wc` is a copy of `stado`, not a separate build,
          # which is why it is in this list and not in the build loop.
          release_binaries="stado wc stado-coverage stado-fix stado-watchdog stado-mcp"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "$STADO_SOURCE_DIR/stado-rs/target/release/$name" "$release_dir/$name"
          done
          cp "$release_dir/stado" "$release_dir/wc"
          (
            cd "$release_dir"
            for name in $release_binaries; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )
          version_line="$(sed -n '/^version = /p' "$STADO_SOURCE_DIR/stado-rs/Cargo.toml")"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          # This job clones the tag itself, so it derives the version a second
          # time. Two derivations of one fact must be checked against each
          # other rather than assumed equal: `identity` is what asserted the
          # tag names this version, and publishing a coordinate it never
          # judged would put bytes at an address nothing qualified.
          test "$version" = "${{ needs.identity.outputs.version }}" || {
            echo "::error::this clone declares $version but the qualified tag names ${{ needs.identity.outputs.version }}"
            false
          }
          case "${STADO_CONTROL_PLATFORM:?set the native release platform}" in
            macos-arm64|darwin-arm64) platform=darwin-arm64 ;;
            *) platform="$STADO_CONTROL_PLATFORM" ;;
          esac
          stado_bin="$STADO_SOURCE_DIR/stado-rs/target/release/stado"
          archive="$RUNNER_TEMP/stado-$platform.tar.gz"
          "$stado_bin" storage archive "$release_dir" "$archive"
          machine_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$STADO_SOURCE_DIR/stado-rs/src/machine.rs"
          )"
          schema_unit="$(printf x | /usr/bin/wc -c | tr -d '[:space:]')"
          config_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$STADO_SOURCE_DIR/stado-rs/src/config_file.rs"
          )"
          storage_schema="$(
            sed -n '/pub const STORAGE_LAYOUT_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$STADO_SOURCE_DIR/stado-rs/src/queue/mod.rs"
          )"
          test "$config_schema" != "true as u16" || config_schema="$schema_unit"
          test "$storage_schema" != "true as u16" || storage_schema="$schema_unit"
          test -n "$machine_schema"
          test -n "$config_schema"
          test -n "$storage_schema"
          STADO_RELEASE_DIR="$release_dir" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$version" \
          STADO_RELEASE_CHANNEL="${{ needs.identity.outputs.channel }}" \
          STADO_RELEASE_PLATFORM="$platform" \
          STADO_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
          STADO_RELEASE_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          STADO_RELEASE_BUILT_AT="$(git -C "$STADO_SOURCE_DIR" show -s --format=%cI "$GITHUB_SHA")" \
          STADO_MACHINE_SCHEMA_VERSION="$machine_schema" \
          STADO_CONFIG_SCHEMA_VERSION="$config_schema" \
          STADO_STORAGE_SCHEMA_VERSION="$storage_schema" \
          STADO_LICENSE_FILE="$STADO_SOURCE_DIR/LICENSE" \
          STADO_RELEASE_STABLE_INTEGRATIONS="local-compute,local-filesystem-storage,skarbiec,stado-object-storage" \
          STADO_RELEASE_PREVIEW_INTEGRATIONS="gcs-storage,s3-storage,azure-blob-storage,gcp-compute,aws-ec2,azure-vm,box,vast" \
            bash "$RUNNER_TEMP/stado-release-tools/release_manifest.sh"
          mv "$archive" "$release_dir/stado-v$version-$platform.tar.gz"
          # Each put reads exact bytes back through the authenticated writer;
          # public delivery is verified in the next step.
          export STADO_API_URL="$STADO_WRITER_API_URL"
          # Claim the shared version source record and this platform record
          # before publishing any artifact. Every producer uses this command,
          # so platform ordering cannot split one version across commits.
          "$stado_bin" release claim-coordinate stado "$version" "$platform" \
            --source-commit "$GITHUB_SHA"
          # Largest object first, and it is the archive by two orders of
          # magnitude. Alphabetical order put it last, behind SHA256SUMS, the
          # manifest and four binaries -- so the one object whose transfer
          # actually fails failed with six create-only objects already
          # published, and no later attempt could ever complete that version:
          # a rebuild lands in a fresh `$RUNNER_TEMP/stado-source.XXXX`, that
          # path is baked into the binary by `env!("CARGO_MANIFEST_DIR")`, and
          # the resumed run is refused with "immutable object already differs on
          # the writer: .../SHA256SUMS". 0.9.4 died exactly that way at
          # 20:41:46Z on `infra_down` and again at 20:47:39Z on the differing
          # digest.
          #
          # Publishing the archive first makes the flakiest write the one that
          # cannot poison a version: it either lands, and the small objects
          # follow, or nothing for that version exists and the same tag can be
          # retried clean.
          #
          # And when it DID land, the retry adopts it. That is what 0.13.47
          # needed: attempt 1 published all thirteen objects of its darwin
          # coordinate, attempt 2 rebuilt the archive and was refused twelve
          # times with "immutable object already differs on the writer", the job
          # failed, and `deploy-fleet` was skipped — a complete, public release
          # that reached no host, on a tag no later attempt could have saved.
          archive_name="stado-v$version-$platform.tar.gz"
          bash "$RUNNER_TEMP/stado-release-tools/adopt_published_release.sh" \
            "$stado_bin" "$release_dir" stado "$version" "$platform"
          # The same bounded retry the Linux publisher above has had all along.
          # `storage put --if-absent` is idempotent for identical immutable
          # bytes and verifies them through the authenticated writer before
          # returning, so a retry either completes the same object or refuses
          # it; what it cannot do is invent one. The native publisher had no
          # retry at all, which is why one `infra_down` on the 72 MB archive
          # ended the release train while the Linux job rode out the same class
          # of stall twelve times over.
          publish() {
            uri="stado://releases/stado/$version/$platform/$1"
            for attempt in $(seq 1 12); do
              if "$stado_bin" storage put "$uri" "$release_dir/$1" --if-absent; then
                return 0
              fi
              sleep "$((attempt * 2))"
            done
            # No attempt composed, so the parts this staged are residue: a
            # coordinate holding `<key>.__stado_upload/<id>/<index>` and no
            # object. The 0.15.25 darwin-arm64 archive was left exactly so.
            "$stado_bin" storage abort-upload "$uri" --json || true
            echo "::error::Could not create and verify $uri after 12 attempts"
            return 1
          }
          publish "$archive_name"
          for source in "$release_dir"/*; do
            name="${source##*/}"
            test "$name" != "$archive_name" || continue
            publish "$name"
          done
          # A publish loop that returned cleanly is not the same claim as a
          # complete version. Read the coordinate back and compare it against
          # the same declaration SHA256SUMS was generated from, plus the three
          # release files themselves. `stado/0.11.0/darwin-arm64` holds the
          # archive, the manifest, SHA256SUMS and `stado` alone -- five
          # binaries short -- and nothing in this job noticed, because the
          # connection to api.github.com dropped mid-loop and the version was
          # left immutable and unusable with the job reporting what it had
          # managed rather than what it had promised.
          #
          # Listed through the same authenticated writer route the puts went
          # to, in one call, so the answer is immediate and does not depend on
          # public delivery having caught up yet. The assignment takes the
          # exit status of `stado` directly -- no pipe -- so a writer that
          # cannot answer fails the job instead of reading as an empty
          # coordinate with every object missing.
          published="$(
            "$stado_bin" storage objects releases "stado/$version/$platform/" --json
          )"
          missing=""
          for name in $release_binaries SHA256SUMS "$archive_name" \
                      "release-manifest-$platform.json"; do
            uri="stado://releases/stado/$version/$platform/$name"
            if ! printf '%s' "$published" |
                 jq -e --arg uri "$uri" '[.objects[].uri] | index($uri) != null' \
                 >/dev/null; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::$version is half-published on $platform; these declared objects are absent:$missing"
            false
          fi
          echo "STADO_NATIVE_RELEASE_PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "STADO_NATIVE_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "STADO_NATIVE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # Immediately after publication and `if: always()`, because this step IS
      # the route's repair - `stado host recover-object-api` - and it used to
      # sit at the END of this job, after delivery. That order meant it was
      # skipped on precisely the runs that broke the route: on 2026-09-04 the
      # job failed at "Create immutable native release through Stado" and this
      # step never ran, leaving `/api/release/object` answering 502 through
      # both the Funnel and `stado.wisent.com` while `install-stado.sh`,
      # `self_update.rs`, `host_release.rs` and `host_recovery_release.rs` all
      # read that path. A repair reachable only on the happy path is not a
      # repair.
      - name: Reconcile public release ingress
        if: always()
        run: |
          "$HOME/.stado/bin/stado" host recover-object-api \
            charless-mac-mini --json \
            > "$RUNNER_TEMP/public-release-ingress.json"
          # `jq -e` judges only the LAST value of a stream, and this host serves
          # four `.Web` entries — `:443`, `:8443`, `:9443`, `:10000`. The
          # release route belongs to `:443` alone, so the stream read
          # `false true false false` and the exit status came from `:10000`
          # having no such handler. 0.9.5 published both platforms, delivered
          # them, and then reported failure on that last `false` while the
          # condition the step means to assert was true.
          #
          # The question is "does some `:443` entry proxy the release route",
          # so it is asked of the whole set at once. `any` over an empty array
          # is false, so a host serving the route nowhere still refuses.
          "$HOME/.stado/bin/stado" host exec charless-mac-mini -- \
            tailscale serve status --json |
            jq -e '
              [
                (.Web // {}) | to_entries[] |
                (.key | endswith(":443")) and
                (.value.Handlers["/api/release/object"].Proxy ==
                  "http://127.0.0.1:8765/api/release/object")
              ] | any
            '

      - name: Validate public native release delivery
        run: |
          export STADO_API_URL="$STADO_PUBLIC_RELEASE_API_URL"
          stado_bin="$STADO_SOURCE_DIR/stado-rs/target/release/stado"
          bash "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" \
            "$stado_bin" "$STADO_NATIVE_RELEASE_DIR" stado \
            "$STADO_NATIVE_RELEASE_VERSION" "$STADO_NATIVE_RELEASE_PLATFORM" \
            "$RUNNER_TEMP"

      - name: Retain the published native delivery driver
        uses: actions/upload-artifact@v4
        with:
          name: stado-native-driver-${{ github.sha }}
          path: |
            ${{ env.STADO_NATIVE_RELEASE_DIR }}/stado
            ${{ env.STADO_NATIVE_RELEASE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Converge every required native delivery and reader
        run: |
          export STADO_API_URL="$STADO_PUBLIC_RELEASE_API_URL"
          stado_bin="$STADO_SOURCE_DIR/stado-rs/target/release/stado"
          targets="$(
            jq -er --arg platform "$STADO_NATIVE_RELEASE_PLATFORM" '
              [
                .deliveries[]
                | select(.required == true and .platform == $platform)
                | select(.argv[0:3] == ["stado", "release", "install-local"])
                | .target
              ]
              | if length > 0 and length == (unique | length)
                then .[]
                else error("required native Stado delivery targets must be present and unique")
                end
            ' "$STADO_SOURCE_DIR/.wisent-release.json"
          )"
          while IFS= read -r target; do
            test -n "$target"
            "$stado_bin" host declare-version "$target" \
              --binary stado \
              --version "$STADO_NATIVE_RELEASE_VERSION" \
              --json
            "$stado_bin" service converge "$target" stado --apply --json
          done <<<"$targets"


      - name: Reload TLS reverse proxy
        if: ${{ vars.STADO_ENABLE_AZURE_DEPLOY == 'true' }}
        run: |
          if [ -z "$STADO_DASHBOARD_UPSTREAM" ]; then
            STADO_DASHBOARD_UPSTREAM="$(
              "$HOME/.stado/bin/stado" config show |
                jq -er '.resolved.dashboard_bind + ":" + (.resolved.dashboard_port | tostring)'
            )"
            export STADO_DASHBOARD_UPSTREAM
          fi
          if ! command -v caddy >/dev/null; then
            echo "::error::Caddy is not installed on the control-plane runner."
            false
          fi
          caddy reload \
            --config "$STADO_SOURCE_DIR/deploy/azure/Caddyfile.example" \
            --adapter caddyfile

      - name: Reclaim native Rust release cache
        if: always()
        run: |
          if [ -n "${STADO_SOURCE_DIR:-}" ]; then
            manifest="$STADO_SOURCE_DIR/stado-rs/Cargo.toml"
            if [ -f "$manifest" ]; then
              cargo clean --manifest-path "$manifest"
            fi
          fi

  deploy-fleet:
    needs: [identity, publish-linux, deploy-control-plane]
    if: needs.identity.outputs.channel == 'stable'
    runs-on: [self-hosted, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      STADO_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download the source-bound native delivery driver
        uses: actions/download-artifact@v4
        with:
          name: stado-native-driver-${{ github.sha }}
          path: ${{ runner.temp }}/stado-native-driver
      - name: Converge every required Linux delivery and reader
        run: |
          set -euo pipefail
          driver_dir="$RUNNER_TEMP/stado-native-driver"
          stado_bin="$driver_dir/stado"
          expected="$(sed -n 's/^\([0-9a-f]\{64\}\)  stado$/\1/p' "$driver_dir/SHA256SUMS")"
          actual="$(openssl dgst -sha256 "$stado_bin")"
          test -n "$expected"
          test "${actual##* }" = "$expected"
          chmod 755 "$stado_bin"
          version_line="$(sed -n '/^version = /p' stado-rs/Cargo.toml)"
          declared="${version_line#*\"}"
          declared="${declared%%\"*}"
          test "$declared" = "$STADO_VERSION"
          targets="$(
            jq -er '
              [
                .deliveries[]
                | select(.required == true and .platform == "linux-amd64")
                | select(.argv[0:3] == ["stado", "release", "install-local"])
                | .target
              ]
              | if length > 0 and length == (unique | length)
                then .[]
                else error("required Linux Stado delivery targets must be present and unique")
                end
            ' .wisent-release.json
          )"
          while IFS= read -r target; do
            test -n "$target"
            "$stado_bin" host declare-version "$target" \
              --binary stado \
              --version "$STADO_VERSION" \
              --json
            "$stado_bin" service converge "$target" stado --apply --json
          done <<<"$targets"
