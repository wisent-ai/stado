name: deploy

on:
  push:
    tags:
      - "stado-v*"

concurrency:
  # A newer canonical tag supersedes every older release train, including one
  # already waiting for the control-plane runner. Publication is create-only and
  # every write below is followed by immutable read-back, so a cancelled attempt
  # can be resumed safely by its successor without mutating published bytes.
  group: wisent-compute-release-train
  cancel-in-progress: true

jobs:
  qualification:
    # Do not occupy the sole publisher runner while the exact source revision is
    # still queued for qualification. The Version check workflow owns the verdict;
    # this workflow consumes that one verdict instead of implementing a second gate.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful exact-head Version check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/version-check.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=100"
            )"
            verdict="$(
              jq -r --arg sha "$SOURCE_SHA" '
                [.workflow_runs[]
                  | select(
                      .head_sha == $sha and
                      .head_branch == "main" and
                      .event == "push"
                    )]
                | sort_by(.run_number)
                | last
                | if . == null then
                    "missing\t\t"
                  else
                    [.status, (.conclusion // ""), .html_url] | @tsv
                  end
              ' <<<"$runs"
            )"
            IFS=$'\t' read -r status conclusion url <<<"$verdict"
            case "$status:$conclusion" in
              completed:success)
                echo "Exact source qualification passed: $url"
                exit 0
                ;;
              completed:*)
                echo "::error::Exact source qualification concluded ${conclusion:-without a verdict}: $url"
                exit 1
                ;;
              missing:|queued:|in_progress:|waiting:|pending:|requested:)
                echo "Waiting for Version check on $SOURCE_SHA (attempt $attempt/180): $status"
                sleep 20
                ;;
              *)
                echo "::error::Unrecognized Version check state '$status:$conclusion': $url"
                exit 1
                ;;
            esac
          done
          echo "::error::Timed out waiting for exact source qualification on $SOURCE_SHA"
          exit 1

  release:
    needs: qualification
    outputs:
      channel: ${{ steps.release_identity.outputs.channel }}
      version: ${{ steps.release_identity.outputs.version }}
    runs-on: [self-hosted, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      # The writer uses one declared resolver adapter for both mutation and
      # authenticated read-back. Fleet delivery verifies the public read-only
      # Funnel separately after publication.
      STADO_WRITER_API_URL: http://127.0.0.1:18776
      STADO_PUBLIC_RELEASE_API_URL: https://lukaszs-macbook-pro-4007-2.tail6443b3.ts.net
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
    steps:
      # v4 runs on Node 20, which GitHub has deprecated and already forces onto Node
      # 24; v5 is the first major that targets Node 24 itself. It needs a runner of at
      # least 2.327.1 and this control plane runs 2.336.0. Held at the oldest major
      # that resolves the deprecation rather than the newest one published, because
      # this job publishes create-only release objects and a checkout that changes
      # behaviour under it cannot be corrected after the fact.
      - uses: actions/checkout@v5
      - name: Ensure daemonless cross-build toolchain
        run: |
          PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          export PATH
          printf '%s\n' /opt/homebrew/bin "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v zig >/dev/null || /opt/homebrew/bin/brew install zig
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked
      - name: Resolve exact release identity
        id: release_identity
        run: |
          die() {
            printf 'FATAL: %s\n' "$*" > /dev/stderr
            false
          }
          version_line="$(sed -n '/^version = /p' stado-rs/Cargo.toml)"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          test -n "$version" || die "Cargo release version is unresolved"
          test "$GITHUB_REF_NAME" = "stado-v$version" ||
            die "tag $GITHUB_REF_NAME must equal stado-v$version"
          case "$version" in
            *-*) channel=candidate ;;
            *) channel=stable ;;
          esac
          echo "STADO_VERSION=$version" >> "$GITHUB_ENV"
          echo "STADO_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"


      - name: Build provider-neutral Rust release
        # The control-plane runner is an arm64 Mac. Build the exact Linux x86_64
        # target with cargo-zigbuild: unlike Docker Desktop it has no daemon whose
        # manually-started state can decide whether a release exists.
        run: |
          target="x86_64-unknown-linux-gnu"
          cargo zigbuild --manifest-path stado-rs/Cargo.toml --locked \
            --release --bins --target "$target"
          release_dir="$RUNNER_TEMP/stado-release"
          mkdir -p "$release_dir"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "stado-rs/target/$target/release/$name" "$release_dir/$name"
          done
          cp "$release_dir/stado" "$release_dir/wc"
          (
            cd "$release_dir"
            for name in stado wc stado-coverage stado-fix stado-watchdog stado-mcp; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )

      - name: Build native release publisher CLI
        run: cargo build --manifest-path stado-rs/Cargo.toml --locked --release --bin stado

      - name: Verify and repair the declared object service
        run: |
          set -euo pipefail
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          case "$STADO_WRITER_API_URL" in
            http://127.0.0.1:18776) ;;
            *) echo "::error::release writer must use the declared loopback resolver"; false ;;
          esac
          export STADO_API_URL="$STADO_WRITER_API_URL"
          "$stado_bin" resolver status --target lukasz-macbook --json \
            > "$RUNNER_TEMP/release-resolver.json"
          jq -e '
            .verdict == "ready" and
            any(
              .adapters[];
              .service == "stado-object-api" and
              .consumer == "stado-local-agent" and
              .bind == "127.0.0.1:18776" and
              .listening == true
            )
          ' "$RUNNER_TEMP/release-resolver.json" >/dev/null
          retry_command() {
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          preflight() {
            # The private namespace proves the object verifier. Listing the
            # product's release prefix separately proves the release verifier:
            # unlike a public stat/get, list is authenticated but read-only.
            "$stado_bin" storage stat \
              stado://probierz/__release_preflight__ --json \
              > "$RUNNER_TEMP/object-preflight.json" \
              2> "$RUNNER_TEMP/object-preflight.err" &&
            "$stado_bin" storage ls \
              stado://releases/stado/__release_preflight__ --json \
              > "$RUNNER_TEMP/release-preflight.json" \
              2> "$RUNNER_TEMP/release-preflight.err"
          }
          wait_for_preflight() {
            consecutive=0
            for attempt in $(seq 1 24); do
              if preflight; then
                consecutive=$((consecutive + 1))
                if [[ "$consecutive" -ge 3 ]]; then
                  return 0
                fi
              else
                consecutive=0
              fi
              sleep 5
            done
            cat "$RUNNER_TEMP/object-preflight.err" >&2
            cat "$RUNNER_TEMP/release-preflight.err" >&2
            echo "::error::object and release preflight did not remain healthy for three consecutive checks" >&2
            return 1
          }
          reconcile_release_lifecycles() {
            retry_command "$stado_bin" host reconcile-release-verifier \
              charless-mac-mini --json \
              > "$RUNNER_TEMP/release-lifecycles.json"
            jq -e '
              (.items | type == "array" and length > 0) and
              (.publisher_lifecycles | type == "array") and
              (.publisher_lifecycles | length) == (.items | length) and
              all(
                .publisher_lifecycles[];
                (.item | type == "string" and length > 0) and
                (.controller | type == "string" and length > 0) and
                (.mode == "owner" or .mode == "managed" or .mode == "external") and
                .readable == true
              )
            ' "$RUNNER_TEMP/release-lifecycles.json" >/dev/null
          }
          # Publisher items belong to their recorded controllers. Prove every
          # declared lifecycle and exact token read before the verifier grant
          # is refreshed; only then may the public writer canary run.
          reconcile_release_lifecycles
          if ! wait_for_preflight; then
            # Reconcile both declared verifier policies. Current object APIs
            # recover inline, which preserves every connection.
            retry_command "$stado_bin" host reconcile-object-verifier \
              charless-mac-mini --json
            reconcile_release_lifecycles
            if ! wait_for_preflight; then
              # Upgrade path for an older object API that cannot reload its
              # grants inline. Restarting can close the transport carrying this
              # command, so both subsequent preflights are authoritative.
              "$stado_bin" service restart \
                com.wisent.always-on.stado-object-api \
                --host charless-mac-mini --json || true
              wait_for_preflight
            fi
          fi
          state="$(jq -r '.state // ""' "$RUNNER_TEMP/object-preflight.json")"
          case "$state" in
            present|absent) ;;
            *) echo "::error::object preflight is ${state:-unanswered}"; false ;;
          esac
          jq -e '.objects | type == "array"' \
            "$RUNNER_TEMP/release-preflight.json" >/dev/null
          # A read grant cannot prove that this runner presents the publisher
          # token expected by the target. Retain one content-addressed canary:
          # create-if-absent plus exact authenticated read-back must both pass
          # through the validated writer resolver before publication starts.
          canary="$RUNNER_TEMP/release-write-preflight.json"
          printf '{"schema":"stado.release-write-preflight.v1","source_commit":"%s"}\n' \
            "$GITHUB_SHA" > "$canary"
          canary_sha="$(openssl dgst -sha256 "$canary" | sed 's/^.*= //')"
          canary_uri="stado://releases/stado/__release_preflight__/$canary_sha.json"
          "$stado_bin" storage put "$canary_uri" "$canary" --if-absent
          "$stado_bin" storage get \
            "$canary_uri" "$RUNNER_TEMP/release-write-preflight.stored.json"
          cmp --silent \
            "$canary" "$RUNNER_TEMP/release-write-preflight.stored.json"

      - name: Create Linux release manifest
        run: |
          machine_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              stado-rs/src/machine.rs
          )"
          schema_unit="$(printf x | /usr/bin/wc -c | tr -d '[:space:]')"
          config_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              stado-rs/src/config_file.rs
          )"
          storage_schema="$(
            sed -n '/pub const STORAGE_LAYOUT_VERSION:/{s/.*= //;s/;//;p;q;}' \
              stado-rs/src/queue/mod.rs
          )"
          test "$config_schema" != "true as u16" || config_schema="$schema_unit"
          test "$storage_schema" != "true as u16" || storage_schema="$schema_unit"
          test -n "$config_schema"
          test -n "$storage_schema"
          test -n "$machine_schema"
          release_dir="$RUNNER_TEMP/stado-release"
          archive="$RUNNER_TEMP/stado-linux-amd64.tar.gz"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          "$stado_bin" storage archive "$release_dir" "$archive"
          STADO_RELEASE_DIR="$RUNNER_TEMP/stado-release" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$STADO_VERSION" \
          STADO_RELEASE_CHANNEL="$STADO_RELEASE_CHANNEL" \
          STADO_RELEASE_PLATFORM="linux-amd64" \
          STADO_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
          STADO_RELEASE_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          STADO_RELEASE_BUILT_AT="$(git show -s --format=%cI "$GITHUB_SHA")" \
          STADO_MACHINE_SCHEMA_VERSION="$machine_schema" \
          STADO_CONFIG_SCHEMA_VERSION="$config_schema" \
          STADO_STORAGE_SCHEMA_VERSION="$storage_schema" \
          STADO_LICENSE_FILE="$GITHUB_WORKSPACE/LICENSE" \
          STADO_RELEASE_STABLE_INTEGRATIONS="local-compute,local-filesystem-storage,skarbiec,stado-object-storage" \
          STADO_RELEASE_PREVIEW_INTEGRATIONS="gcs-storage,s3-storage,azure-blob-storage,gcp-compute,aws-ec2,azure-vm,cloudflare,box,vast" \
            scripts/release_manifest.sh
          mv "$archive" "$release_dir/stado-v$STADO_VERSION-linux-amd64.tar.gz"


      - name: Create immutable Linux release through Stado
        run: |
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          export STADO_API_URL="$STADO_WRITER_API_URL"
          test -x "$stado_bin"
          for source in "$RUNNER_TEMP"/stado-release/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$STADO_VERSION/linux-amd64/$name"
            stored="$RUNNER_TEMP/stored-$name"
            published=false
            # The object boundary reloads its authorization independently of
            # the release runner. A reconciled service may therefore return
            # `object authorization unavailable` for longer than the old
            # four-attempt (20 second) window. Every retry is still safe:
            # creation is if-absent and each attempt reads the immutable bytes
            # back before declaring success.
            max_attempts=12
            for attempt in $(seq 1 "$max_attempts"); do
              rm -f "$stored"
              if ! "$stado_bin" storage put "$uri" "$source" --if-absent; then
                echo "Create attempt $attempt/$max_attempts did not complete; reading $uri back"
              fi
              if "$stado_bin" storage get "$uri" "$stored"; then
                if ! cmp --silent "$source" "$stored"; then
                  echo "::error::Published release object differs from its source at $uri"
                  false
                fi
                published=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$published" != true ]; then
              echo "::error::Could not create and read back $uri after $max_attempts attempts"
              false
            fi
          done

      - name: Validate public Linux release delivery
        run: |
          export STADO_API_URL="$STADO_PUBLIC_RELEASE_API_URL"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          for source in "$RUNNER_TEMP"/stado-release/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$STADO_VERSION/linux-amd64/$name"
            delivered="$RUNNER_TEMP/public-$name"
            visible=false
            for attempt in $(seq 1 12); do
              rm -f "$delivered"
              if "$stado_bin" storage get "$uri" "$delivered" &&
                 cmp --silent "$source" "$delivered"; then
                visible=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$visible" != true ]; then
              echo "::error::Public release delivery did not serve immutable $uri"
              false
            fi
          done

  deploy-control-plane:
    needs: release
    if: needs.release.outputs.channel == 'stable'
    runs-on: [self-hosted, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_WRITER_API_URL: http://127.0.0.1:18776
      STADO_PUBLIC_RELEASE_API_URL: https://lukaszs-macbook-pro-4007-2.tail6443b3.ts.net
      STADO_ENABLE_AZURE_DEPLOY: ${{ vars.STADO_ENABLE_AZURE_DEPLOY }}
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      COORD_TARGET: ${{ vars.STADO_COORDINATOR_TARGET }}
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
      WC_SKARBIEC_CONSUMER: stado-release-publisher
      WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
      STADO_CONTROL_PLATFORM: ${{ vars.STADO_CONTROL_PLATFORM }}
      STADO_API_HOST: stado.wisent.com
      STADO_DASHBOARD_UPSTREAM: ${{ vars.STADO_DASHBOARD_UPSTREAM }}
    steps:
      - name: Check out exact source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/stado-source.XXXXXX")"
          git clone --no-checkout \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$source_dir"
          git -C "$source_dir" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source_dir" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "STADO_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Build native Rust control plane
        run: |
          cd "$STADO_SOURCE_DIR/stado-rs"
          cargo build --release --locked --bins

      - name: Validate selected deployment profile
        run: |
          if [ -z "$STADO_CONFIG" ] || [ ! -r "$STADO_CONFIG" ]; then
            echo "::error::STADO_CONFIG must name the persistent profile installed by SecretStateRepair."
            false
          fi
          if [ "$STADO_ENABLE_AZURE_DEPLOY" = true ]; then
            backend="$(jq -er '.storage.backend' "$STADO_CONFIG")"
            test "$backend" = azure
            ! jq -e '.providers_disabled // [] | index("azure") != null' "$STADO_CONFIG" >/dev/null
            jq -e '.providers // [] | index("azure") != null' "$STADO_CONFIG" >/dev/null
          fi


      - name: Create immutable native release through Stado
        run: |
          release_dir="$RUNNER_TEMP/stado-native-release"
          mkdir -p "$release_dir"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "$STADO_SOURCE_DIR/stado-rs/target/release/$name" "$release_dir/$name"
          done
          cp "$release_dir/stado" "$release_dir/wc"
          (
            cd "$release_dir"
            for name in stado wc stado-coverage stado-fix stado-watchdog stado-mcp; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )
          version_line="$(sed -n '/^version = /p' "$STADO_SOURCE_DIR/stado-rs/Cargo.toml")"
          version="${version_line#*\"}"
          version="${version%%\"*}"
          case "${STADO_CONTROL_PLATFORM:?set the native release platform}" in
            macos-arm64|darwin-arm64) platform=darwin-arm64 ;;
            *) platform="$STADO_CONTROL_PLATFORM" ;;
          esac
          stado_bin="$STADO_SOURCE_DIR/stado-rs/target/release/stado"
          archive="$RUNNER_TEMP/stado-$platform.tar.gz"
          "$stado_bin" storage archive "$release_dir" "$archive"
          machine_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$STADO_SOURCE_DIR/stado-rs/src/machine.rs"
          )"
          schema_unit="$(printf x | /usr/bin/wc -c | tr -d '[:space:]')"
          config_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$STADO_SOURCE_DIR/stado-rs/src/config_file.rs"
          )"
          storage_schema="$(
            sed -n '/pub const STORAGE_LAYOUT_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$STADO_SOURCE_DIR/stado-rs/src/queue/mod.rs"
          )"
          test "$config_schema" != "true as u16" || config_schema="$schema_unit"
          test "$storage_schema" != "true as u16" || storage_schema="$schema_unit"
          test -n "$machine_schema"
          test -n "$config_schema"
          test -n "$storage_schema"
          STADO_RELEASE_DIR="$release_dir" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$version" \
          STADO_RELEASE_CHANNEL="${{ needs.release.outputs.channel }}" \
          STADO_RELEASE_PLATFORM="$platform" \
          STADO_RELEASE_SOURCE_COMMIT="$GITHUB_SHA" \
          STADO_RELEASE_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          STADO_RELEASE_BUILT_AT="$(git -C "$STADO_SOURCE_DIR" show -s --format=%cI "$GITHUB_SHA")" \
          STADO_MACHINE_SCHEMA_VERSION="$machine_schema" \
          STADO_CONFIG_SCHEMA_VERSION="$config_schema" \
          STADO_STORAGE_SCHEMA_VERSION="$storage_schema" \
          STADO_LICENSE_FILE="$STADO_SOURCE_DIR/LICENSE" \
          STADO_RELEASE_STABLE_INTEGRATIONS="local-compute,local-filesystem-storage,skarbiec,stado-object-storage" \
          STADO_RELEASE_PREVIEW_INTEGRATIONS="gcs-storage,s3-storage,azure-blob-storage,gcp-compute,aws-ec2,azure-vm,box,vast" \
            "$STADO_SOURCE_DIR/scripts/release_manifest.sh"
          mv "$archive" "$release_dir/stado-v$version-$platform.tar.gz"
          # Publish and read back through the authoritative service's declared
          # resolver adapter; public delivery is verified in the next step.
          export STADO_API_URL="$STADO_WRITER_API_URL"
          for source in "$release_dir"/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$version/$platform/$name"
            if ! "$stado_bin" storage put "$uri" "$source" --if-absent; then
              echo "Object already exists or the create was refused; reading $uri back"
            fi
            stored="$RUNNER_TEMP/stored-native-$name"
            "$stado_bin" storage get "$uri" "$stored"
            if ! cmp --silent "$source" "$stored"; then
              echo "::error::Published release object differs from its source at $uri"
              false
            fi
          done
          echo "STADO_NATIVE_RELEASE_PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "STADO_NATIVE_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "STADO_NATIVE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate public native release delivery
        run: |
          export STADO_API_URL="$STADO_PUBLIC_RELEASE_API_URL"
          stado_bin="$STADO_SOURCE_DIR/stado-rs/target/release/stado"
          for source in "$STADO_NATIVE_RELEASE_DIR"/*; do
            name="${source##*/}"
            uri="stado://releases/stado/$STADO_NATIVE_RELEASE_VERSION/$STADO_NATIVE_RELEASE_PLATFORM/$name"
            delivered="$RUNNER_TEMP/public-native-$name"
            visible=false
            for attempt in $(seq 1 12); do
              rm -f "$delivered"
              if "$stado_bin" storage get "$uri" "$delivered" &&
                 cmp --silent "$source" "$delivered"; then
                visible=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$visible" != true ]; then
              echo "::error::Public release delivery did not serve immutable $uri"
              false
            fi
          done

      - name: Deliver verified native release
        run: |
          STADO_API_URL="$STADO_PUBLIC_RELEASE_API_URL" \
          STADO_RELEASE_PLATFORM="$STADO_NATIVE_RELEASE_PLATFORM" \
          STADO_RELEASE_DIR="$STADO_NATIVE_RELEASE_DIR" \
            bash "$STADO_SOURCE_DIR/deploy/deploy_stado_rust.sh"

      - name: Reconcile public release ingress
        run: |
          tailscale_bin=/Applications/Tailscale.app/Contents/MacOS/tailscale
          "$tailscale_bin" funnel --bg --yes 8765
          "$tailscale_bin" funnel --bg --yes --set-path /api/release/object 18776
          "$tailscale_bin" serve status --json |
            jq -e '
              .Web | to_entries[] |
              .value.Handlers["/"].Proxy == "http://127.0.0.1:8765" and
              .value.Handlers["/api/release/object"].Proxy == "http://127.0.0.1:18776"
            '

      - name: Reload TLS reverse proxy
        if: ${{ vars.STADO_ENABLE_AZURE_DEPLOY == 'true' }}
        run: |
          if [ -z "$STADO_DASHBOARD_UPSTREAM" ]; then
            STADO_DASHBOARD_UPSTREAM="$(
              "$HOME/.stado/bin/stado" config show |
                jq -er '.resolved.dashboard_bind + ":" + (.resolved.dashboard_port | tostring)'
            )"
            export STADO_DASHBOARD_UPSTREAM
          fi
          if ! command -v caddy >/dev/null; then
            echo "::error::Caddy is not installed on the control-plane runner."
            false
          fi
          caddy reload \
            --config "$STADO_SOURCE_DIR/deploy/azure/Caddyfile.example" \
            --adapter caddyfile
