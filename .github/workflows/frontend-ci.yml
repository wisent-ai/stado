name: Frontend CI

on:
  push:
    paths: ['frontend/**']
  pull_request:
    paths: ['frontend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compute.wisent.com
      - uses: actions/checkout@v4
        with:
          repository: wisent-ai/echo-web
          path: echo-web
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: compute.wisent.com/frontend/package-lock.json
      - name: Install
        working-directory: compute.wisent.com/frontend
        run: npm install
      - name: Lint
        working-directory: compute.wisent.com/frontend
        run: npm run lint
      - name: Type Check
        working-directory: compute.wisent.com/frontend
        run: npm run typecheck
      - name: Build
        working-directory: compute.wisent.com/frontend
        run: npm run build
