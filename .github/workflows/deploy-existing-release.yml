name: deploy existing Stado release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable Stado version
        required: true
        type: string

concurrency:
  group: stado-existing-release-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, stado-control-plane]
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      STADO_WRITER_API_URL: http://127.0.0.1:18776
      STADO_PUBLIC_RELEASE_API_URL: https://charless-mac-mini.tail6443b3.ts.net
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare release implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stado-release-tools"
          cat > "$RUNNER_TEMP/stado-release-tools/release_manifest.sh" <<'STADO_EMBEDDED_EOF'
          # Emit the canonical immutable archive manifest shared by Stado products.
          set -eu
          
          die() {
              printf 'FATAL: %s\n' "$*" > /dev/stderr
              false
          }
          
          RELEASE_DIR="${STADO_RELEASE_DIR:?set STADO_RELEASE_DIR}"
          ARCHIVE="${STADO_RELEASE_ARCHIVE:?set STADO_RELEASE_ARCHIVE}"
          VERSION="${STADO_RELEASE_VERSION:?set STADO_RELEASE_VERSION}"
          PLATFORM="${STADO_RELEASE_PLATFORM:?set STADO_RELEASE_PLATFORM}"
          SOURCE_COMMIT="${STADO_RELEASE_SOURCE_COMMIT:?set STADO_RELEASE_SOURCE_COMMIT}"
          
          for command_name in jq openssl; do
              command -v "$command_name" >/dev/null || die "required command is unavailable: $command_name"
          done
          [ -s "$ARCHIVE" ] || die "release archive is missing or empty: $ARCHIVE"
          case "$VERSION" in
              *[![:alnum:]._-]* | "") die "invalid immutable release version" ;;
          esac
          case "$PLATFORM" in
              *[![:alnum:]._-]* | "") die "invalid immutable release platform" ;;
          esac
          case "$SOURCE_COMMIT" in
              *[!0-9a-fA-F]* | "") die "source commit must be hexadecimal" ;;
          esac
          
          sha256="$(openssl dgst -sha256 "$ARCHIVE" | sed 's/^.*= //')"
          manifest="$RELEASE_DIR/release-manifest-$PLATFORM.json"
          jq -cS -n \
              --arg product stado \
              --arg version "$VERSION" \
              --arg platform "$PLATFORM" \
              --arg source_commit "$SOURCE_COMMIT" \
              --arg sha256 "$sha256" \
              '{
                  "platform": $platform,
                  "product": $product,
                  "sha256": $sha256,
                  "source_commit": $source_commit,
                  "version": $version
              }' > "$manifest"
          printf '%s\n' "$manifest"
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/adopt_published_release.sh" <<'STADO_EMBEDDED_EOF'
          set -euo pipefail
          
          # Make a second attempt at one release coordinate possible.
          #
          # Release objects are create-only. The archive this train publishes is produced
          # by `stado storage archive`, and tar+gzip output is not byte-reproducible
          # across runs — mtimes, member order and the gzip header all move — while the
          # executables inside it carry `env!("CARGO_MANIFEST_DIR")`, which is a fresh
          # `$RUNNER_TEMP/stado-source.XXXX` on every checkout. So a rebuilt attempt at an
          # already-published version produces DIFFERENT bytes for the same names, and the
          # writer answers exactly that:
          #
          #   Error: immutable object already differs on the writer:
          #   stado://releases/stado/0.13.47/darwin-arm64/stado-v0.13.47-darwin-arm64.tar.gz
          #
          # 0.13.47 died there. Attempt 1 published all thirteen objects of its darwin
          # coordinate; attempt 2 rebuilt the archive, refused it twelve times, failed the
          # job, and `deploy-fleet` was skipped — a release whose bytes were complete and
          # public never reached a single host, and no later attempt at that tag could
          # have ended differently.
          #
          # The way out is to stop rebuilding what is already published. If the archive is
          # there, it IS the release: this adopts it and derives the whole release
          # directory from it, so every subsequent `storage put --if-absent` either
          # matches the published object exactly or creates the one that is missing. That
          # also completes a half-published coordinate instead of leaving it stranded,
          # which is the state `stado/0.11.0/darwin-arm64` has been in since April.
          #
          # Called with STADO_API_URL pointing at the authenticated writer, the same
          # origin the publish loop uses.
          
          if [ "$#" -ne 5 ]; then
            echo "usage: adopt_published_release.sh STADO_BIN RELEASE_DIR PRODUCT VERSION PLATFORM" >&2
            exit 2
          fi
          
          stado_bin="$1"
          release_dir="$2"
          product="$3"
          version="$4"
          platform="$5"
          
          case "$product" in
            *[![:alnum:]_-]*|"") echo "invalid release product: $product" >&2; exit 2 ;;
          esac
          case "$version" in
            *[![:alnum:]._-]*|"") echo "invalid release version: $version" >&2; exit 2 ;;
          esac
          case "$platform" in
            *[![:alnum:]_-]*|"") echo "invalid release platform: $platform" >&2; exit 2 ;;
          esac
          
          test -x "$stado_bin"
          test -d "$release_dir"
          
          prefix="stado://releases/$product/$version/$platform"
          archive_name="$product-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          
          published_state() {
            "$stado_bin" storage stat "$prefix/$1" --json | jq -er '.state'
          }
          
          # `storage stat` answers present or absent with exit status zero and reserves
          # non-zero for a store that did not answer. Guessing "absent" from a store that
          # is merely unreachable would rebuild over a live coordinate, so an unusable
          # answer stops this instead.
          archive_state="$(published_state "$archive_name")"
          case "$archive_state" in
            absent)
              echo "no published $prefix/$archive_name: this attempt publishes its own build"
              exit 0
              ;;
            present) ;;
            *)
              echo "::error::the writer could not say whether $prefix/$archive_name exists" \
                "(state $archive_state); this attempt will not rebuild over a coordinate it cannot read" >&2
              exit 1
              ;;
          esac
          
          echo "adopting the published $prefix/$archive_name; this attempt publishes no rebuilt bytes"
          "$stado_bin" storage get "$prefix/$archive_name" "$release_dir/$archive_name"
          # The archive carries every executable plus SHA256SUMS, so extracting it over
          # the release directory replaces this attempt's build with the bytes the
          # coordinate already holds — which is what the publish loop, the public
          # validation and the delivery all have to agree about.
          /usr/bin/tar -xzf "$release_dir/$archive_name" -C "$release_dir"
          
          # The manifest is regenerated deterministically from the adopted archive by the
          # caller's own manifest step (product, version, platform, source_commit and the
          # archive digest, and nothing else), so a published one must still match. Taking
          # the published copy when it exists means the comparison is against the bytes a
          # consumer gets rather than against a second derivation of them.
          manifest_state="$(published_state "$manifest_name")"
          case "$manifest_state" in
            present) "$stado_bin" storage get "$prefix/$manifest_name" "$release_dir/$manifest_name" ;;
            absent)
              echo "$prefix/$manifest_name is absent; the adopted archive's manifest will be published"
              ;;
            *)
              echo "::error::the writer could not say whether $prefix/$manifest_name exists" \
                "(state $manifest_state)" >&2
              exit 1
              ;;
          esac
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" <<'STADO_EMBEDDED_EOF'
          set -euo pipefail
          
          if [ "$#" -ne 6 ]; then
            echo "usage: verify_public_stado_release.sh STADO_BIN RELEASE_DIR PRODUCT VERSION PLATFORM SCRATCH_DIR" >&2
            exit 2
          fi
          
          stado_bin="$1"
          release_dir="$2"
          product="$3"
          version="$4"
          platform="$5"
          scratch_dir="$6"
          
          case "$product" in
            *[![:alnum:]_-]*|"") echo "invalid release product: $product" >&2; exit 2 ;;
          esac
          case "$version" in
            *[![:alnum:]._-]*|"") echo "invalid release version: $version" >&2; exit 2 ;;
          esac
          case "$platform" in
            *[![:alnum:]_-]*|"") echo "invalid release platform: $platform" >&2; exit 2 ;;
          esac
          
          test -x "$stado_bin"
          test -d "$release_dir"
          test -d "$scratch_dir"
          
          prefix="stado://releases/$product/$version/$platform"
          version_claim_uri="stado://releases/$product/$version/source-revision.json"
          platform_claim_uri="$prefix/source-revision.json"
          archive_name="$product-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          test -f "$release_dir/$archive_name"
          test -f "$release_dir/$manifest_name"
          
          # One coordinate, two producers. This workflow publishes the executables,
          # SHA256SUMS, the platform archive and the platform manifest. The product's own
          # signed-release path publishes `release.json`, `release.sig`, `release.tar.gz`
          # and `qualification.json` into the SAME prefix — see
          # `cli::release_submit::publish`, which records
          # `stado://releases/<product>/<version>/<platform>/qualification.json` as the
          # run's qualification URI. 0.13.45's linux leg is exactly that state: nine
          # objects from here, four from there, and a check that expected the coordinate
          # to hold only what this runner had on disk refused a complete release.
          #
          # The platform `source-revision.json` remains a coordinate member for older
          # clients. The platformless version claim sits one level above this listing and
          # is fetched and compared below; it is the create-only arbitration point shared
          # by every publisher and platform.
          # `[A-Z_]*` and not `[A-Z]*`: a two-word constant like
          # `RELEASE_REVISION_NAME`'s successors would otherwise be silently skipped and
          # read as a member nobody declares.
          control_source="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)/stado-rs/src/release_control.rs"
          test -f "$control_source"
          control_names="$(
            sed -n 's/^pub const RELEASE_[A-Z_]*_NAME: &str = "\([^"]*\)";$/\1/p' "$control_source" |
              sort -u
          )"
          declared_control="$(printf '%s\n' "$control_names" | sed '/^$/d' | /usr/bin/wc -l | tr -d '[:space:]')"
          if [ "$declared_control" -lt 5 ]; then
            echo "$control_source declares $declared_control release-owned object name(s);" \
              "this check needs them to know which members the pipeline and the coordinate" \
              "claim write" >&2
            exit 1
          fi
          
          # Every immutable put already reads the exact bytes back through the authenticated
          # writer. Public validation therefore has a different job: prove that the public
          # route exposes that complete coordinate. The archive contains every executable
          # plus SHA256SUMS, so one exact archive read proves their bytes through the public
          # route. The listing proves that every standalone object is also visible with its
          # writer-verified size. Re-downloading each executable repeated hundreds of MiB
          # and exceeded the release runner's wall-clock budget without proving more.
          #
          # A chunked put stages its parts at `<key>.__stado_upload/<id>/<index>` under
          # this same prefix, and the composition that finishes the object deletes them.
          # An interrupted upload therefore leaves parts a later attempt cleans up:
          # 0.13.44's first darwin attempt left four when the runner lost its connection
          # mid-archive. Parts are upload state, never coordinate members, so they are
          # dropped here — while any OTHER unexpected member still fails the coordinate.
          listing="$(
            $stado_bin storage objects releases "$product/$version/$platform/" --json |
              jq -c '{objects: [.objects[] | select((.key // .uri) | contains(".__stado_upload/") | not)]}'
          )"
          
          version_claim="$scratch_dir/public-$version-source-revision.json"
          platform_claim="$scratch_dir/public-$version-$platform-source-revision.json"
          rm -f "$version_claim" "$platform_claim"
          "$stado_bin" storage get "$version_claim_uri" "$version_claim"
          "$stado_bin" storage get "$platform_claim_uri" "$platform_claim"
          source_revision="$(
            jq -er --arg product "$product" --arg version "$version" '
              select(
                keys == ["product", "schema_version", "source_revision", "version"] and
                .schema_version == 1 and
                .product == $product and
                .version == $version and
                (.source_revision | test("^[0-9a-f]{40}$"))
              ) | .source_revision
            ' "$version_claim"
          )"
          jq -e \
            --arg product "$product" \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_revision "$source_revision" '
              keys == ["platform", "product", "schema_version", "source_revision", "version"] and
              .schema_version == 1 and
              .product == $product and
              .version == $version and
              .platform == $platform and
              .source_revision == $source_revision
            ' "$platform_claim" >/dev/null
          jq -e \
            --arg product "$product" \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_revision "$source_revision" '
              .product == $product and
              .version == $version and
              .platform == $platform and
              .source_commit == $source_revision
            ' "$release_dir/$manifest_name" >/dev/null
          for source in "$release_dir"/*; do
            name="${source##*/}"
            uri="$prefix/$name"
            size="$(/usr/bin/wc -c < "$source" | tr -d '[:space:]')"
            if ! jq -e --arg uri "$uri" --argjson size "$size" \
              '([.objects[] | select(.uri == $uri and .size == $size)] | length) == 1' \
              <<<"$listing" >/dev/null; then
              echo "public release coordinate omitted $uri at its writer-verified size $size" >&2
              exit 1
            fi
          done
          
          # Every member is now accounted for by one of the two producers, so anything
          # left over is an object nobody declares — a stray write into an immutable
          # coordinate, which is what this check is for.
          declared="$(
            {
              printf '%s\n' "$control_names"
              for source in "$release_dir"/*; do printf '%s\n' "${source##*/}"; done
            } | jq -R -s 'split("\n") | map(select(length > 0))'
          )"
          undeclared="$(
            jq -r --argjson declared "$declared" '
              ([.objects[] | (.key // .uri) | sub(".*/"; "")] - $declared) | unique | join(" ")
            ' <<<"$listing"
          )"
          if [ -n "$undeclared" ]; then
            echo "public release coordinate carries member(s) neither producer declares: $undeclared" >&2
            exit 1
          fi
          
          for name in "$archive_name" "$manifest_name"; do
            source="$release_dir/$name"
            uri="$prefix/$name"
            delivered="$scratch_dir/public-$platform-$name"
            visible=false
            for attempt in $(seq 1 12); do
              rm -f "$delivered"
              if "$stado_bin" storage get "$uri" "$delivered" &&
                 cmp --silent "$source" "$delivered"; then
                visible=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$visible" != true ]; then
              echo "public release delivery did not serve immutable $uri" >&2
              exit 1
            fi
          done
          STADO_EMBEDDED_EOF
          cat > "$RUNNER_TEMP/stado-release-tools/deploy_existing_stado_release.sh" <<'STADO_EMBEDDED_EOF'
          # Deliver one already-published Stado version to every registered supported host.
          set -euo pipefail
          
          version="${1:?usage: deploy_existing_stado_release.sh VERSION}"
          stado_bin="${STADO_BIN:-$HOME/.stado/bin/stado}"
          case "$version" in
            *[![:alnum:]._-]*|"") echo "FATAL: invalid Stado version: $version" >&2; exit 2 ;;
          esac
          [ -x "$stado_bin" ] || { echo "FATAL: Stado binary is not executable: $stado_bin" >&2; exit 2; }
          command -v jq >/dev/null || { echo "FATAL: jq is required" >&2; exit 2; }
          
          registry="$($stado_bin registry pull)"
          targets="$({ printf '%s' "$registry" | jq -r '
            .targets[] |
            select(.release_platform == "darwin-arm64" or .release_platform == "linux-amd64") |
            [.name, .release_platform] | @tsv
          '; })"
          [ -n "$targets" ] || { echo "FATAL: registry declares no supported release targets" >&2; exit 1; }
          
          while IFS=$'\t' read -r target platform; do
            "$stado_bin" host declare-version "$target" --binary stado --version "$version" --json
            "$stado_bin" service converge "$target" stado --apply --json
            echo "$target: stado $version installed and in-sync"
          done <<< "$targets"
          STADO_EMBEDDED_EOF
      - name: Build the current immutable recovery client
        run: cargo build --manifest-path stado-rs/Cargo.toml --locked --release --bin stado
      - name: Reconcile public release origin
        run: |
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          ingress_ok() {
            "$stado_bin" host exec charless-mac-mini -- \
              tailscale serve status --json |
              jq -e '
                any(
                  .Web | to_entries[];
                  (.key | endswith(":443")) and
                  .value.Handlers["/api/release/object"].Proxy ==
                    "http://127.0.0.1:8765/api/release/object"
                )
              ' >/dev/null
          }
          # The check is the goal, the recovery is the repair for when it
          # fails. Running the repair first made a correct, serving ingress
          # depend on the mini's skarbiec blue-green policy record being
          # complete, and on 2026-09-04 that record carries null legacy fields
          # — the recovery refused with "skarbiec bootstrap refused: release
          # target is incomplete" and the 0.14.9 delivery died although the
          # route it reconciles was answering the whole time.
          if ! ingress_ok; then
            "$stado_bin" host recover-object-api charless-mac-mini --json \
              > "$RUNNER_TEMP/public-release-ingress.json"
          fi
          ingress_ok
      - name: Resume the exact immutable publication
        env:
          STADO_API_URL: ${{ env.STADO_WRITER_API_URL }}
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          case "$version" in
            *[![:alnum:]._-]*|"") echo "::error::invalid Stado version"; false ;;
          esac
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          platform=linux-amd64
          prefix="stado://releases/stado/$version/$platform"
          recovered="$RUNNER_TEMP/stado-$version-recovered"
          manifest="$RUNNER_TEMP/release-manifest-$platform.json"
          sums="$RUNNER_TEMP/SHA256SUMS"
          archive="$RUNNER_TEMP/stado-v$version-$platform.tar.gz"

          git fetch --force --depth=1 origin \
            "refs/tags/stado-v$version:refs/tags/stado-v$version"
          tag_commit="$(git rev-list -n 1 "stado-v$version")"
          "$stado_bin" storage get "$prefix/release-manifest-$platform.json" "$manifest"
          "$stado_bin" storage get "$prefix/SHA256SUMS" "$sums"
          jq -e \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_commit "$tag_commit" \
            '.product == "stado" and .version == $version and
             .platform == $platform and .source_commit == $source_commit' \
            "$manifest" >/dev/null

          mkdir -p "$recovered"
          archive_name="stado-v$version-$platform.tar.gz"
          archive_uri="$prefix/$archive_name"
          archive_state="$("$stado_bin" storage stat "$archive_uri" --json |
            jq -r '.state // ""')"
          case "$archive_state" in
            present)
              "$stado_bin" storage get "$archive_uri" "$archive"
              ;;
            absent)
              for name in stado stado-coverage stado-fix stado-watchdog stado-mcp wc; do
                expected="$(sed -n "s/  $name\$//p" "$sums")"
                test -n "$expected"
                "$stado_bin" storage get "$prefix/$name" "$recovered/$name"
                actual="$(openssl dgst -sha256 "$recovered/$name")"
                actual="${actual##* }"
                test "$actual" = "$expected"
              done
              cp "$sums" "$recovered/SHA256SUMS"
              "$stado_bin" storage archive "$recovered" "$archive"
              ;;
            *)
              echo "::error::canonical archive state is ${archive_state:-unknown}"
              false
              ;;
          esac

          expected_archive="$(jq -r '.sha256' "$manifest")"
          actual_archive="$(openssl dgst -sha256 "$archive")"
          actual_archive="${actual_archive##* }"
          test "$actual_archive" = "$expected_archive"
          if [ "$archive_state" = present ]; then
            /usr/bin/tar -xzf "$archive" -C "$recovered"
          fi
          cmp --silent "$sums" "$recovered/SHA256SUMS"
          while read -r expected name; do
            case "$name" in
              *[![:alnum:]_.-]*|"") echo "::error::unsafe release member: $name"; false ;;
            esac
            test -f "$recovered/$name"
            actual="$(openssl dgst -sha256 "$recovered/$name")"
            actual="${actual##* }"
            test "$actual" = "$expected"
          done < "$sums"
          cp "$manifest" "$recovered/release-manifest-$platform.json"
          cp "$archive" "$recovered/stado-v$version-$platform.tar.gz"

          # The same claim every publisher makes first. A resume republishes
          # the tag's own build, so this confirms the record the train already
          # wrote and refuses a coordinate some other build owns.
          "$stado_bin" release claim-coordinate stado "$version" "$platform" \
            --source-commit "$tag_commit"
          for source in "$recovered"/*; do
            name="${source##*/}"
            "$stado_bin" storage put "$prefix/$name" "$source" --if-absent
          done
      - name: Verify public immutable bytes
        env:
          STADO_API_URL: ${{ env.STADO_PUBLIC_RELEASE_API_URL }}
          # The publisher's acquisition grant, because this step is a CLIENT of
          # the release channel. `stado-release-api-verifier` is the grant the
          # object API server presents to verify incoming release bearers, and
          # Stado refuses it here by design: "release verifier token file must
          # be distinct from coordinator and product-object verifier grants".
          # So the 0.13.47 delivery died in this step, on a coordinate whose
          # bytes were already complete and public, with a message about vault
          # configuration rather than about the release.
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          platform=linux-amd64
          recovered="$RUNNER_TEMP/stado-$version-recovered"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          bash "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" \
            "$stado_bin" "$recovered" stado "$version" "$platform" "$RUNNER_TEMP"
      - name: Publish the exact tag native release
        env:
          STADO_API_URL: ${{ env.STADO_WRITER_API_URL }}
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          platform=darwin-arm64
          tag="stado-v$version"
          tag_commit="$(git rev-list -n 1 "$tag")"
          recovery_stado="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          prefix="stado://releases/stado/$version/$platform"
          archive_name="stado-v$version-$platform.tar.gz"
          manifest_name="release-manifest-$platform.json"
          release_dir="$(mktemp -d "$RUNNER_TEMP/stado-$version-$platform.XXXXXX")"
          native_names=(
            stado wc stado-coverage stado-fix stado-watchdog stado-mcp
            SHA256SUMS "$archive_name" "$manifest_name"
          )

          present=0
          for name in "${native_names[@]}"; do
            state="$("$recovery_stado" storage stat "$prefix/$name" --json |
              jq -r '.state // ""')"
            case "$state" in
              present) present=$((present + 1)) ;;
              absent) ;;
              *) echo "::error::$name has canonical state ${state:-unknown}"; false ;;
            esac
          done

          if [ "$present" -eq "${#native_names[@]}" ]; then
            for name in "${native_names[@]}"; do
              "$recovery_stado" storage get "$prefix/$name" "$release_dir/$name"
            done
            jq -e \
              --arg version "$version" \
              --arg platform "$platform" \
              --arg source_commit "$tag_commit" \
              '.product == "stado" and .version == $version and
               .platform == $platform and .source_commit == $source_commit and
               (.sha256 | type == "string")' \
              "$release_dir/$manifest_name" >/dev/null
            expected_archive="$(jq -r '.sha256' "$release_dir/$manifest_name")"
            actual_archive="$(openssl dgst -sha256 "$release_dir/$archive_name")"
            actual_archive="${actual_archive##* }"
            test "$actual_archive" = "$expected_archive"

            extracted="$(mktemp -d "$RUNNER_TEMP/stado-$version-native-archive.XXXXXX")"
            /usr/bin/tar -xzf "$release_dir/$archive_name" -C "$extracted"
            cmp --silent "$release_dir/SHA256SUMS" "$extracted/SHA256SUMS"
            while read -r expected name; do
              case "$name" in
                *[![:alnum:]_.-]*|"") echo "::error::unsafe release member: $name"; false ;;
              esac
              for root in "$release_dir" "$extracted"; do
                test -f "$root/$name"
                actual="$(openssl dgst -sha256 "$root/$name")"
                actual="${actual##* }"
                test "$actual" = "$expected"
              done
            done < "$release_dir/SHA256SUMS"
            echo "STADO_NATIVE_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
            exit 0
          fi

          tag_source="$(mktemp -d "$RUNNER_TEMP/stado-$version-tag-source.XXXXXX")"
          rmdir "$tag_source"
          cleanup_tag_source() {
            git worktree remove --force "$tag_source" ||
              { rm -rf "$tag_source"; git worktree prune; }
          }
          trap cleanup_tag_source EXIT
          git worktree add --detach "$tag_source" "$tag_commit"
          cargo build --manifest-path "$tag_source/stado-rs/Cargo.toml" \
            --locked --release --bins

          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "$tag_source/stado-rs/target/release/$name" "$release_dir/$name"
          done
          cp "$release_dir/stado" "$release_dir/wc"
          (
            cd "$release_dir"
            for name in stado wc stado-coverage stado-fix stado-watchdog stado-mcp; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )

          archive="$RUNNER_TEMP/stado-v$version-$platform.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.tar.gz"
          tag_stado="$tag_source/stado-rs/target/release/stado"
          "$tag_stado" storage archive "$release_dir" "$archive"
          machine_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$tag_source/stado-rs/src/machine.rs"
          )"
          schema_unit="$(printf x | /usr/bin/wc -c | tr -d '[:space:]')"
          config_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$tag_source/stado-rs/src/config_file.rs"
          )"
          storage_schema="$(
            sed -n '/pub const STORAGE_LAYOUT_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$tag_source/stado-rs/src/queue/mod.rs"
          )"
          test "$config_schema" != "true as u16" || config_schema="$schema_unit"
          test "$storage_schema" != "true as u16" || storage_schema="$schema_unit"
          test -n "$machine_schema"
          test -n "$config_schema"
          test -n "$storage_schema"
          STADO_RELEASE_DIR="$release_dir" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$version" \
          STADO_RELEASE_CHANNEL=stable \
          STADO_RELEASE_PLATFORM="$platform" \
          STADO_RELEASE_SOURCE_COMMIT="$tag_commit" \
          STADO_RELEASE_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          STADO_RELEASE_BUILT_AT="$(git -C "$tag_source" show -s --format=%cI "$tag_commit")" \
          STADO_MACHINE_SCHEMA_VERSION="$machine_schema" \
          STADO_CONFIG_SCHEMA_VERSION="$config_schema" \
          STADO_STORAGE_SCHEMA_VERSION="$storage_schema" \
          STADO_LICENSE_FILE="$tag_source/LICENSE" \
          STADO_RELEASE_STABLE_INTEGRATIONS="local-compute,local-filesystem-storage,skarbiec,stado-object-storage" \
          STADO_RELEASE_PREVIEW_INTEGRATIONS="gcs-storage,s3-storage,azure-blob-storage,gcp-compute,aws-ec2,azure-vm,box,vast" \
            bash "$RUNNER_TEMP/stado-release-tools/release_manifest.sh"
          mv "$archive" "$release_dir/$archive_name"

          # The claim before the first put, as in the train: a rebuild of the
          # tag's own commit confirms the existing record, and any other build
          # is refused here rather than at delivery.
          "$recovery_stado" release claim-coordinate stado "$version" "$platform" \
            --source-commit "$tag_commit"
          for source in "$release_dir"/*; do
            name="${source##*/}"
            state="$("$recovery_stado" storage stat "$prefix/$name" --json |
              jq -r '.state // ""')"
            case "$state" in
              present)
                existing="$(mktemp "$RUNNER_TEMP/stado-existing-$name.XXXXXX")"
                "$recovery_stado" storage get "$prefix/$name" "$existing"
                cmp --silent "$source" "$existing"
                ;;
              absent)
                "$recovery_stado" storage put "$prefix/$name" "$source" --if-absent
                ;;
              *)
                echo "::error::$name has canonical state ${state:-unknown}"
                false
                ;;
            esac
          done
          echo "STADO_NATIVE_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
      - name: Verify public native immutable bytes
        env:
          STADO_API_URL: ${{ env.STADO_PUBLIC_RELEASE_API_URL }}
          # A client of the release channel, so the publisher's acquisition
          # grant — see the linux leg above for why the server's verifier grant
          # is refused here.
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          platform=darwin-arm64
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          bash "$RUNNER_TEMP/stado-release-tools/verify_public_stado_release.sh" \
            "$stado_bin" "$STADO_NATIVE_RELEASE_DIR" stado \
            "$version" "$platform" "$RUNNER_TEMP"
      # No raw bearer is acquired for the delivery. This step used to run
      # `stado secrets get stado-release-publisher --field token` and export it
      # as `STADO_API_TOKEN`, and Skarbiec refuses that read on purpose:
      #
      #   Error: Skarbiec returned HTTP 403:
      #   {"error":"consumer not authorized to read item field"}
      #
      # An acquisition grant lets the client obtain its own bearer inside the
      # process; it is not a licence to hand the secret to a shell. That
      # refusal ended the 0.13.47 delivery after every publish and both public
      # verifications had passed. The delivery authenticates the way every
      # other step in this file does — the publisher's acquisition grant — and
      # needs no token in the environment at all.
      - name: Deploy the existing immutable release
        env:
          STADO_API_URL: ${{ env.STADO_PUBLIC_RELEASE_API_URL }}
          STADO_BIN: ${{ github.workspace }}/stado-rs/target/release/stado
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: bash "$RUNNER_TEMP/stado-release-tools/deploy_existing_stado_release.sh" '${{ inputs.version }}'
