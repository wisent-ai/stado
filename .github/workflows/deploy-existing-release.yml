name: deploy existing Stado release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable Stado version
        required: true
        type: string

concurrency:
  group: stado-existing-release-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, stado-control-plane]
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
      STADO_WRITER_API_URL: http://127.0.0.1:18776
      STADO_PUBLIC_RELEASE_API_URL: https://charless-mac-mini.tail6443b3.ts.net
      WC_SKARBIEC_URL: ${{ vars.STADO_SKARBIEC_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the current immutable recovery client
        run: cargo build --manifest-path stado-rs/Cargo.toml --locked --release --bin stado
      - name: Reconcile public release origin
        run: |
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          "$stado_bin" host recover-object-api charless-mac-mini --json \
            > "$RUNNER_TEMP/public-release-ingress.json"
          "$stado_bin" host exec charless-mac-mini -- \
            tailscale serve status --json |
            jq -e '
              any(
                .Web | to_entries[];
                (.key | endswith(":443")) and
                .value.Handlers["/api/release/object"].Proxy ==
                  "http://127.0.0.1:8765/api/release/object"
              )
            '
      - name: Resume the exact immutable publication
        env:
          STADO_API_URL: ${{ env.STADO_WRITER_API_URL }}
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          case "$version" in
            *[![:alnum:]._-]*|"") echo "::error::invalid Stado version"; false ;;
          esac
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          platform=linux-amd64
          prefix="stado://releases/stado/$version/$platform"
          recovered="$RUNNER_TEMP/stado-$version-recovered"
          manifest="$RUNNER_TEMP/release-manifest-$platform.json"
          sums="$RUNNER_TEMP/SHA256SUMS"
          archive="$RUNNER_TEMP/stado-v$version-$platform.tar.gz"

          git fetch --force --depth=1 origin \
            "refs/tags/stado-v$version:refs/tags/stado-v$version"
          tag_commit="$(git rev-list -n 1 "stado-v$version")"
          "$stado_bin" storage get "$prefix/release-manifest-$platform.json" "$manifest"
          "$stado_bin" storage get "$prefix/SHA256SUMS" "$sums"
          jq -e \
            --arg version "$version" \
            --arg platform "$platform" \
            --arg source_commit "$tag_commit" \
            '.product == "stado" and .version == $version and
             .platform == $platform and .source_commit == $source_commit' \
            "$manifest" >/dev/null

          mkdir -p "$recovered"
          archive_name="stado-v$version-$platform.tar.gz"
          archive_uri="$prefix/$archive_name"
          archive_state="$("$stado_bin" storage stat "$archive_uri" --json |
            jq -r '.state // ""')"
          case "$archive_state" in
            present)
              "$stado_bin" storage get "$archive_uri" "$archive"
              ;;
            absent)
              for name in stado stado-coverage stado-fix stado-watchdog stado-mcp wc; do
                expected="$(sed -n "s/  $name\$//p" "$sums")"
                test -n "$expected"
                "$stado_bin" storage get "$prefix/$name" "$recovered/$name"
                actual="$(openssl dgst -sha256 "$recovered/$name")"
                actual="${actual##* }"
                test "$actual" = "$expected"
              done
              cp "$sums" "$recovered/SHA256SUMS"
              "$stado_bin" storage archive "$recovered" "$archive"
              ;;
            *)
              echo "::error::canonical archive state is ${archive_state:-unknown}"
              false
              ;;
          esac

          expected_archive="$(jq -r '.sha256' "$manifest")"
          actual_archive="$(openssl dgst -sha256 "$archive")"
          actual_archive="${actual_archive##* }"
          test "$actual_archive" = "$expected_archive"
          if [ "$archive_state" = present ]; then
            /usr/bin/tar -xzf "$archive" -C "$recovered"
          fi
          cmp --silent "$sums" "$recovered/SHA256SUMS"
          while read -r expected name; do
            case "$name" in
              *[![:alnum:]_.-]*|"") echo "::error::unsafe release member: $name"; false ;;
            esac
            test -f "$recovered/$name"
            actual="$(openssl dgst -sha256 "$recovered/$name")"
            actual="${actual##* }"
            test "$actual" = "$expected"
          done < "$sums"
          cp "$manifest" "$recovered/release-manifest-$platform.json"
          cp "$archive" "$recovered/stado-v$version-$platform.tar.gz"

          for source in "$recovered"/*; do
            name="${source##*/}"
            "$stado_bin" storage put "$prefix/$name" "$source" --if-absent
          done
      - name: Verify public immutable bytes
        env:
          STADO_API_URL: ${{ env.STADO_PUBLIC_RELEASE_API_URL }}
          WC_SKARBIEC_CONSUMER: stado-release-api-verifier
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-api-verifier-skarbiec-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          platform=linux-amd64
          prefix="stado://releases/stado/$version/$platform"
          recovered="$RUNNER_TEMP/stado-$version-recovered"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          for source in "$recovered"/*; do
            name="${source##*/}"
            delivered="$RUNNER_TEMP/public-$name"
            "$stado_bin" storage get "$prefix/$name" "$delivered"
            cmp --silent "$source" "$delivered"
          done
      - name: Publish the exact tag native release
        env:
          STADO_API_URL: ${{ env.STADO_WRITER_API_URL }}
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          platform=darwin-arm64
          tag="stado-v$version"
          tag_commit="$(git rev-list -n 1 "$tag")"
          tag_source="$(mktemp -d "$RUNNER_TEMP/stado-$version-tag-source.XXXXXX")"
          rmdir "$tag_source"
          git worktree add --detach "$tag_source" "$tag_commit"
          trap 'git worktree remove --force "$tag_source"' EXIT
          cargo build --manifest-path "$tag_source/stado-rs/Cargo.toml" \
            --locked --release --bins

          release_dir="$RUNNER_TEMP/stado-$version-$platform"
          mkdir -p "$release_dir"
          for name in stado stado-coverage stado-fix stado-watchdog stado-mcp; do
            cp "$tag_source/stado-rs/target/release/$name" "$release_dir/$name"
          done
          cp "$release_dir/stado" "$release_dir/wc"
          (
            cd "$release_dir"
            for name in stado wc stado-coverage stado-fix stado-watchdog stado-mcp; do
              digest="$(openssl dgst -sha256 "$name")"
              printf '%s  %s\n' "${digest##* }" "$name"
            done > SHA256SUMS
          )

          archive="$RUNNER_TEMP/stado-v$version-$platform.tar.gz"
          tag_stado="$tag_source/stado-rs/target/release/stado"
          "$tag_stado" storage archive "$release_dir" "$archive"
          machine_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$tag_source/stado-rs/src/machine.rs"
          )"
          schema_unit="$(printf x | /usr/bin/wc -c | tr -d '[:space:]')"
          config_schema="$(
            sed -n '/pub const SCHEMA_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$tag_source/stado-rs/src/config_file.rs"
          )"
          storage_schema="$(
            sed -n '/pub const STORAGE_LAYOUT_VERSION:/{s/.*= //;s/;//;p;q;}' \
              "$tag_source/stado-rs/src/queue/mod.rs"
          )"
          test "$config_schema" != "true as u16" || config_schema="$schema_unit"
          test "$storage_schema" != "true as u16" || storage_schema="$schema_unit"
          test -n "$machine_schema"
          test -n "$config_schema"
          test -n "$storage_schema"
          STADO_RELEASE_DIR="$release_dir" \
          STADO_RELEASE_ARCHIVE="$archive" \
          STADO_RELEASE_VERSION="$version" \
          STADO_RELEASE_CHANNEL=stable \
          STADO_RELEASE_PLATFORM="$platform" \
          STADO_RELEASE_SOURCE_COMMIT="$tag_commit" \
          STADO_RELEASE_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          STADO_RELEASE_BUILT_AT="$(git -C "$tag_source" show -s --format=%cI "$tag_commit")" \
          STADO_MACHINE_SCHEMA_VERSION="$machine_schema" \
          STADO_CONFIG_SCHEMA_VERSION="$config_schema" \
          STADO_STORAGE_SCHEMA_VERSION="$storage_schema" \
          STADO_LICENSE_FILE="$tag_source/LICENSE" \
          STADO_RELEASE_STABLE_INTEGRATIONS="local-compute,local-filesystem-storage,skarbiec,stado-object-storage" \
          STADO_RELEASE_PREVIEW_INTEGRATIONS="gcs-storage,s3-storage,azure-blob-storage,gcp-compute,aws-ec2,azure-vm,box,vast" \
            "$tag_source/scripts/release_manifest.sh"
          mv "$archive" "$release_dir/stado-v$version-$platform.tar.gz"

          recovery_stado="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          prefix="stado://releases/stado/$version/$platform"
          for source in "$release_dir"/*; do
            name="${source##*/}"
            "$recovery_stado" storage put "$prefix/$name" "$source" --if-absent
          done
          echo "STADO_NATIVE_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
      - name: Verify public native immutable bytes
        env:
          STADO_API_URL: ${{ env.STADO_PUBLIC_RELEASE_API_URL }}
          WC_SKARBIEC_CONSUMER: stado-release-api-verifier
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-api-verifier-skarbiec-token
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          platform=darwin-arm64
          prefix="stado://releases/stado/$version/$platform"
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          for source in "$STADO_NATIVE_RELEASE_DIR"/*; do
            name="${source##*/}"
            delivered="$RUNNER_TEMP/public-native-$name"
            "$stado_bin" storage get "$prefix/$name" "$delivered"
            cmp --silent "$source" "$delivered"
          done
      - name: Acquire release channel bearer
        env:
          WC_SKARBIEC_CONSUMER: stado-release-publisher
          WC_SKARBIEC_TOKEN_FILE: ~/.stado/stado-release-publisher-acquisition-token
        run: |
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          token="$("$stado_bin" secrets get stado-release-publisher --field token)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "STADO_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy the existing immutable release
        env:
          STADO_API_URL: ${{ env.STADO_PUBLIC_RELEASE_API_URL }}
          STADO_BIN: ${{ github.workspace }}/stado-rs/target/release/stado
        run: scripts/deploy_existing_stado_release.sh '${{ inputs.version }}'
