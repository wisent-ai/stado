name: Deploy image-video-router release

on:
  workflow_call:
    inputs:
      version:
        description: Exact Cargo SemVer already published through Stado release control
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 from the signed immutable Stado release manifest
        required: true
        type: string
      source_commit:
        description: Full source commit recorded in the signed release manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote-and-reconcile:
    runs-on: [self-hosted, stado-control-plane]
    concurrency:
      group: image-video-router-release-delivery
      cancel-in-progress: false
    env:
      STADO_API_URL: https://stado.wisent.com
      STADO_CONFIG_PATH: ${{ vars.STADO_CONFIG_PATH }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SHA256: ${{ inputs.artifact_sha256 }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TARGET: ubuntu-server-rtx-pro-6000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wisent-ai/stado
          ref: 159f43308449ab65df2cdd371b5579d5ddd3f0c9
      - name: Build the pinned Stado control client
        working-directory: stado-rs
        run: cargo build --locked --release --bin stado
      - name: Promote the exact desired digest
        run: |
          set -euo pipefail
          if [ -n "${STADO_CONFIG_PATH:-}" ]; then
            export STADO_CONFIG="$STADO_CONFIG_PATH"
          fi
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          "$stado_bin" release promote image-video-router "$RELEASE_VERSION" \
            --channel stable --json
          "$stado_bin" release status image-video-router --json > "$RUNNER_TEMP/desired.json"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg digest "$RELEASE_SHA256" \
            --arg source "$SOURCE_COMMIT" \
            --arg target "$RELEASE_TARGET" \
            '.[] | select(.target == $target) |
             .desired.version == $version and
             .desired.artifacts["linux-amd64"].artifact_sha256 == $digest and
             .desired.artifacts["linux-amd64"].source_revision == $source' \
            "$RUNNER_TEMP/desired.json" >/dev/null
      - name: Reconcile only the declared registry target through Stado
        run: |
          set -euo pipefail
          if [ -n "${STADO_CONFIG_PATH:-}" ]; then
            export STADO_CONFIG="$STADO_CONFIG_PATH"
          fi
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          "$stado_bin" host install-helper \
            "$RELEASE_TARGET" \
            "$GITHUB_WORKSPACE/scripts/reconcile-image-video-router-release.sh" \
            image-video-router-release-reconcile \
            --json
          "$stado_bin" host run-helper \
            "$RELEASE_TARGET" \
            image-video-router-release-reconcile \
            --json
          "$stado_bin" release status image-video-router --json > "$RUNNER_TEMP/receipt.json"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg digest "$RELEASE_SHA256" \
            --arg target "$RELEASE_TARGET" \
            '.[] | select(.target == $target) |
             .desired.version == $version and
             .desired.artifacts["linux-amd64"].artifact_sha256 == $digest and
             .observed.active_version == $version and
             .observed.active_sha256 == $digest' \
            "$RUNNER_TEMP/receipt.json" >/dev/null
          "$stado_bin" storage put \
            "stado://releases/image-video-router/$RELEASE_VERSION/linux-amd64/deploy-receipt.json" \
            "$RUNNER_TEMP/receipt.json" \
            --if-absent \
            --content-type application/json
