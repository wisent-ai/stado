name: registry-bootstrap

# Auto-provisions agents on every kind=local registry entry whose `ssh` field
# is set, triggered when stado-rs/data/registry.json changes on main.
# After the operator has dropped the deploy public key into the workstation's
# ~/.ssh/authorized_keys ONCE, every subsequent registry edit lands the agent
# (or refreshes the unit) on the named host without anyone touching the box.

on:
  push:
    branches: [main]
    paths:
      - "stado-rs/data/registry.json"
      - "stado-rs/src/deploy/bootstrap.rs"
      - "stado-rs/src/deploy/local_install.rs"
      - "deploy/local/stado.config.json"
      - ".github/workflows/registry-bootstrap.yml"
  workflow_dispatch:

concurrency:
  group: wisent-compute-registry-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, stado-control-plane]
    permissions:
      contents: read
    env:
      STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Require configured Rust Stado
        run: |
          if ! command -v stado >/dev/null; then
            echo "::error::Rust stado is not installed. Run the Azure deploy workflow before registry bootstrap."
            false
          fi
          stado config validate
          stado doctor --fix-hints

      - name: Load deploy SSH key
        # WISENT_BOOTSTRAP_SSH_KEY is a repo or org secret containing the
        # private key whose public counterpart sits in the workstation's
        # authorized_keys. Without this secret set, the step is skipped
        # cleanly (no failure) so a registry change to a target with
        # ssh=null still no-ops.
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          HAS_KEY: ${{ secrets.WISENT_BOOTSTRAP_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WISENT_BOOTSTRAP_SSH_KEY }}" > ~/.ssh/wisent_bootstrap
          chmod 600 ~/.ssh/wisent_bootstrap
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/wisent_bootstrap
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: List local targets to provision
        id: targets
        run: |
          registry="${RUNNER_TEMP}/registry.json"
          if ! stado registry pull > "$registry"; then
            echo "::error::Canonical registry is unreadable from configured Azure primary or S3 read fallback."
            false
          fi
          names="$(jq -r '[.targets[] | select(.kind == "local" and (.ssh // "") != "") | .name] | join(",")' "$registry")"
          count="$(jq '[.targets[] | select(.kind == "local" and (.ssh // "") != "")] | length' "$registry")"
          echo "::group::Targets to provision (${count})"
          jq -r '.targets[] | select(.kind == "local" and (.ssh // "") != "") | "  \(.name)  ssh=\(.ssh)  slots=\(.slots // "default")"' "$registry"
          echo "::endgroup::"
          echo "names=${names}" >> "${GITHUB_OUTPUT}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Run stado bootstrap for each named target
        if: ${{ steps.targets.outputs.count != '0' }}
        run: |
          IFS=',' read -ra NAMES <<< "${{ steps.targets.outputs.names }}"
          for name in "${NAMES[@]}"; do
              echo "::group::bootstrap $name"
              stado bootstrap --target "$name" || echo "[err] $name failed"
              echo "::endgroup::"
          done

      - name: Summary
        run: |
          echo "Registry-driven bootstrap complete."
          echo "Provisioned ${{ steps.targets.outputs.count }} target(s)."
          echo "Targets without ssh field set are listed in the registry as"
          echo "unprovisioned and skipped here without error."
