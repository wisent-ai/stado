name: Promote managed release

on:
  workflow_call:
    inputs:
      binary:
        description: Registry-managed binary name
        required: true
        type: string
      version:
        description: Exact immutable semantic version
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote-and-reconcile:
    runs-on: [self-hosted, stado-control-plane]
    env:
      STADO_API_URL: https://stado.wisent.com
    steps:
      - name: Promote desired state and reconcile through installed Stado
        env:
          MANAGED_BINARY: ${{ inputs.binary }}
          MANAGED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$MANAGED_BINARY" in
            stado|skarbiec) ;;
            *) echo "unsupported managed binary: $MANAGED_BINARY" >&2; false ;;
          esac
          if [[ ! "$MANAGED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version must be an exact immutable semantic version" >&2
            false
          fi
          "$HOME/.stado/bin/stado" host promote-version \
            --binary "$MANAGED_BINARY" --version "$MANAGED_VERSION" --json
          "$HOME/.stado/bin/stado" host reconcile --apply --json
