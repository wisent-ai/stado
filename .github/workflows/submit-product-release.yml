name: Submit product release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: wisent-ai repository name, public or private
        required: true
        type: string
      revision:
        description: Exact 40-character source commit
        required: true
        type: string
      version:
        description: Version declared by the source manifest
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview

jobs:
  submit:
    runs-on: [self-hosted, stado-control-plane]
    concurrency:
      group: product-release-${{ inputs.repository }}-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable release identity
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$REPOSITORY" in ''|*[!A-Za-z0-9._-]*) exit 2;; esac
          case "$REVISION" in *[!0-9a-f]*|'') exit 2;; esac
          test "${#REVISION}" = 40
          case "$VERSION" in ''|*[!0-9A-Za-z.+-]*) exit 2;; esac
      # Most Wisent products are private repositories, and the workflow's own
      # GITHUB_TOKEN is scoped to this repository alone: with it, checking out
      # a sibling answers `repository
      # 'https://github.com/wisent-ai/preferences-landing/' not found`, which
      # reads as a typo and is a permission. PRODUCT_SOURCE_TOKEN carries the
      # organization-read credential the fleet already holds as the Skarbiec
      # item GITHUB_TOKEN, the same one `deploy::host_precheck_runner` reads
      # for wisent-ai; set it with
      # `skarbiec get GITHUB_TOKEN --field value | gh secret set PRODUCT_SOURCE_TOKEN`.
      #
      # `persist-credentials: false` stays: the token reads the revision and is
      # not left in the checkout for the release steps that follow, which
      # authenticate as the product's own publisher and nothing else.
      - uses: actions/checkout@v4
        with:
          repository: wisent-ai/${{ inputs.repository }}
          ref: ${{ inputs.revision }}
          path: product-source
          token: ${{ secrets.PRODUCT_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Stado release client
        working-directory: stado-rs
        run: cargo build --locked --release --bin stado
      - name: Ensure the declared object service
        shell: bash
        run: |
          set -euo pipefail
          stado_bin="$GITHUB_WORKSPACE/stado-rs/target/release/stado"
          # The object service is the host Stado process, placed on the
          # always-on mac and reached from this runner through the resolver.
          # Which registry row runs it comes out of the catalog: the unit the
          # `stado` product declares, or on a host that has not taken over yet
          # a unit whose role was its API listener (a `--api` role unit). That
          # row names its own host, and ensuring the product there starts the
          # process under its own unit, which retires the old one before it
          # binds when both serve the same store.
          catalog="$RUNNER_TEMP/service-catalog.json"
          "$stado_bin" product catalog --output "$catalog"
          host="$(
            "$stado_bin" service list --json |
              jq -er --slurpfile catalog "$catalog" '
                ($catalog[0].services[] | select(.name == "stado")) as $stado
                | ([$stado.unit] + [($stado.role_units // [])[] | select(.flag == "--api") | .unit]) as $units
                | [ .[] | select(.label as $label | $units | index($label)) | .host ]
                | unique
                | if length == 1 then .[0] else
                    error("expected the host Stado process on exactly one host, got \(length)")
                  end
              '
          )"
          test -n "$host"
          "$stado_bin" service ensure stado \
            --host "$host" \
            --as-daemon \
            --reason "product release submission requires the canonical object store"
          # `stado://sources/<product>/...` routes by product: the first
          # segment selects the `release_api.publishers` entry whose credential
          # reads it. `stado://sources/__release_preflight__` names a product
          # nobody publishes, so this probe answered
          # "release_api.publishers declares no publisher for
          # __release_preflight__" and the step failed after the object service
          # it had just ensured was healthy. The sentinel belongs UNDER a
          # declared product, and `stado` is the one every deployment of this
          # workflow has a publisher for.
          #
          # `absent` is the expected answer and a passing one: the question is
          # whether the object service states anything at all, not whether this
          # key exists.
          state="$("$stado_bin" storage stat \
            stado://sources/stado/__release_preflight__ --json | jq -r '.state // ""')"
          case "$state" in
            present|absent) ;;
            *)
              echo "::error::$unit on $host returned no storage state after ensure: ${state:-none}"
              false ;;
          esac
      - name: Submit exact product revision
        shell: bash
        env:
          STADO_CONFIG: ${{ vars.STADO_CONFIG_PATH }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # The revision is this step's own assertion because it is a fact about
          # the checkout, which the client never sees.
          test "$(git -C product-source rev-parse HEAD)" = "$EXPECTED_REVISION"
          # The version is NOT. `release submit` reads it through the product's
          # own `.wisent-release.json` `version_source` and refuses
          # "--version disagrees with declared version source"
          # (`cli::release_submit`), so asserting it again here would be a
          # second authority -- and the one that used to live here read
          # `product-source/Cargo.toml`, which no Node product has. Every
          # `weles-worker` submission through this workflow died on that `sed`
          # while the manifest it should have read declared
          # `{"kind":"json","path":"package.json","pointer":"/version"}`.
          stado-rs/target/release/stado release submit \
            --source "$GITHUB_WORKSPACE/product-source" \
            --version "$EXPECTED_VERSION" \
            --channel "$CHANNEL"
