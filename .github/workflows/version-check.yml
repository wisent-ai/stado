name: Version check

# Refuse a change whose declared version disagrees with what the change did to the
# public contract of `stado` -- the command list the binary advertises.
#
# The rule that turns a surface change into a version has one home for the whole
# fleet and is never copied here: https://github.com/lbartoszcze/AutoVersion. Nor is
# the gate copied: this repository already owns every piece of it, and this workflow
# only arranges for them to run on a change instead of on a release.
#
#   scripts/surface.py              reads the advertised command list out of a binary
#   scripts/baseline.py             derives the baseline from verified channel bytes
#   scripts/version_check.sh        compares the candidate with that generated baseline
#   scripts/version_check_proof.sh  proves the gate refuses dishonest inputs
#
# deploy.yml consumes this workflow's exact-SHA verdict before it allocates the
# publisher runner. Keeping qualification here means a tag can enqueue while its
# source is still being judged without either publishing unqualified bytes or
# starving the judgement behind the single control-plane runner.
#
# The candidate binary reads its baseline through the public, bearer-free
# `/api/release/object` route. That route is the installer contract and needs no
# control-plane credential or host-local store, so qualification belongs on a
# GitHub-hosted runner. A configured public origin remains mandatory: without it,
# `stado storage stat` could answer from a runner-local empty store and manufacture
# a false absence.
#
# This workflow now carries a SECOND verdict, in the `release-quality-gate` job
# below: the quality steps `.wisent-release.json` declares for the release
# worker, run on the pull request instead of on the release. It lives here, in
# this file, rather than in a new workflow, for one concrete reason -- deploy.yml
# gates the release train on this workflow's RUN conclusion, not on one job, so a
# tree that cannot format or cannot compile its own tests now stops the train at
# the tag as well as at the pull request. A new workflow file would have been
# invisible to that gate.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An immutable tag waits for this exact SHA's verdict. Group by that source
  # revision so a newer main push cannot cancel the verdict beneath a release
  # that is already waiting for it. Duplicate events for one SHA may still
  # replace each other.
  group: wisent-compute-version-check-${{ github.sha }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      # Qualification uses the temporary resolver bootstrap origin so the
      # candidate that repairs the mini's declared Funnel can itself qualify.
      # Deployment proves the mini origin before accepting any release bytes.
      STADO_API_URL: https://lukaszs-macbook-pro-4007-2.tail6443b3.ts.net
    steps:
      # v5 targets Node 24 directly rather than relying on GitHub's forced
      # replacement for the deprecated Node 20 runtime in v4.
      - uses: actions/checkout@v5

      - name: Keep Supabase schema in its canonical repository
        run: |
          if [ -e supabase ]; then
            echo "::error::Stado must not carry a supabase/ tree; tables, RLS, and migrations are owned by wisent-ai/wisent-supabase-oko"
            exit 1
          fi

      - name: Every source file must be reachable from a crate root
        # Before anything is built, because this failure mode does not look like a
        # build failure. A `.rs` file that no `mod` declaration names is not a
        # compile error -- it is not compiled at all, and `cargo check`, `cargo
        # clippy` and a file listing all look untouched.
        #
        # On 2026-08-31 at 15:48Z one commit replaced src/cli/mod.rs with a
        # six-day-old copy, deleting nine `pub mod` declarations while all nine
        # files stayed on disk. main stopped compiling, but 27 errors away in
        # unrelated callers, and no diagnostic named a missing declaration.
        #
        # It is not a version question and needs no binary, tags or channel, so
        # it runs first and cheaply. The .known file is a ratchet: the three files
        # already unreachable are listed with reasons, anything new fails, and a
        # listed path that no longer exists fails too.
        run: scripts/unreachable_modules.py --known scripts/unreachable_modules.known
        working-directory: stado-rs

      - name: Make tags and history visible to the version check
        # actions/checkout fetches one commit and no tags, and scripts/baseline.py
        # refuses outright on such a clone -- assert_refs_visible() reads
        # `git rev-parse --is-shallow-repository` and cross-checks `git tag --list`
        # against `git ls-remote --tags origin`, precisely so a tier cannot be ranked
        # blind. scripts/version_check.sh calls that generator to ask whether a better
        # artifact than the committed baseline has appeared, so without this step the
        # gate does not go quietly green: it reports that staleness is unproven. The
        # tag trees matter separately, because the git-archive tier rebuilds one.
        # --unshallow refuses on an already complete repository, hence the fallback.
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      - name: Install the shared rule and establish that it is the one answering
        run: |
          set -euo pipefail
          # Keep the shared rule isolated from the runner image and pin the exact
          # coordinate whose verdict this workflow records.
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH takes effect for LATER steps only, so without this export the
          # probes below could not see the venv this step just built.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"

          # Establish WHICH autoversion is about to answer before asking it anything.
          # A liveness probe like `autoversion --help` is satisfied by any executable
          # that exits zero, so a stranger earlier on PATH would pass it and this step
          # would go green while vouching for a rule nobody asked for. Naming the
          # resolved path is also what makes the export above verifiable: delete that
          # line and this guard refuses instead of quietly passing.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the" \
                "venv this step just built. Whatever would answer below is not the" \
                "pinned rule, so no verdict it gives means anything."
              false ;;
          esac
          echo "autoversion resolves to $resolved"


      - name: Build the binary whose help text is the contract
        # The contract is what `stado help` advertises, not what src/cli/mod.rs
        # declares: three top-level variants carry `hide = true`, so they dispatch
        # without being offered, and reading the source would count them and inflate
        # the surface. That means a binary has to exist. deploy.yml reads the
        # linux/amd64 release image because it is publishing those exact bytes; a
        # check is not publishing anything, and no top-level command is behind a
        # `cfg`, so the cheaper native build advertises the same list. --locked,
        # because a check that silently resolved a different dependency graph would be
        # measuring a tree nobody is going to ship.
        run: cargo build --release --locked --bin stado
        working-directory: stado-rs

      - name: Read the public surface
        # No import, no source scan: scripts/surface.py asks the artifact itself and
        # refuses an empty answer rather than reporting a shrunken surface, because a
        # shrink reads as a breaking removal that never happened.
        run: |
          set -euo pipefail
          python3 scripts/surface.py --binary stado-rs/target/release/stado \
            > "$RUNNER_TEMP/candidate-surface.json"
          echo "advertised commands: $(jq -r '.surface | length' \
            "$RUNNER_TEMP/candidate-surface.json")"

      - name: Prove the gate can refuse, and let it judge this revision
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"

          # The venv reached this step through GITHUB_PATH, which is a different
          # mechanism from the export in the install step. Assert it again here rather
          # than assume it: this is the step whose verdict is consumed, and it is the
          # only one where being wrong about which rule answered is fatal.
          rule="$(command -v autoversion || true)"
          case "$rule" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${rule:-nothing}', outside the venv" \
                "the install step built, so the verdict below would come from a stranger."
              false ;;
          esac

          # scripts/version_check.sh asserts the baseline against the release channel
          # in both directions, and reads absence only from the channel's own
          # testimony. That testimony is only as current as the binary asked for it:
          # this used to ask the installed `~/.stado/bin/stado`, so the gate measured
          # this revision's surface with one binary and questioned the channel with
          # another, older one. A revision that changes how the channel is read could
          # then never be seen to work -- which is exactly what happened.
          #
          # The binary under judgement is the one that answers. It is also the one that
          # would be published, so if it cannot read the channel, that is a defect this
          # gate should surface rather than paper over with a predecessor.
          stado_bin="stado-rs/target/release/stado"
          test -x "$stado_bin"
          if [ -z "${STADO_API_URL:-}" ]; then
            echo "::error::STADO_API_URL is empty, so the channel assertions below would" \
              "be answered by this runner's local store instead of the release channel."
            false
          fi

          # Derive the comparison document from an immutable native artifact
          # served by this channel. No committed file can claim publication.
          baseline="$RUNNER_TEMP/released-surface.json"
          python3 scripts/baseline.py --best --stado "$stado_bin" --output "$baseline"

          # The verdict on this revision. Its status is captured rather than allowed to
          # end the step, so the refusal proof below still runs and reports: a red build
          # that says only "the version is wrong" hides whether the gate saying so is
          # one that can also say no.
          judged=pass
          if ! BASELINE="$baseline" AUTOVERSION="$rule" STADO_BIN="$stado_bin" \
               scripts/version_check.sh "$RUNNER_TEMP/candidate-surface.json"; then
            judged=refuse
          fi

          # And the proof that it can refuse, in the same step that consumed that
          # verdict -- because a rule answering a constant `internal` survives
          # everything above, and when declared equals released `internal` IS the
          # passing branch. This is not written again here: scripts/version_check_proof.sh
          # already drives scripts/version_check.sh through five cases against the
          # committed baseline and a built binary -- surface untouched must pass, a
          # removed command and an added command must refuse, and a baseline whose
          # source is prose or names an object the channel does not serve must refuse.
          # It writes nothing into the repository.
          proved=yes
          if ! BASELINE="$baseline" AUTOVERSION="$rule" STADO_BIN="$stado_bin" \
               scripts/version_check_proof.sh stado-rs/target/release/stado; then
            proved=no
          fi

          if [ "$proved" != yes ]; then
            echo "::error::scripts/version_check_proof.sh did not behave as specified, so" \
              "this gate has not been shown to refuse and any pass it reports is" \
              "worthless. Read its per-case output above before trusting the verdict."
          fi
          if [ "$judged" != pass ]; then
            echo "::error::the version check refused this revision. Its own message above" \
              "names the required version. Neither this workflow nor that script bumps a" \
              "version or regenerates a baseline; a person does."
          fi
          if [ "$proved" != yes ] || [ "$judged" != pass ]; then
            false
          fi
          echo "The gate refused all four of its refusal cases and passed this revision."

  release-quality-gate:
    # Run the quality steps the release worker runs, on the change that
    # introduces them.
    #
    # Before this job a pull request in this repository was judged by
    # `version-check` and nothing else: no formatting check, no clippy, and no
    # compilation of anything except `--bin stado`. Four defects reached `main`
    # through that hole inside one week, each of them found by the RELEASE
    # instead:
    #
    #   #212  nine `pub mod` declarations deleted while their files stayed on
    #         disk, so `main` did not compile
    #   #249  `stado-rs/src/targets.rs` and `stado-rs/tests/registry_cache/main.rs`
    #         merged unformatted; the 0.13.27 product-release run refused on
    #         them at 06:13Z on 2026-09-01, six hours before anyone was looking
    #   #250  `clippy::empty_line_after_doc_comments` in
    #         `src/cli/registry.rs`, which left `main` unable to pass its own
    #         release gate at all
    #   and a test tree that nothing in CI had ever compiled
    #
    # The definition of "good" is NOT restated here. `.wisent-release.json` is
    # the product's own release-pipeline manifest: `stado release submit` reads
    # `platforms.<platform>.quality` out of it and the release worker executes
    # exactly those argv, in order, before it builds
    # (`cli::release_submit::worker`). This job reads the same key out of the
    # same file and executes the same argv. There is one declaration and it is
    # used twice, so this check cannot drift from the gate it is standing in
    # for -- add a quality step for the release and the pull request runs it
    # with no edit here.
    #
    # What this job deliberately does NOT do is re-run the manifest's `build`
    # step. That step is `cargo build --manifest-path stado-rs/Cargo.toml
    # --locked --release --bin stado`, and the `version-check` job above
    # already builds precisely that, in this same workflow run, because it
    # needs the binary to read the advertised surface. A second twelve-minute
    # release build would buy no signal, and `--all-targets` below type-checks
    # every bin, test and example the crate declares -- including the seven
    # `[[bin]]` targets and the 27 integration tests that `--bin stado` never
    # touches.
    #
    # It also does not run the test suite, and that is not an oversight: the
    # release gate does not run it either, and this repository's integration
    # tests are Probierz journeys against live fleet resources. `tests/channel`
    # says so in its own first line -- "deliberately ignored by a plain `cargo
    # test`: it needs the public control origin and one immutable release
    # coordinate. Probierz supplies both". A hosted `cargo test` would fail on
    # the fleet's absence rather than on the change, and a check that is red
    # for reasons the author cannot fix is a check the next person deletes. So
    # this job refuses a test tree that cannot COMPILE, which is the defect
    # that actually reached `main`, and leaves the running of journeys to
    # Probierz, which owns it.
    runs-on: ubuntu-latest
    # Hosted, not `[self-hosted, stado-control-plane]`. Exactly one runner
    # carries that label and both publish legs of the release train queue on
    # it; putting a per-pull-request gate there would make every PR compete
    # with publication for the fleet's only publisher.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install the components the declared steps need
        # `rust-toolchain.toml` pins 1.97.1 with `profile = "minimal"`, which
        # carries neither rustfmt nor clippy, so a bare `cargo fmt` here fails
        # with "no such command" rather than with a formatting verdict. rustup
        # reads the pin from the working directory, so this lands the components
        # on exactly the toolchain the steps below will use -- the same reason
        # and the same mechanism as `release_submit::ensure_rust_components`,
        # which does this for the release worker on the build host.
        run: rustup component add rustfmt clippy

      - name: Run every quality step the release manifest declares
        env:
          MANIFEST: .wisent-release.json
          # On a pull request the base branch; on a push to `main` the commit
          # BEFORE that push, because comparing `main` against `origin/main`
          # compares the revision under judgement against itself and answers
          # `inherited` for everything.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        # One implementation, checked in and runnable by hand:
        # `scripts/quality_gate.sh` reads the same `platforms.<platform>.quality`
        # the release worker executes and runs exactly those argv. It also says
        # WHOSE revision a refusal belongs to, by re-running the refused step
        # against the base in its own worktree -- because a pull request is
        # judged on its merge result, so a step already refusing `main` refuses
        # every pull request opened against it, for files their authors never
        # touched. That happened three times on 2026-09-04/05 and each time the
        # gate said "fix the tree" to the wrong person.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "$BASE_REF" >/dev/null 2>&1 || true
          bash scripts/quality_gate.sh --manifest "$MANIFEST" --base "$BASE_REF"
